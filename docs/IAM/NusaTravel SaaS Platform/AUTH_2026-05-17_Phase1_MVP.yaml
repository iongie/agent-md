      # ─── Guards ───
      - file_name: "guards/jwt-auth.guard.ts"
        type: "Guard"
        description: >
          Global JWT authentication guard. Mengekstrak JWT dari httpOnly cookie
          `access_token` atau Authorization header (Bearer token). Memvalidasi
          signature & expiry, lalu attach user payload ke `request.user`.
        code_snippet: |
          import {
            Injectable, ExecutionContext, UnauthorizedException, Logger,
          } from '@nestjs/common';
          import { AuthGuard } from '@nestjs/passport';
          import { Reflector } from '@nestjs/core';
          import { IS_PUBLIC_KEY } from '../../iam/decorators/public.decorator';

          @Injectable()
          export class JwtAuthGuard extends AuthGuard('jwt') {
            private readonly logger = new Logger(JwtAuthGuard.name);

            constructor(private reflector: Reflector) {
              super();
            }

            canActivate(context: ExecutionContext) {
              const isPublic = this.reflector.getAllAndOverride<boolean>(IS_PUBLIC_KEY, [
                context.getHandler(),
                context.getClass(),
              ]);
              if (isPublic) return true;
              return super.canActivate(context);
            }

            handleRequest(err: any, user: any, info: any, context: ExecutionContext) {
              if (err || !user) {
                this.logger.warn(`JWT auth failed: ${info?.message ?? 'No user'}`);
                throw err || new UnauthorizedException('Token tidak valid atau kadaluarsa');
              }

              // Check if user is still active
              if (user.status && user.status !== 'active') {
                throw new UnauthorizedException('Akun tidak aktif');
              }

              return user;
            }
          }

      - file_name: "guards/google-oauth.guard.ts"
        type: "Guard"
        description: "Passport Google OAuth2.0 guard untuk redirect flow."
        code_snippet: |
          import { Injectable, ExecutionContext } from '@nestjs/common';
          import { AuthGuard } from '@nestjs/passport';

          @Injectable()
          export class GoogleOAuthGuard extends AuthGuard('google') {
            async canActivate(context: ExecutionContext) {
              const result = (await super.canActivate(context)) as boolean;
              const request = context.switchToHttp().getRequest();
              await super.logIn(request);
              return result;
            }
          }

      # ─── Strategies ───
      - file_name: "strategies/jwt.strategy.ts"
        type: "Strategy"
        description: >
          Passport JWT strategy. Mengekstrak token dari cookie `access_token`
          atau Authorization header. Memvalidasi dan mengembalikan payload user
          yang berisi id, email, tenant_id, roles, dan permissions.
        code_snippet: |
          import { Injectable, UnauthorizedException } from '@nestjs/common';
          import { PassportStrategy } from '@nestjs/passport';
          import { ExtractJwt, Strategy } from 'passport-jwt';
          import { ConfigService } from '@nestjs/config';
          import { Request } from 'express';

          @Injectable()
          export class JwtStrategy extends PassportStrategy(Strategy, 'jwt') {
            constructor(configService: ConfigService) {
              super({
                jwtFromRequest: ExtractJwt.fromExtractors([
                  // Priority 1: httpOnly cookie
                  (req: Request) => req?.cookies?.access_token ?? null,
                  // Priority 2: Authorization Bearer header
                  ExtractJwt.fromAuthHeaderAsBearerToken(),
                ]),
                ignoreExpiration: false,
                secretOrKey: configService.get<string>('JWT_ACCESS_SECRET'),
              });
            }

            async validate(payload: {
              sub: string;
              email: string;
              tenant_id: string | null;
              roles: string[];
              permissions: string[];
            }) {
              return {
                id: payload.sub,
                email: payload.email,
                tenantId: payload.tenant_id,
                roles: payload.roles,
                permissions: payload.permissions,
              };
            }
          }

      - file_name: "strategies/google.strategy.ts"
        type: "Strategy"
        description: >
          Passport Google OAuth2.0 strategy. Mengkonfigurasi client ID/secret,
          callback URL, dan scope (email, profile). Mengembalikan Google profile
          yang akan diproses oleh AuthService.googleLogin().
        code_snippet: |
          import { Injectable } from '@nestjs/common';
          import { PassportStrategy } from '@nestjs/passport';
          import { Strategy, VerifyCallback } from 'passport-google-oauth20';
          import { ConfigService } from '@nestjs/config';

          @Injectable()
          export class GoogleStrategy extends PassportStrategy(Strategy, 'google') {
            constructor(configService: ConfigService) {
              super({
                clientID: configService.get<string>('GOOGLE_CLIENT_ID'),
                clientSecret: configService.get<string>('GOOGLE_CLIENT_SECRET'),
                callbackURL: configService.get<string>('GOOGLE_CALLBACK_URL'),
                scope: ['email', 'profile'],
              });
            }

            async validate(
              accessToken: string,
              refreshToken: string,
              profile: any,
              done: VerifyCallback,
            ): Promise<any> {
              const { id, name, emails, photos } = profile;
              const user = {
                googleId: id,
                email: emails[0].value,
                name: name?.givenName + ' ' + name?.familyName || emails[0].value,
                avatar: photos?.[0]?.value ?? null,
              };
              done(null, user);
            }
          }

      # ─── Module ───
      - file_name: "auth.module.ts"
        type: "Module"
        description: >
          NestJS module untuk autentikasi. Mengimpor JwtModule, PassportModule,
          TypeOrmModule (User, UserSession, AuditLog), MailModule, dan
          NotificationsModule. Mengekspor AuthService untuk digunakan modul lain.
        code_snippet: |
          import { Module } from '@nestjs/common';
          import { JwtModule } from '@nestjs/jwt';
          import { PassportModule } from '@nestjs/passport';
          import { TypeOrmModule } from '@nestjs/typeorm';
          import { ConfigModule, ConfigService } from '@nestjs/config';
          import { AuthController } from './auth.controller';
          import { AuthService } from './auth.service';
          import { JwtStrategy } from './strategies/jwt.strategy';
          import { GoogleStrategy } from './strategies/google.strategy';
          import { JwtAuthGuard } from './guards/jwt-auth.guard';
          import { User } from '../users/entities/user.entity';
          import { UserSession } from '../users/entities/user-session.entity';
          import { AuditLog } from '../audit/entities/audit-log.entity';
          import { MailModule } from '../mail/mail.module';
          import { NotificationsModule } from '../notifications/notifications.module';
          import { TenantModule } from '../tenant/tenant.module';

          @Module({
            imports: [
              TypeOrmModule.forFeature([User, UserSession, AuditLog]),
              PassportModule.register({ defaultStrategy: 'jwt' }),
              JwtModule.registerAsync({
                imports: [ConfigModule],
                inject: [ConfigService],
                useFactory: (config: ConfigService) => ({
                  secret: config.get<string>('JWT_ACCESS_SECRET'),
                  signOptions: {
                    expiresIn: '15m',
                    issuer: 'nusatravel-api',
                  },
                }),
              }),
              MailModule,
              NotificationsModule,
              TenantModule,
            ],
            controllers: [AuthController],
            providers: [AuthService, JwtStrategy, GoogleStrategy, JwtAuthGuard],
            exports: [AuthService, JwtAuthGuard, JwtModule],
          })
          export class AuthModule {}
