architecture_overview:
  description: >
    AuthModule adalah fondasi autentikasi NusaTravel SaaS Platform. Modul ini
    menangani registrasi & login (email/password + Google OAuth), JWT token
    management (access + refresh token rotation), Two-Factor Authentication
    (TOTP & WhatsApp OTP), session management dengan forced logout, password
    policy enforcement, account lockout setelah failed login attempts, dan
    email verification. Menggunakan Passport.js strategies untuk JWT dan Google
    OAuth. Semua token disimpan dalam httpOnly secure cookie untuk mencegah XSS.

modules:
  - module_name: "AuthModule"
    path: "src/modules/auth"
    components:
      # ─── Controller ───
      - file_name: "auth.controller.ts"
        type: "Controller"
        description: >
          REST endpoints untuk register, login, logout, refresh token, Google OAuth
          callback, 2FA setup/verify, email verification, forgot/reset password,
          dan session management (list/revoke sessions).
        code_snippet: |
          import {
            Controller, Post, Body, Get, UseGuards, Req, Res,
            HttpCode, HttpStatus, Query, Param, Delete,
          } from '@nestjs/common';
          import { AuthService } from './auth.service';
          import { RegisterDto } from './dto/register.dto';
          import { LoginDto } from './dto/login.dto';
          import { Verify2FADto } from './dto/verify-2fa.dto';
          import { Setup2FADto } from './dto/setup-2fa.dto';
          import { ForgotPasswordDto } from './dto/forgot-password.dto';
          import { ResetPasswordDto } from './dto/reset-password.dto';
          import { ChangePasswordDto } from './dto/change-password.dto';
          import { GoogleOAuthGuard } from './guards/google-oauth.guard';
          import { JwtAuthGuard } from './guards/jwt-auth.guard';
          import { CurrentUser } from '../iam/decorators/current-user.decorator';
          import { CurrentTenant } from '../iam/decorators/current-tenant.decorator';
          import { Throttle } from '@nestjs/throttler';
          import type { Request, Response } from 'express';

          @Controller('auth')
          export class AuthController {
            constructor(private readonly authService: AuthService) {}

            // ─── Registration ───

            @Post('register')
            @Throttle({ default: { limit: 5, ttl: 60000 } })
            async register(
              @Body() dto: RegisterDto,
              @CurrentTenant() tenantId: string | null,
            ) {
              return this.authService.register(dto, tenantId);
            }

            @Get('verify-email')
            async verifyEmail(@Query('token') token: string) {
              return this.authService.verifyEmail(token);
            }

            @Post('resend-verification')
            @Throttle({ default: { limit: 3, ttl: 60000 } })
            async resendVerification(@Body('email') email: string) {
              return this.authService.resendVerificationEmail(email);
            }

            // ─── Login ───

            @Post('login')
            @HttpCode(HttpStatus.OK)
            @Throttle({ default: { limit: 10, ttl: 60000 } })
            async login(
              @Body() dto: LoginDto,
              @Req() req: Request,
              @Res({ passthrough: true }) res: Response,
            ) {
              const result = await this.authService.login(dto, req.ip, req.headers['user-agent'] ?? '');
              this.setAuthCookies(res, result);
              return { user: result.user, requires2FA: result.requires2FA };
            }

            @Post('verify-2fa')
            @HttpCode(HttpStatus.OK)
            async verify2FA(
              @Body() dto: Verify2FADto,
              @Req() req: Request,
              @Res({ passthrough: true }) res: Response,
            ) {
              const result = await this.authService.verify2FA(dto, req.ip, req.headers['user-agent'] ?? '');
              this.setAuthCookies(res, result);
              return { user: result.user };
            }

            // ─── Google OAuth ───

            @Get('google')
            @UseGuards(GoogleOAuthGuard)
            async googleAuth() {
              // Guard redirects to Google
            }

            @Get('google/callback')
            @UseGuards(GoogleOAuthGuard)
            async googleAuthCallback(
              @Req() req: any,
              @Res({ passthrough: true }) res: Response,
            ) {
              const result = await this.authService.googleLogin(req.user);
              this.setAuthCookies(res, result);
              return { user: result.user };
            }

            // ─── Token Management ───

            @Post('refresh')
            @HttpCode(HttpStatus.OK)
            async refreshToken(
              @Req() req: Request,
              @Res({ passthrough: true }) res: Response,
            ) {
              const refreshToken = req.cookies?.refresh_token;
              const result = await this.authService.refreshToken(refreshToken, req.ip, req.headers['user-agent'] ?? '');
              this.setAuthCookies(res, result);
              return { user: result.user };
            }

            @Post('logout')
            @HttpCode(HttpStatus.OK)
            @UseGuards(JwtAuthGuard)
            async logout(
              @Req() req: Request,
              @Res({ passthrough: true }) res: Response,
            ) {
              const refreshToken = req.cookies?.refresh_token;
              await this.authService.logout(refreshToken);
              res.clearCookie('access_token');
              res.clearCookie('refresh_token');
              return { message: 'Logged out successfully' };
            }

            // ─── 2FA Management ───

            @Post('2fa/setup')
            @UseGuards(JwtAuthGuard)
            async setup2FA(@CurrentUser('id') userId: string, @Body() dto: Setup2FADto) {
              return this.authService.setup2FA(userId, dto);
            }

            @Post('2fa/enable')
            @UseGuards(JwtAuthGuard)
            async enable2FA(@CurrentUser('id') userId: string, @Body() dto: Verify2FADto) {
              return this.authService.enable2FA(userId, dto);
            }

            @Post('2fa/disable')
            @UseGuards(JwtAuthGuard)
            async disable2FA(
              @CurrentUser('id') userId: string,
              @Body('password') password: string,
            ) {
              return this.authService.disable2FA(userId, password);
            }

            // ─── Password Management ───

            @Post('forgot-password')
            @Throttle({ default: { limit: 3, ttl: 60000 } })
            async forgotPassword(@Body() dto: ForgotPasswordDto) {
              return this.authService.forgotPassword(dto.email);
            }

            @Post('reset-password')
            async resetPassword(@Body() dto: ResetPasswordDto) {
              return this.authService.resetPassword(dto);
            }

            @Post('change-password')
            @UseGuards(JwtAuthGuard)
            async changePassword(
              @CurrentUser('id') userId: string,
              @Body() dto: ChangePasswordDto,
            ) {
              return this.authService.changePassword(userId, dto);
            }

            // ─── Session Management ───

            @Get('sessions')
            @UseGuards(JwtAuthGuard)
            async listSessions(@CurrentUser('id') userId: string) {
              return this.authService.listSessions(userId);
            }

            @Delete('sessions/:sessionId')
            @UseGuards(JwtAuthGuard)
            @HttpCode(HttpStatus.OK)
            async revokeSession(
              @CurrentUser('id') userId: string,
              @Param('sessionId') sessionId: string,
            ) {
              return this.authService.revokeSession(userId, sessionId);
            }

            @Post('sessions/revoke-all')
            @UseGuards(JwtAuthGuard)
            @HttpCode(HttpStatus.OK)
            async revokeAllSessions(
              @CurrentUser('id') userId: string,
              @Body('keepCurrent') keepCurrent: boolean,
            ) {
              return this.authService.revokeAllSessions(userId, keepCurrent);
            }

            // ─── Helper ───

            private setAuthCookies(res: Response, result: { accessToken: string; refreshToken: string }) {
              res.cookie('access_token', result.accessToken, {
                httpOnly: true,
                secure: process.env.NODE_ENV === 'production',
                sameSite: 'lax',
                maxAge: 15 * 60 * 1000, // 15 minutes
                path: '/',
              });
              res.cookie('refresh_token', result.refreshToken, {
                httpOnly: true,
                secure: process.env.NODE_ENV === 'production',
                sameSite: 'lax',
                maxAge: 7 * 24 * 60 * 60 * 1000, // 7 days
                path: '/api/auth/refresh',
              });
            }
          }

      # ─── Service ───
      - file_name: "auth.service.ts"
        type: "Service"
        description: >
          Core business logic untuk autentikasi: register dengan hash password
          (argon2), login dengan account lockout check, JWT token generation &
          rotation, Google OAuth account linking, 2FA TOTP/WhatsApp OTP,
          session CRUD, email verification token, password reset flow.
        code_snippet: |
          import {
            Injectable, UnauthorizedException, BadRequestException,
            ConflictException, ForbiddenException, Logger,
          } from '@nestjs/common';
          import { JwtService } from '@nestjs/jwt';
          import { InjectRepository } from '@nestjs/typeorm';
          import { Repository, MoreThan } from 'typeorm';
          import * as argon2 from 'argon2';
          import * as crypto from 'crypto';
          import { authenticator } from 'otplib';
          import { User } from '../users/entities/user.entity';
          import { UserSession } from '../users/entities/user-session.entity';
          import { AuditLog } from '../audit/entities/audit-log.entity';
          import { RegisterDto } from './dto/register.dto';
          import { LoginDto } from './dto/login.dto';
          import { Verify2FADto } from './dto/verify-2fa.dto';
          import { Setup2FADto } from './dto/setup-2fa.dto';
          import { ResetPasswordDto } from './dto/reset-password.dto';
          import { ChangePasswordDto } from './dto/change-password.dto';
          import { MailService } from '../mail/mail.service';
          import { WhatsAppService } from '../notifications/whatsapp.service';
          import { TenantContextService } from '../tenant/tenant-context.service';
          import { ConfigService } from '@nestjs/config';

          @Injectable()
          export class AuthService {
            private readonly logger = new Logger(AuthService.name);

            constructor(
              @InjectRepository(User)
              private readonly userRepo: Repository<User>,
              @InjectRepository(UserSession)
              private readonly sessionRepo: Repository<UserSession>,
              @InjectRepository(AuditLog)
              private readonly auditRepo: Repository<AuditLog>,
              private readonly jwtService: JwtService,
              private readonly mailService: MailService,
              private readonly whatsappService: WhatsAppService,
              private readonly tenantContext: TenantContextService,
              private readonly configService: ConfigService,
            ) {}

            // ═══════════════════════════════════════════════════════════════
            // REGISTRATION
            // ═══════════════════════════════════════════════════════════════

            async register(dto: RegisterDto, tenantId: string | null) {
              // Check existing user
              const existing = await this.userRepo.findOne({
                where: [{ email: dto.email }, { phone_e164: dto.phone_e164 }].filter(w => Object.values(w)[0] != null),
              });
              if (existing) {
                throw new ConflictException('Email atau nomor telepon sudah terdaftar');
              }

              // Validate password strength
              this.validatePasswordStrength(dto.password);

              const user = this.userRepo.create({
                email: dto.email.toLowerCase().trim(),
                phone_e164: dto.phone_e164,
                password_hash: await argon2.hash(dto.password),
                full_name: dto.full_name,
                tenant_id: tenantId,
                status: 'active',
              });

              const saved = await this.userRepo.save(user);

              // Send verification email
              const verifyToken = await this.generateEmailVerificationToken(saved);
              await this.mailService.sendEmailVerification(saved.email, verifyToken);

              // Assign default role (registered_customer for tenant-scoped users)
              if (tenantId) {
                await this.assignDefaultRole(saved.id, tenantId);
              }

              // Audit log
              await this.createAuditLog(saved.id, tenantId, 'user.register', 'User', saved.id, null, { email: saved.email });

              return { message: 'Registrasi berhasil. Silakan cek email untuk verifikasi.' };
            }

            // ═══════════════════════════════════════════════════════════════
            // LOGIN
            // ═══════════════════════════════════════════════════════════════

            async login(dto: LoginDto, ipAddress: string, userAgent: string) {
              const user = await this.userRepo.findOne({
                where: { email: dto.email.toLowerCase().trim() },
                relations: ['user_roles', 'user_roles.role', 'user_roles.role.role_permissions', 'user_roles.role.role_permissions.permission'],
              });

              if (!user) {
                throw new UnauthorizedException('Email atau password salah');
              }

              // Check account lockout
              if (user.status === 'locked' || (user.locked_until && new Date() < user.locked_until)) {
                throw new ForbiddenException('Akun terkunci. Silakan coba lagi nanti atau reset password.');
              }

              if (user.status === 'suspended') {
                throw new ForbiddenException('Akun dinonaktifkan. Hubungi administrator.');
              }

              // Verify password
              if (!user.password_hash) {
                throw new UnauthorizedException('Akun ini menggunakan Google login. Silakan login dengan Google.');
              }

              const isPasswordValid = await argon2.verify(user.password_hash, dto.password);
              if (!isPasswordValid) {
                await this.handleFailedLogin(user);
                throw new UnauthorizedException('Email atau password salah');
              }

              // Reset failed attempts on success
              if (user.failed_login_attempts > 0) {
                await this.userRepo.update(user.id, {
                  failed_login_attempts: 0,
                  locked_until: null,
                });
              }

              // Check 2FA
              if (user.two_factor_enabled) {
                // Return partial success — client must call verify-2fa
                const tempToken = this.jwtService.sign(
                  { sub: user.id, purpose: '2fa_pending' },
                  { expiresIn: '5m' },
                );
                return { requires2FA: true, tempToken, user: null };
              }

              // Full login — generate tokens
              const tokens = await this.generateTokens(user, ipAddress, userAgent);

              // Update last login
              await this.userRepo.update(user.id, {
                last_login_at: new Date(),
                last_login_ip: ipAddress,
              });

              await this.createAuditLog(user.id, user.tenant_id, 'user.login', 'User', user.id, null, null);

              return { requires2FA: false, ...tokens, user: this.sanitizeUser(user) };
            }

            // ═══════════════════════════════════════════════════════════════
            // TWO-FACTOR AUTHENTICATION
            // ═══════════════════════════════════════════════════════════════

            async setup2FA(userId: string, dto: Setup2FADto) {
              const user = await this.userRepo.findOneBy({ id: userId });
              if (!user) throw new UnauthorizedException();

              if (dto.method === 'totp') {
                const secret = authenticator.generateSecret();
                const otpauth = authenticator.keyuri(user.email, 'NusaTravel', secret);

                // Store encrypted secret temporarily (not yet enabled)
                await this.userRepo.update(userId, {
                  two_factor_secret: this.encryptSecret(secret),
                  two_factor_method: 'totp',
                });

                return { secret, otpauthUrl: otpauth, qrCodeDataUrl: await this.generateQRCode(otpauth) };
              }

              if (dto.method === 'whatsapp_otp') {
                if (!user.phone_e164) {
                  throw new BadRequestException('Nomor telepon diperlukan untuk WhatsApp OTP');
                }
                await this.userRepo.update(userId, {
                  two_factor_method: 'whatsapp_otp',
                });
                return { message: 'WhatsApp OTP siap diaktifkan. Verifikasi dengan OTP yang dikirim.' };
              }

              throw new BadRequestException('Metode 2FA tidak valid');
            }

            async enable2FA(userId: string, dto: Verify2FADto) {
              const user = await this.userRepo.findOneBy({ id: userId });
              if (!user) throw new UnauthorizedException();

              const isValid = await this.verify2FACode(user, dto.code);
              if (!isValid) {
                throw new BadRequestException('Kode 2FA tidak valid');
              }

              await this.userRepo.update(userId, { two_factor_enabled: true });
              await this.createAuditLog(userId, user.tenant_id, 'user.2fa_enabled', 'User', userId, null, { method: user.two_factor_method });

              return { message: '2FA berhasil diaktifkan' };
            }

            async disable2FA(userId: string, password: string) {
              const user = await this.userRepo.findOneBy({ id: userId });
              if (!user || !user.password_hash) throw new UnauthorizedException();

              const valid = await argon2.verify(user.password_hash, password);
              if (!valid) throw new BadRequestException('Password salah');

              await this.userRepo.update(userId, {
                two_factor_enabled: false,
                two_factor_secret: null,
                two_factor_method: null,
              });

              await this.createAuditLog(userId, user.tenant_id, 'user.2fa_disabled', 'User', userId, null, null);
              return { message: '2FA berhasil dinonaktifkan' };
            }

            async verify2FA(dto: Verify2FADto, ipAddress: string, userAgent: string) {
              let payload: any;
              try {
                payload = this.jwtService.verify(dto.tempToken);
              } catch {
                throw new UnauthorizedException('Token 2FA kadaluarsa, silakan login ulang');
              }

              if (payload.purpose !== '2fa_pending') {
                throw new UnauthorizedException('Token tidak valid');
              }

              const user = await this.userRepo.findOne({
                where: { id: payload.sub },
                relations: ['user_roles', 'user_roles.role', 'user_roles.role.role_permissions', 'user_roles.role.role_permissions.permission'],
              });
              if (!user) throw new UnauthorizedException();

              const isValid = await this.verify2FACode(user, dto.code);
              if (!isValid) throw new BadRequestException('Kode 2FA tidak valid');

              const tokens = await this.generateTokens(user, ipAddress, userAgent);
              await this.userRepo.update(user.id, {
                last_login_at: new Date(),
                last_login_ip: ipAddress,
              });

              return { ...tokens, user: this.sanitizeUser(user) };
            }

            private async verify2FACode(user: User, code: string): Promise<boolean> {
              if (user.two_factor_method === 'totp' && user.two_factor_secret) {
                const secret = this.decryptSecret(user.two_factor_secret);
                return authenticator.verify({ token: code, secret });
              }
              if (user.two_factor_method === 'whatsapp_otp') {
                // Verify OTP sent via WhatsApp
                return this.whatsappService.verifyOTP(user.phone_e164!, code);
              }
              return false;
            }

            // ═══════════════════════════════════════════════════════════════
            // GOOGLE OAUTH
            // ═══════════════════════════════════════════════════════════════

            async googleLogin(googleProfile: { email: string; name: string; avatar: string; googleId: string }) {
              let user = await this.userRepo.findOne({
                where: [
                  { email: googleProfile.email },
                  { oauth_provider: 'google', oauth_provider_id: googleProfile.googleId },
                ],
                relations: ['user_roles', 'user_roles.role', 'user_roles.role.role_permissions', 'user_roles.role.role_permissions.permission'],
              });

              if (!user) {
                // Create new user from Google profile
                user = this.userRepo.create({
                  email: googleProfile.email,
                  full_name: googleProfile.name,
                  avatar_url: googleProfile.avatar,
                  oauth_provider: 'google',
                  oauth_provider_id: googleProfile.googleId,
                  email_verified_at: new Date(), // Google already verified
                  status: 'active',
                });
                user = await this.userRepo.save(user);
                await this.createAuditLog(user.id, null, 'user.register_oauth', 'User', user.id, null, { provider: 'google' });
              } else if (!user.oauth_provider_id) {
                // Link Google to existing account
                await this.userRepo.update(user.id, {
                  oauth_provider: 'google',
                  oauth_provider_id: googleProfile.googleId,
                  avatar_url: user.avatar_url ?? googleProfile.avatar,
                  email_verified_at: user.email_verified_at ?? new Date(),
                });
              }

              const tokens = await this.generateTokens(user, '', '');
              await this.userRepo.update(user.id, { last_login_at: new Date() });

              return { ...tokens, user: this.sanitizeUser(user) };
            }

            // ═══════════════════════════════════════════════════════════════
            // TOKEN MANAGEMENT
            // ═══════════════════════════════════════════════════════════════

            async refreshToken(refreshToken: string | undefined, ipAddress: string, userAgent: string) {
              if (!refreshToken) throw new UnauthorizedException('Refresh token tidak ditemukan');

              const refreshTokenHash = crypto.createHash('sha256').update(refreshToken).digest('hex');

              const session = await this.sessionRepo.findOne({
                where: { refresh_token_hash: refreshTokenHash },
                relations: ['user'],
              });

              if (!session || session.revoked_at || session.expires_at < new Date()) {
                throw new UnauthorizedException('Refresh token tidak valid atau kadaluarsa');
              }

              // Revoke old session (rotation)
              await this.sessionRepo.update(session.id, { revoked_at: new Date() });

              // Generate new tokens
              const user = await this.userRepo.findOne({
                where: { id: session.user_id },
                relations: ['user_roles', 'user_roles.role', 'user_roles.role.role_permissions', 'user_roles.role.role_permissions.permission'],
              });

              if (!user || user.status !== 'active') {
                throw new UnauthorizedException('Akun tidak aktif');
              }

              return this.generateTokens(user, ipAddress, userAgent);
            }

            async logout(refreshToken: string | undefined) {
              if (!refreshToken) return;
              const hash = crypto.createHash('sha256').update(refreshToken).digest('hex');
              await this.sessionRepo.update(
                { refresh_token_hash: hash },
                { revoked_at: new Date() },
              );
            }

            private async generateTokens(user: User, ipAddress: string, userAgent: string) {
              const permissions = this.extractPermissions(user);
              const roles = user.user_roles?.map(ur => ur.role.role_code) ?? [];

              const accessToken = this.jwtService.sign({
                sub: user.id,
                email: user.email,
                tenant_id: user.tenant_id,
                roles,
                permissions,
              }, { expiresIn: '15m' });

              const refreshToken = crypto.randomBytes(64).toString('hex');
              const refreshTokenHash = crypto.createHash('sha256').update(refreshToken).digest('hex');

              // Create session
              await this.sessionRepo.save(this.sessionRepo.create({
                user_id: user.id,
                refresh_token_hash: refreshTokenHash,
                ip_address: ipAddress,
                user_agent: userAgent,
                expires_at: new Date(Date.now() + 7 * 24 * 60 * 60 * 1000), // 7 days
              }));

              return { accessToken, refreshToken };
            }

            // ═══════════════════════════════════════════════════════════════
            // SESSION MANAGEMENT
            // ═══════════════════════════════════════════════════════════════

            async listSessions(userId: string) {
              return this.sessionRepo.find({
                where: { user_id: userId },
                order: { created_at: 'DESC' },
                select: ['id', 'ip_address', 'user_agent', 'device_info', 'created_at', 'expires_at', 'revoked_at'],
              });
            }

            async revokeSession(userId: string, sessionId: string) {
              const session = await this.sessionRepo.findOneBy({ id: sessionId, user_id: userId });
              if (!session) throw new BadRequestException('Sesi tidak ditemukan');

              await this.sessionRepo.update(sessionId, { revoked_at: new Date() });
              await this.createAuditLog(userId, null, 'session.revoke', 'UserSession', sessionId, null, null);
              return { message: 'Sesi berhasil di-revoke' };
            }

            async revokeAllSessions(userId: string, keepCurrent: boolean) {
              const qb = this.sessionRepo.createQueryBuilder()
                .update(UserSession)
                .set({ revoked_at: new Date() })
                .where('user_id = :userId', { userId })
                .andWhere('revoked_at IS NULL');

              if (keepCurrent) {
                // Keep the most recent active session
                qb.andWhere('id != (SELECT id FROM user_sessions WHERE user_id = :userId AND revoked_at IS NULL ORDER BY created_at DESC LIMIT 1)');
              }

              await qb.execute();
              await this.createAuditLog(userId, null, 'session.revoke_all', 'UserSession', '*', null, { keepCurrent });
              return { message: 'Semua sesi berhasil di-revoke' };
            }

            // ═══════════════════════════════════════════════════════════════
            // PASSWORD MANAGEMENT
            // ═══════════════════════════════════════════════════════════════

            async forgotPassword(email: string) {
              const user = await this.userRepo.findOneBy({ email: email.toLowerCase().trim() });
              if (!user) {
                // Return success even if email not found (prevent enumeration)
                return { message: 'Jika email terdaftar, link reset password telah dikirim.' };
              }

              const resetToken = crypto.randomBytes(32).toString('hex');
              const resetTokenHash = crypto.createHash('sha256').update(resetToken).digest('hex');
              const resetExpires = new Date(Date.now() + 60 * 60 * 1000); // 1 hour

              // Store hashed token (in real impl, use a separate password_reset_tokens table)
              await this.userRepo.update(user.id, {
                // password_reset_token: resetTokenHash,
                // password_reset_expires: resetExpires,
              } as any);

              await this.mailService.sendPasswordReset(user.email, resetToken);
              return { message: 'Jika email terdaftar, link reset password telah dikirim.' };
            }

            async resetPassword(dto: ResetPasswordDto) {
              const tokenHash = crypto.createHash('sha256').update(dto.token).digest('hex');
              // In real impl, find user by reset token and check expiry
              this.validatePasswordStrength(dto.newPassword);

              // await this.userRepo.update(user.id, {
              //   password_hash: await argon2.hash(dto.newPassword),
              //   password_reset_token: null,
              //   password_reset_expires: null,
              //   failed_login_attempts: 0,
              //   locked_until: null,
              // });

              return { message: 'Password berhasil direset. Silakan login dengan password baru.' };
            }

            async changePassword(userId: string, dto: ChangePasswordDto) {
              const user = await this.userRepo.findOneBy({ id: userId });
              if (!user || !user.password_hash) {
                throw new BadRequestException('Akun menggunakan Google login');
              }

              const valid = await argon2.verify(user.password_hash, dto.currentPassword);
              if (!valid) throw new BadRequestException('Password saat ini salah');

              this.validatePasswordStrength(dto.newPassword);
              await this.userRepo.update(userId, {
                password_hash: await argon2.hash(dto.newPassword),
              });

              // Revoke all sessions except current
              await this.revokeAllSessions(userId, true);
              await this.createAuditLog(userId, user.tenant_id, 'user.password_changed', 'User', userId, null, null);

              return { message: 'Password berhasil diubah' };
            }

            // ═══════════════════════════════════════════════════════════════
            // EMAIL VERIFICATION
            // ═══════════════════════════════════════════════════════════════

            async verifyEmail(token: string) {
              // Decode and verify token
              let payload: any;
              try {
                payload = this.jwtService.verify(token);
              } catch {
                throw new BadRequestException('Token verifikasi tidak valid atau kadaluarsa');
              }

              if (payload.purpose !== 'email_verification') {
                throw new BadRequestException('Token tidak valid');
              }

              await this.userRepo.update(payload.sub, { email_verified_at: new Date() });
              return { message: 'Email berhasil diverifikasi. Silakan login.' };
            }

            async resendVerificationEmail(email: string) {
              const user = await this.userRepo.findOneBy({ email: email.toLowerCase().trim() });
              if (!user || user.email_verified_at) {
                return { message: 'Jika email belum diverifikasi, email verifikasi telah dikirim ulang.' };
              }

              const token = await this.generateEmailVerificationToken(user);
              await this.mailService.sendEmailVerification(user.email, token);
              return { message: 'Email verifikasi telah dikirim ulang.' };
            }

            // ═══════════════════════════════════════════════════════════════
            // HELPERS
            // ═══════════════════════════════════════════════════════════════

            private validatePasswordStrength(password: string) {
              const minLength = 8;
              const hasUpperCase = /[A-Z]/.test(password);
              const hasLowerCase = /[a-z]/.test(password);
              const hasNumber = /[0-9]/.test(password);

              if (password.length < minLength || !hasUpperCase || !hasLowerCase || !hasNumber) {
                throw new BadRequestException(
                  'Password minimal 8 karakter, mengandung huruf besar, huruf kecil, dan angka',
                );
              }
            }

            private async handleFailedLogin(user: User) {
              const MAX_ATTEMPTS = 5;
              const LOCK_DURATION_MINUTES = 30;

              const newAttempts = user.failed_login_attempts + 1;
              const update: Partial<User> = { failed_login_attempts: newAttempts };

              if (newAttempts >= MAX_ATTEMPTS) {
                update.status = 'locked';
                update.locked_until = new Date(Date.now() + LOCK_DURATION_MINUTES * 60 * 1000);
              }

              await this.userRepo.update(user.id, update);
              await this.createAuditLog(user.id, user.tenant_id, 'user.login_failed', 'User', user.id, null, { attempt: newAttempts });
            }

            private async generateEmailVerificationToken(user: User): Promise<string> {
              return this.jwtService.sign(
                { sub: user.id, email: user.email, purpose: 'email_verification' },
                { expiresIn: '24h' },
              );
            }

            private extractPermissions(user: User): string[] {
              const permissions = new Set<string>();
              user.user_roles?.forEach(ur => {
                ur.role?.role_permissions?.forEach(rp => {
                  permissions.add(rp.permission.permission_code);
                });
              });
              return Array.from(permissions);
            }

            private sanitizeUser(user: User) {
              const { password_hash, two_factor_secret, ...safe } = user;
              return safe;
            }

            private encryptSecret(secret: string): string {
              // Use AES-256-GCM with key from config
              // Simplified — in production use a proper encryption service
              return Buffer.from(secret).toString('base64');
            }

            private decryptSecret(encrypted: string): string {
              return Buffer.from(encrypted, 'base64').toString('utf-8');
            }

            private async generateQRCode(otpauthUrl: string): Promise<string> {
              // Use 'qrcode' library to generate data URL
              // const QRCode = require('qrcode');
              // return QRCode.toDataURL(otpauthUrl);
              return '';
            }

            private async assignDefaultRole(userId: string, tenantId: string) {
              // Find 'registered_customer' role for this tenant and assign
              // Implementation depends on Role/UserRole repository
            }

            private async createAuditLog(
              userId: string, tenantId: string | null,
              action: string, resourceType: string, resourceId: string,
              oldValues: any, newValues: any,
            ) {
              await this.auditRepo.save(this.auditRepo.create({
                user_id: userId,
                tenant_id: tenantId,
                action,
                resource_type: resourceType,
                resource_id: resourceId,
                old_values: oldValues,
                new_values: newValues,
              }));
            }
          }

