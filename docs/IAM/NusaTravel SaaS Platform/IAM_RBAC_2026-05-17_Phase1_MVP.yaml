      # ─── Controller ───
      - file_name: "iam.controller.ts"
        type: "Controller"
        description: >
          REST endpoints untuk manajemen RBAC: CRUD role, list permissions,
          assign/revoke permission ke role, assign/revoke role ke user.
          Hanya bisa diakses oleh Super Admin dan Tenant Owner.
        code_snippet: |
          import {
            Controller, Get, Post, Put, Delete, Body, Param,
            UseGuards, HttpCode, HttpStatus,
          } from '@nestjs/common';
          import { RoleManagementService } from './services/role-management.service';
          import { CreateRoleDto } from './dto/create-role.dto';
          import { UpdateRoleDto } from './dto/update-role.dto';
          import { AssignPermissionsDto } from './dto/assign-permissions.dto';
          import { AssignRoleDto } from './dto/assign-role.dto';
          import { RequirePermissions } from './decorators/require-permissions.decorator';
          import { RequireRoles } from './decorators/require-roles.decorator';
          import { CurrentUser } from './decorators/current-user.decorator';
          import { CurrentTenant } from './decorators/current-tenant.decorator';
          import { JwtAuthGuard } from '../auth/guards/jwt-auth.guard';
          import { PermissionsGuard } from './guards/permissions.guard';

          @Controller('iam')
          @UseGuards(JwtAuthGuard, PermissionsGuard)
          export class IamController {
            constructor(private readonly roleService: RoleManagementService) {}

            // ─── Roles ───

            @Get('roles')
            @RequirePermissions('rbac.manage')
            async listRoles(@CurrentTenant() tenantId: string | null) {
              return this.roleService.findAllRoles(tenantId);
            }

            @Get('roles/:id')
            @RequirePermissions('rbac.manage')
            async getRole(@Param('id') id: string) {
              return this.roleService.findRoleById(id);
            }

            @Post('roles')
            @RequirePermissions('rbac.manage')
            async createRole(
              @Body() dto: CreateRoleDto,
              @CurrentTenant() tenantId: string | null,
              @CurrentUser('id') userId: string,
            ) {
              return this.roleService.createRole(dto, tenantId, userId);
            }

            @Put('roles/:id')
            @RequirePermissions('rbac.manage')
            async updateRole(
              @Param('id') id: string,
              @Body() dto: UpdateRoleDto,
              @CurrentUser('id') userId: string,
            ) {
              return this.roleService.updateRole(id, dto, userId);
            }

            @Delete('roles/:id')
            @RequirePermissions('rbac.manage')
            @HttpCode(HttpStatus.OK)
            async deleteRole(
              @Param('id') id: string,
              @CurrentUser('id') userId: string,
            ) {
              return this.roleService.deleteRole(id, userId);
            }

            // ─── Permissions ───

            @Get('permissions')
            @RequirePermissions('rbac.manage')
            async listPermissions() {
              return this.roleService.findAllPermissions();
            }

            @Get('permissions/by-resource')
            @RequirePermissions('rbac.manage')
            async listPermissionsByResource() {
              return this.roleService.getPermissionsByResource();
            }

            // ─── Role-Permission Assignment ───

            @Post('roles/:id/permissions')
            @RequirePermissions('rbac.manage')
            async assignPermissions(
              @Param('id') roleId: string,
              @Body() dto: AssignPermissionsDto,
              @CurrentUser('id') userId: string,
            ) {
              return this.roleService.assignPermissionsToRole(roleId, dto, userId);
            }

            // ─── User-Role Assignment ───

            @Post('user-roles')
            @RequirePermissions('user.manage')
            async assignRole(
              @Body() dto: AssignRoleDto,
              @CurrentUser('id') userId: string,
            ) {
              return this.roleService.assignRoleToUser(dto, userId);
            }

            @Delete('user-roles/:id')
            @RequirePermissions('user.manage')
            @HttpCode(HttpStatus.OK)
            async revokeRole(
              @Param('id') userRoleId: string,
              @CurrentUser('id') userId: string,
            ) {
              return this.roleService.revokeRoleFromUser(userRoleId, userId);
            }

            @Get('users/:userId/roles')
            @RequirePermissions('user.read')
            async getUserRoles(@Param('userId') userId: string) {
              return this.roleService.getUserRoles(userId);
            }

            @Get('users/:userId/permissions')
            @RequirePermissions('user.read')
            async getUserPermissions(@Param('userId') userId: string) {
              return this.roleService.getUserPermissions(userId);
            }
          }

      # ─── Subscriber (Tenant Isolation) ───
      - file_name: "subscribers/tenant-subscriber.ts"
        type: "Subscriber"
        description: >
          TypeORM Subscriber yang auto-inject WHERE tenant_id = X pada setiap
          query untuk entity dengan is_isolated = true. Menggunakan
          TenantContextService untuk mendapatkan tenant_id dari request saat ini.
          Ini adalah implementasi logical data isolation antar tenant.
        code_snippet: |
          import {
            EntitySubscriberInterface,
            EventSubscriber,
            InsertEvent,
            UpdateEvent,
            LoadEvent,
          } from 'typeorm';
          import { Injectable } from '@nestjs/common';
          import { TenantContextService } from '../services/tenant-context.service';

          /**
           * Global TypeORM Subscriber untuk tenant data isolation.
           *
           * Pada setiap INSERT: auto-set tenant_id jika entity memiliki kolom tenant_id.
           * Pada setiap SELECT/UPDATE/DELETE: auto-filter WHERE tenant_id = current_tenant_id
           * untuk entity yang flagged is_isolated = true.
           *
           * SaaS-level user (tenant_id = null) tidak dikenakan filter.
           */
          @EventSubscriber()
          @Injectable()
          export class TenantSubscriber implements EntitySubscriberInterface {
            constructor(private tenantContext: TenantContextService) {}

            /**
             * Sebelum insert, auto-set tenant_id dari context.
             */
            beforeInsert(event: InsertEvent<any>): void {
              const tenantId = this.tenantContext.getTenantId();
              if (tenantId && event.metadata.columns.some(c => c.propertyName === 'tenant_id')) {
                // Only set if entity has tenant_id column and it's not already set
                if (!event.entity.tenant_id) {
                  event.entity.tenant_id = tenantId;
                }
              }
            }

            /**
             * Sebelum update, pastikan entity milik tenant yang benar.
             */
            beforeUpdate(event: UpdateEvent<any>): void {
              const tenantId = this.tenantContext.getTenantId();
              if (tenantId && event.entity?.tenant_id && event.entity.tenant_id !== tenantId) {
                throw new Error('Tenant isolation violation: cannot update entity from different tenant');
              }
            }
          }

      # ─── Module ───
      - file_name: "iam.module.ts"
        type: "Module"
        description: >
          Global NestJS module untuk IAM. Mengimpor TypeOrmModule untuk entity
          Role, Permission, RolePermission, UserRole, User, AuditLog.
          Mengekspor PermissionsGuard, TenantIsolationGuard, TenantContextService,
          RoleManagementService, dan semua decorators agar bisa digunakan
          di seluruh aplikasi.
        code_snippet: |
          import { Global, Module } from '@nestjs/common';
          import { TypeOrmModule } from '@nestjs/typeorm';
          import { APP_GUARD } from '@nestjs/core';
          import { IamController } from './iam.controller';
          import { RoleManagementService } from './services/role-management.service';
          import { TenantContextService } from './services/tenant-context.service';
          import { PermissionsGuard } from './guards/permissions.guard';
          import { TenantIsolationGuard } from './guards/tenant-isolation.guard';
          import { TenantSubscriber } from './subscribers/tenant-subscriber';
          import { Role } from './entities/role.entity';
          import { Permission } from './entities/permission.entity';
          import { RolePermission } from './entities/role-permission.entity';
          import { UserRole } from './entities/user-role.entity';
          import { User } from '../users/entities/user.entity';
          import { AuditLog } from '../audit/entities/audit-log.entity';

          @Global()
          @Module({
            imports: [
              TypeOrmModule.forFeature([
                Role, Permission, RolePermission, UserRole, User, AuditLog,
              ]),
            ],
            controllers: [IamController],
            providers: [
              RoleManagementService,
              TenantContextService,
              TenantSubscriber,
              PermissionsGuard,
              TenantIsolationGuard,
              // Register guards globally
              {
                provide: APP_GUARD,
                useClass: TenantIsolationGuard,
              },
              {
                provide: APP_GUARD,
                useClass: PermissionsGuard,
              },
            ],
            exports: [
              RoleManagementService,
              TenantContextService,
              PermissionsGuard,
              TenantIsolationGuard,
            ],
          })
          export class IamModule {}
