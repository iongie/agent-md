architecture_overview:
  description: >
    IamModule adalah inti dari sistem otorisasi NusaTravel SaaS Platform.
    Modul ini mengimplementasikan Granular RBAC (Role-Based Access Control)
    dengan permission atomik per resource dan aksi. Terdiri dari:
    - Custom decorators: @RequirePermissions(), @RequireRoles(), @CurrentUser(), @CurrentTenant()
    - PermissionsGuard: memvalidasi user memiliki permission yang dibutuhkan
    - TenantIsolationGuard: memastikan user hanya mengakses data tenant-nya sendiri
    - TenantContextService: menyimpan dan menyediakan konteks tenant saat ini
    - Role & Permission management services untuk CRUD role dan assign permission
    - Audit logging interceptor untuk mencatat semua aksi user

modules:
  - module_name: "IamModule"
    path: "src/modules/iam"
    components:
      # ─── Decorators ───
      - file_name: "decorators/require-permissions.decorator.ts"
        type: "Decorator"
        description: >
          Custom decorator untuk menandai endpoint yang membutuhkan permission
          spesifik. Menerima satu atau lebih permission_code. Bisa dikombinasikan
          dengan opsi requireAll (default true = AND logic, false = OR logic).
        code_snippet: |
          import { SetMetadata } from '@nestjs/common';

          export const PERMISSIONS_KEY = 'required_permissions';
          export const PERMISSIONS_OPTIONS_KEY = 'permissions_options';

          export interface PermissionsOptions {
            requireAll?: boolean; // true = AND, false = OR
          }

          /**
           * Decorator untuk membatasi akses endpoint berdasarkan permission.
           *
           * @example
           * // Membutuhkan SEMUA permission (AND)
           * @RequirePermissions('booking.read', 'booking.create')
           *
           * @example
           * // Membutuhkan SALAH SATU permission (OR)
           * @RequirePermissions('booking.read', 'booking.create', { requireAll: false })
           */
          export const RequirePermissions = (
            ...args: [...string[], PermissionsOptions?]
          ) => {
            const lastArg = args[args.length - 1];
            const hasOptions = typeof lastArg === 'object' && 'requireAll' in lastArg;

            const permissions = hasOptions ? args.slice(0, -1) as string[] : args as string[];
            const options: PermissionsOptions = hasOptions
              ? lastArg as PermissionsOptions
              : { requireAll: true };

            return (target: any, key?: string, descriptor?: PropertyDescriptor) => {
              SetMetadata(PERMISSIONS_KEY, permissions)(target, key, descriptor);
              SetMetadata(PERMISSIONS_OPTIONS_KEY, options)(target, key, descriptor);
            };
          };

      - file_name: "decorators/require-roles.decorator.ts"
        type: "Decorator"
        description: >
          Custom decorator untuk membatasi akses endpoint berdasarkan role_code.
          Berguna untuk endpoint yang spesifik untuk role tertentu.
        code_snippet: |
          import { SetMetadata } from '@nestjs/common';

          export const ROLES_KEY = 'required_roles';

          /**
           * Decorator untuk membatasi akses endpoint berdasarkan role.
           * User harus memiliki SALAH SATU dari role yang disebutkan (OR logic).
           *
           * @example
           * @RequireRoles('super_admin', 'tenant_owner')
           */
          export const RequireRoles = (...roles: string[]) =>
            SetMetadata(ROLES_KEY, roles);

      - file_name: "decorators/current-user.decorator.ts"
        type: "Decorator"
        description: >
          Parameter decorator untuk mengekstrak data user dari request.
          Bisa mengambil seluruh user object atau field spesifik.
        code_snippet: |
          import { createParamDecorator, ExecutionContext } from '@nestjs/common';

          /**
           * Mengekstrak data user yang sudah terautentikasi dari request.
           *
           * @example
           * // Mengambil seluruh user object
           * @CurrentUser() user: JwtPayload
           *
           * @example
           * // Mengambil field spesifik
           * @CurrentUser('id') userId: string
           * @CurrentUser('tenantId') tenantId: string | null
           */
          export const CurrentUser = createParamDecorator(
            (data: string | undefined, ctx: ExecutionContext) => {
              const request = ctx.switchToHttp().getRequest();
              const user = request.user;
              return data ? user?.[data] : user;
            },
          );

      - file_name: "decorators/current-tenant.decorator.ts"
        type: "Decorator"
        description: >
          Parameter decorator untuk mengekstrak tenant_id dari request user
          atau dari TenantContext. Memudahkan inject tenant_id ke service.
        code_snippet: |
          import { createParamDecorator, ExecutionContext } from '@nestjs/common';

          /**
           * Mengekstrak tenant_id dari user yang sedang login.
           * Untuk SaaS-level user (super_admin), mengembalikan null.
           *
           * @example
           * @CurrentTenant() tenantId: string | null
           */
          export const CurrentTenant = createParamDecorator(
            (_data: unknown, ctx: ExecutionContext): string | null => {
              const request = ctx.switchToHttp().getRequest();
              return request.user?.tenantId ?? null;
            },
          );

      - file_name: "decorators/public.decorator.ts"
        type: "Decorator"
        description: >
          Menandai endpoint sebagai public (tidak memerlukan autentikasi).
          Digunakan oleh JwtAuthGuard untuk skip validasi JWT.
        code_snippet: |
          import { SetMetadata } from '@nestjs/common';

          export const IS_PUBLIC_KEY = 'is_public';

          /**
           * Menandai endpoint sebagai public — tidak memerlukan JWT authentication.
           *
           * @example
           * @Public()
           * @Get('health')
           * healthCheck() { return { status: 'ok' }; }
           */
          export const Public = () => SetMetadata(IS_PUBLIC_KEY, true);

      # ─── Guards ───
      - file_name: "guards/permissions.guard.ts"
        type: "Guard"
        description: >
          Guard utama untuk validasi RBAC. Berjalan SETELAH JwtAuthGuard.
          Mengecek apakah user memiliki permission yang dibutuhkan (dari
          @RequirePermissions decorator) atau role yang dibutuhkan (dari
          @RequireRoles decorator). Super Admin otomatis bypass semua check.
        code_snippet: |
          import {
            Injectable, CanActivate, ExecutionContext,
            ForbiddenException, Logger,
          } from '@nestjs/common';
          import { Reflector } from '@nestjs/core';
          import { PERMISSIONS_KEY, PERMISSIONS_OPTIONS_KEY, PermissionsOptions } from '../decorators/require-permissions.decorator';
          import { ROLES_KEY } from '../decorators/require-roles.decorator';
          import { IS_PUBLIC_KEY } from '../decorators/public.decorator';

          @Injectable()
          export class PermissionsGuard implements CanActivate {
            private readonly logger = new Logger(PermissionsGuard.name);

            constructor(private reflector: Reflector) {}

            canActivate(context: ExecutionContext): boolean {
              // Skip for public endpoints
              const isPublic = this.reflector.getAllAndOverride<boolean>(IS_PUBLIC_KEY, [
                context.getHandler(),
                context.getClass(),
              ]);
              if (isPublic) return true;

              const request = context.switchToHttp().getRequest();
              const user = request.user;

              if (!user) {
                throw new ForbiddenException('Autentikasi diperlukan');
              }

              // Super Admin bypasses all permission checks
              if (user.roles?.includes('super_admin')) {
                return true;
              }

              // Check role requirements
              const requiredRoles = this.reflector.getAllAndOverride<string[]>(ROLES_KEY, [
                context.getHandler(),
                context.getClass(),
              ]);

              if (requiredRoles?.length) {
                const hasRole = requiredRoles.some(role => user.roles?.includes(role));
                if (!hasRole) {
                  this.logger.warn(
                    `User ${user.id} denied: missing role. Required: [${requiredRoles}], Has: [${user.roles}]`,
                  );
                  throw new ForbiddenException('Anda tidak memiliki role yang diperlukan');
                }
              }

              // Check permission requirements
              const requiredPermissions = this.reflector.getAllAndOverride<string[]>(PERMISSIONS_KEY, [
                context.getHandler(),
                context.getClass(),
              ]);

              if (requiredPermissions?.length) {
                const options = this.reflector.getAllAndOverride<PermissionsOptions>(PERMISSIONS_OPTIONS_KEY, [
                  context.getHandler(),
                  context.getClass(),
                ]) ?? { requireAll: true };

                const userPermissions: string[] = user.permissions ?? [];

                const hasPermission = options.requireAll
                  ? requiredPermissions.every(p => userPermissions.includes(p))
                  : requiredPermissions.some(p => userPermissions.includes(p));

                if (!hasPermission) {
                  this.logger.warn(
                    `User ${user.id} denied: missing permission. ` +
                    `Required: [${requiredPermissions}] (${options.requireAll ? 'AND' : 'OR'}), ` +
                    `Has: [${userPermissions}]`,
                  );
                  throw new ForbiddenException('Anda tidak memiliki izin untuk mengakses resource ini');
                }
              }

              return true;
            }
          }

      - file_name: "guards/tenant-isolation.guard.ts"
        type: "Guard"
        description: >
          Guard untuk memastikan data isolation antar tenant. Mengecek bahwa
          user tenant-scoped hanya bisa mengakses data tenant-nya sendiri.
          SaaS-level user (tenant_id = null) bisa mengakses semua tenant.
          Bekerja sama dengan TenantContextService.
        code_snippet: |
          import {
            Injectable, CanActivate, ExecutionContext,
            ForbiddenException, Logger,
          } from '@nestjs/common';
          import { Reflector } from '@nestjs/core';
          import { IS_PUBLIC_KEY } from '../decorators/public.decorator';
          import { TenantContextService } from '../services/tenant-context.service';

          export const TENANT_ISOLATION_KEY = 'tenant_isolation';
          export const SKIP_TENANT_ISOLATION_KEY = 'skip_tenant_isolation';

          @Injectable()
          export class TenantIsolationGuard implements CanActivate {
            private readonly logger = new Logger(TenantIsolationGuard.name);

            constructor(
              private reflector: Reflector,
              private tenantContext: TenantContextService,
            ) {}

            canActivate(context: ExecutionContext): boolean {
              const isPublic = this.reflector.getAllAndOverride<boolean>(IS_PUBLIC_KEY, [
                context.getHandler(),
                context.getClass(),
              ]);
              if (isPublic) return true;

              const skipIsolation = this.reflector.getAllAndOverride<boolean>(SKIP_TENANT_ISOLATION_KEY, [
                context.getHandler(),
                context.getClass(),
              ]);

              const request = context.switchToHttp().getRequest();
              const user = request.user;

              if (!user) return true; // No user = public or handled by JwtAuthGuard

              // SaaS-level users (super_admin, etc.) can access all tenants
              if (!user.tenantId) {
                // Set tenant context from request param/query if provided
                const requestedTenantId = request.params?.tenantId ?? request.query?.tenant_id ?? null;
                this.tenantContext.setTenantId(requestedTenantId);
                return true;
              }

              // Tenant-scoped user: set their tenant context
              this.tenantContext.setTenantId(user.tenantId);

              if (skipIsolation) return true;

              // For tenant-scoped users, ensure they only access their own tenant data
              const paramTenantId = request.params?.tenantId;
              if (paramTenantId && paramTenantId !== user.tenantId) {
                this.logger.warn(
                  `User ${user.id} (tenant: ${user.tenantId}) attempted to access tenant ${paramTenantId}`,
                );
                throw new ForbiddenException('Anda tidak memiliki akses ke data tenant lain');
              }

              return true;
            }
          }

      # ─── Services ───
      - file_name: "services/tenant-context.service.ts"
        type: "Service"
        description: >
          Request-scoped service yang menyimpan konteks tenant saat ini.
          Digunakan oleh TenantIsolationGuard untuk inject tenant_id,
          dan oleh TypeORM Subscriber untuk auto-filter query WHERE tenant_id = X.
        code_snippet: |
          import { Injectable, Scope } from '@nestjs/common';

          /**
           * Request-scoped service untuk menyimpan tenant context.
           * Nilai tenant_id di-set oleh TenantIsolationGuard pada setiap request.
           * Digunakan oleh TenantSubscriber untuk auto-inject WHERE clause.
           */
          @Injectable({ scope: Scope.REQUEST })
          export class TenantContextService {
            private tenantId: string | null = null;

            setTenantId(tenantId: string | null): void {
              this.tenantId = tenantId;
            }

            getTenantId(): string | null {
              return this.tenantId;
            }

            /**
             * Mengecek apakah user saat ini adalah SaaS-level (bukan tenant user).
             */
            isSaaSLevel(): boolean {
              return this.tenantId === null;
            }
          }

      - file_name: "services/role-management.service.ts"
        type: "Service"
        description: >
          Service untuk manajemen role dan permission. Mencakup:
          - CRUD role (global SaaS & tenant-scoped)
          - Assign/revoke permission ke role
          - Assign/revoke role ke user
          - Get permissions untuk user tertentu
          - Copy default roles saat tenant baru dibuat
        code_snippet: |
          import {
            Injectable, BadRequestException, NotFoundException,
            ForbiddenException, Logger,
          } from '@nestjs/common';
          import { InjectRepository } from '@nestjs/typeorm';
          import { Repository, In } from 'typeorm';
          import { Role } from '../entities/role.entity';
          import { Permission } from '../entities/permission.entity';
          import { RolePermission } from '../entities/role-permission.entity';
          import { UserRole } from '../entities/user-role.entity';
          import { User } from '../../users/entities/user.entity';
          import { AuditLog } from '../../audit/entities/audit-log.entity';
          import { CreateRoleDto } from '../dto/create-role.dto';
          import { UpdateRoleDto } from '../dto/update-role.dto';
          import { AssignPermissionsDto } from '../dto/assign-permissions.dto';
          import { AssignRoleDto } from '../dto/assign-role.dto';

          @Injectable()
          export class RoleManagementService {
            private readonly logger = new Logger(RoleManagementService.name);

            constructor(
              @InjectRepository(Role)
              private readonly roleRepo: Repository<Role>,
              @InjectRepository(Permission)
              private readonly permissionRepo: Repository<Permission>,
              @InjectRepository(RolePermission)
              private readonly rolePermissionRepo: Repository<RolePermission>,
              @InjectRepository(UserRole)
              private readonly userRoleRepo: Repository<UserRole>,
              @InjectRepository(User)
              private readonly userRepo: Repository<User>,
              @InjectRepository(AuditLog)
              private readonly auditRepo: Repository<AuditLog>,
            ) {}

            // ═══════════════════════════════════════════════════════════════
            // ROLE CRUD
            // ═══════════════════════════════════════════════════════════════

            async createRole(dto: CreateRoleDto, tenantId: string | null, createdBy: string) {
              // Check uniqueness within tenant scope
              const existing = await this.roleRepo.findOne({
                where: { tenant_id: tenantId, role_code: dto.role_code },
              });
              if (existing) {
                throw new BadRequestException(`Role code '${dto.role_code}' sudah ada`);
              }

              const role = this.roleRepo.create({
                tenant_id: tenantId,
                role_code: dto.role_code,
                role_name: dto.role_name,
                description: dto.description,
                is_system_role: false,
              });

              const saved = await this.roleRepo.save(role);
              await this.createAuditLog(createdBy, tenantId, 'role.create', 'Role', saved.id, null, dto);

              return saved;
            }

            async findAllRoles(tenantId: string | null) {
              return this.roleRepo.find({
                where: { tenant_id: tenantId },
                relations: ['role_permissions', 'role_permissions.permission'],
                order: { created_at: 'ASC' },
              });
            }

            async findRoleById(id: string) {
              const role = await this.roleRepo.findOne({
                where: { id },
                relations: ['role_permissions', 'role_permissions.permission'],
              });
              if (!role) throw new NotFoundException('Role tidak ditemukan');
              return role;
            }

            async updateRole(id: string, dto: UpdateRoleDto, updatedBy: string) {
              const role = await this.findRoleById(id);
              if (role.is_system_role) {
                throw new ForbiddenException('System role tidak dapat diubah');
              }

              const oldValues = { role_name: role.role_name, description: role.description };
              await this.roleRepo.update(id, {
                role_name: dto.role_name ?? role.role_name,
                description: dto.description ?? role.description,
              });

              await this.createAuditLog(updatedBy, role.tenant_id, 'role.update', 'Role', id, oldValues, dto);
              return this.findRoleById(id);
            }

            async deleteRole(id: string, deletedBy: string) {
              const role = await this.findRoleById(id);
              if (role.is_system_role) {
                throw new ForbiddenException('System role tidak dapat dihapus');
              }

              // Check if any user still has this role
              const userCount = await this.userRoleRepo.count({ where: { role_id: id } });
              if (userCount > 0) {
                throw new BadRequestException(
                  `Role masih digunakan oleh ${userCount} user. Harap revoke role dari semua user terlebih dahulu.`,
                );
              }

              await this.roleRepo.delete(id);
              await this.createAuditLog(deletedBy, role.tenant_id, 'role.delete', 'Role', id, role, null);
              return { message: 'Role berhasil dihapus' };
            }

            // ═══════════════════════════════════════════════════════════════
            // PERMISSION MANAGEMENT
            // ═══════════════════════════════════════════════════════════════

            async findAllPermissions() {
              return this.permissionRepo.find({
                order: { resource: 'ASC', action: 'ASC' },
              });
            }

            async getPermissionsByResource() {
              const permissions = await this.findAllPermissions();
              const grouped: Record<string, any[]> = {};
              permissions.forEach(p => {
                if (!grouped[p.resource]) grouped[p.resource] = [];
                grouped[p.resource].push(p);
              });
              return grouped;
            }

            async assignPermissionsToRole(roleId: string, dto: AssignPermissionsDto, assignedBy: string) {
              const role = await this.findRoleById(roleId);
              if (role.is_system_role && role.role_code === 'super_admin') {
                throw new ForbiddenException('Permission Super Admin tidak dapat diubah');
              }

              // Validate all permission IDs exist
              const permissions = await this.permissionRepo.find({
                where: { id: In(dto.permission_ids) },
              });
              if (permissions.length !== dto.permission_ids.length) {
                throw new BadRequestException('Beberapa permission ID tidak valid');
              }

              // Remove existing permissions not in the new list
              await this.rolePermissionRepo.delete({
                role_id: roleId,
                permission_id: Not(In(dto.permission_ids)),
              });

              // Add new permissions (skip existing)
              const existing = await this.rolePermissionRepo.find({
                where: { role_id: roleId },
              });
              const existingPermIds = new Set(existing.map(rp => rp.permission_id));

              const newRolePermissions = dto.permission_ids
                .filter(pid => !existingPermIds.has(pid))
                .map(permission_id => this.rolePermissionRepo.create({
                  role_id: roleId,
                  permission_id,
                }));

              if (newRolePermissions.length > 0) {
                await this.rolePermissionRepo.save(newRolePermissions);
              }

              await this.createAuditLog(assignedBy, role.tenant_id, 'role.permissions_updated', 'Role', roleId, null, { permission_ids: dto.permission_ids });
              return this.findRoleById(roleId);
            }

            // ═══════════════════════════════════════════════════════════════
            // USER-ROLE ASSIGNMENT
            // ═══════════════════════════════════════════════════════════════

            async assignRoleToUser(dto: AssignRoleDto, assignedBy: string) {
              const user = await this.userRepo.findOneBy({ id: dto.user_id });
              if (!user) throw new NotFoundException('User tidak ditemukan');

              const role = await this.roleRepo.findOneBy({ id: dto.role_id });
              if (!role) throw new NotFoundException('Role tidak ditemukan');

              // Check tenant scope: user and role must be in same tenant
              if (role.tenant_id && user.tenant_id !== role.tenant_id) {
                throw new ForbiddenException('Role dan user harus dalam tenant yang sama');
              }

              // Check if already assigned
              const existing = await this.userRoleRepo.findOne({
                where: { user_id: dto.user_id, role_id: dto.role_id },
              });
              if (existing) {
                throw new BadRequestException('User sudah memiliki role ini');
              }

              const userRole = this.userRoleRepo.create({
                user_id: dto.user_id,
                role_id: dto.role_id,
                assigned_by: assignedBy,
              });

              const saved = await this.userRoleRepo.save(userRole);
              await this.createAuditLog(assignedBy, user.tenant_id, 'user.role_assigned', 'UserRole', saved.id, null, dto);

              return saved;
            }

            async revokeRoleFromUser(userRoleId: string, revokedBy: string) {
              const userRole = await this.userRoleRepo.findOne({
                where: { id: userRoleId },
                relations: ['user', 'role'],
              });
              if (!userRole) throw new NotFoundException('Assignment tidak ditemukan');

              // Prevent revoking the last role
              const roleCount = await this.userRoleRepo.count({
                where: { user_id: userRole.user_id },
              });
              if (roleCount <= 1) {
                throw new BadRequestException('User harus memiliki minimal satu role');
              }

              await this.userRoleRepo.delete(userRoleId);
              await this.createAuditLog(revokedBy, userRole.user.tenant_id, 'user.role_revoked', 'UserRole', userRoleId, userRole, null);

              return { message: 'Role berhasil di-revoke dari user' };
            }

            async getUserRoles(userId: string) {
              return this.userRoleRepo.find({
                where: { user_id: userId },
                relations: ['role', 'role.role_permissions', 'role.role_permissions.permission'],
              });
            }

            async getUserPermissions(userId: string): Promise<string[]> {
              const userRoles = await this.getUserRoles(userId);
              const permissions = new Set<string>();
              userRoles.forEach(ur => {
                ur.role?.role_permissions?.forEach(rp => {
                  permissions.add(rp.permission.permission_code);
                });
              });
              return Array.from(permissions);
            }

            // ═══════════════════════════════════════════════════════════════
            // TENANT ONBOARDING — COPY DEFAULT ROLES
            // ═══════════════════════════════════════════════════════════════

            async copyDefaultRolesToTenant(tenantId: string): Promise<void> {
              const defaultRoles = await this.roleRepo.find({
                where: { tenant_id: '01J00000000000000000000001' }, // Platform tenant
                relations: ['role_permissions'],
              });

              for (const templateRole of defaultRoles) {
                const newRole = this.roleRepo.create({
                  tenant_id: tenantId,
                  role_code: templateRole.role_code,
                  role_name: templateRole.role_name,
                  description: templateRole.description,
                  is_system_role: templateRole.is_system_role,
                });
                const savedRole = await this.roleRepo.save(newRole);

                // Copy permissions
                if (templateRole.role_permissions?.length) {
                  const rolePermissions = templateRole.role_permissions.map(rp =>
                    this.rolePermissionRepo.create({
                      role_id: savedRole.id,
                      permission_id: rp.permission_id,
                    }),
                  );
                  await this.rolePermissionRepo.save(rolePermissions);
                }
              }

              this.logger.log(`Default roles copied to tenant ${tenantId}`);
            }

            // ═══════════════════════════════════════════════════════════════
            // HELPER
            // ═══════════════════════════════════════════════════════════════

            private async createAuditLog(
              userId: string, tenantId: string | null,
              action: string, resourceType: string, resourceId: string,
              oldValues: any, newValues: any,
            ) {
              await this.auditRepo.save(this.auditRepo.create({
                user_id: userId,
                tenant_id: tenantId,
                action,
                resource_type: resourceType,
                resource_id: resourceId,
                old_values: oldValues ? JSON.parse(JSON.stringify(oldValues)) : null,
                new_values: newValues ? JSON.parse(JSON.stringify(newValues)) : null,
              }));
            }
          }

      # ─── DTOs ───
      - file_name: "dto/create-role.dto.ts"
        type: "DTO"
        description: "DTO untuk membuat role baru."
        code_snippet: |
          import { IsString, MinLength, MaxLength, IsOptional, Matches } from 'class-validator';
          import { ApiProperty } from '@nestjs/swagger';

          export class CreateRoleDto {
            @ApiProperty({ example: 'operations_manager' })
            @IsString()
            @MinLength(3)
            @MaxLength(50)
            @Matches(/^[a-z0-9_]+$/, { message: 'role_code hanya boleh lowercase, angka, dan underscore' })
            role_code: string;

            @ApiProperty({ example: 'Operations Manager' })
            @IsString()
            @MinLength(2)
            @MaxLength(100)
            role_name: string;

            @ApiProperty({ required: false })
            @IsOptional()
            @IsString()
            @MaxLength(500)
            description?: string;
          }

      - file_name: "dto/update-role.dto.ts"
        type: "DTO"
        description: "DTO untuk update role."
