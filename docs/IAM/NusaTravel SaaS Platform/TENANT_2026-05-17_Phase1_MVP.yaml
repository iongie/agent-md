      # ─── Module ───
      - file_name: "tenant.module.ts"
        type: "Module"
        description: >
          NestJS module untuk multi-tenancy management. Mengimpor TypeOrmModule
          untuk entity Tenant, TenantKYBDocument, FeatureFlag, TierFeatureFlag,
          SubscriptionInvoice, User, AuditLog. Mengekspor TenantContextService
          untuk digunakan modul lain.
        code_snippet: |
          import { Module } from '@nestjs/common';
          import { TypeOrmModule } from '@nestjs/typeorm';
          import { ScheduleModule } from '@nestjs/schedule';
          import { TenantOnboardingController } from './tenant-onboarding.controller';
          import { TenantOnboardingService } from './tenant-onboarding.service';
          import { TenantSubscriptionService } from './tenant-subscription.service';
          import { Tenant } from './entities/tenant.entity';
          import { TenantKYBDocument } from './entities/tenant-kyb-document.entity';
          import { FeatureFlag } from './entities/feature-flag.entity';
          import { TierFeatureFlag } from './entities/tier-feature-flag.entity';
          import { SubscriptionInvoice } from './entities/subscription-invoice.entity';
          import { User } from '../users/entities/user.entity';
          import { AuditLog } from '../audit/entities/audit-log.entity';
          import { IamModule } from '../iam/iam.module';
          import { MailModule } from '../mail/mail.module';
          import { StorageModule } from '../storage/storage.module';

          @Module({
            imports: [
              TypeOrmModule.forFeature([
                Tenant, TenantKYBDocument, FeatureFlag,
                TierFeatureFlag, SubscriptionInvoice, User, AuditLog,
              ]),
              ScheduleModule.forRoot(),
              IamModule,
              MailModule,
              StorageModule,
            ],
            controllers: [TenantOnboardingController],
            providers: [TenantOnboardingService, TenantSubscriptionService],
            exports: [TenantOnboardingService, TenantSubscriptionService],
          })
          export class TenantModule {}
