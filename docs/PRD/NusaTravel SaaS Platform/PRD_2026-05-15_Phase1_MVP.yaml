name: "NusaTravel SaaS Platform — Phase 1: MVP"
version: "1.0.0"
generated_at: "2026-05-15"
objective: >
  Membangun fondasi platform SaaS B2B2C multi-tenant yang memungkinkan agen perjalanan,
  operator bus, perusahaan shuttle, dan penyedia transportasi darat untuk mengelola
  operasional end-to-end — mencakup pemesanan tiket bus/shuttle/travel darat (one-way,
  round-trip, multi-stop), manajemen armada & pengemudi, paket wisata, rental kendaraan,
  transfer bandara, dan akomodasi hotel — dengan mekanisme pembayaran fleksibel
  (DP + pelunasan), multi-payment gateway, white-label branding, RBAC granular,
  dan dashboard operasional real-time.

target_metrics:
  - "Onboarding 10 tenant dalam 3 bulan pertama pasca-launch"
  - "Waktu rata-rata pembuatan booking < 3 menit oleh customer mandiri"
  - "Tingkat keberhasilan pembayaran > 95%"
  - "Tingkat pelunasan DP tepat waktu > 80%"
  - "Response time API 95th percentile < 500ms untuk operasi booking"
  - "Zero critical security incident pada audit kuartal pertama"

phases:
  - id: "phase-1"
    name: "MVP"
    duration: "Month 1-4"
    modules:
      - "Core Booking Engine"
      - "Payment & Financial Engine"
      - "Fleet & Driver Management"
      - "Tour Package & Itinerary Management"
      - "Vehicle Rental Management"
      - "Airport Transfer & Shuttle Management"
      - "Hotel & Accommodation Management"
      - "Tenant & Multi-Tenancy Management"
      - "Identity, Access & Security (IAM)"
      - "Pricing & Inventory Engine"
      - "Promotions & Loyalty Engine"
      - "Notifications & Communications"
      - "CRM & Customer Management"
      - "Analytics & Reporting"
      - "Vendor & Partner Management"

scope:
  in_scope:
    # Core Booking Engine
    - "One-way & round-trip ticket booking (bus, shuttle, travel darat)"
    - "Multi-stop & connecting journey booking"
    - "Seat map selection interaktif per kendaraan"
    - "Real-time seat availability inventory"
    - "Group booking dengan manifest penumpang"
    - "Booking modification & cancellation self-service"
    - "E-ticket & QR code generation otomatis"
    # Payment & Financial Engine
    - "Full payment saat checkout"
    - "Down Payment (DP) booking dengan konfigurasi % minimum per produk/rute"
    - "Reminder otomatis pelunasan sebelum deadline"
    - "Auto-cancel booking jika pelunasan melewati deadline"
    - "Partial refund & full refund engine dengan approval workflow"
    - "Multi-payment gateway support (Midtrans, Xendit, DOKU, Stripe)"
    - "Virtual Account (VA) per booking otomatis"
    - "Laporan rekonsiliasi harian & settlement otomatis"
    - "Commission & markup rule engine per agen/channel"
    # Fleet & Driver Management
    - "Registrasi & profil kendaraan (nomor polisi, kapasitas, fasilitas)"
    - "Assignment kendaraan ke jadwal perjalanan"
    - "Onboarding & profil pengemudi (SIM, KTP, rekam jejak)"
    - "Jadwal kerja & shift management pengemudi"
    - "Jadwal & histori maintenance kendaraan (servis berkala, STNK, KIR)"
    - "Notifikasi maintenance jatuh tempo otomatis"
    # Tour Package & Itinerary Management
    - "Builder paket wisata (nama, deskripsi, durasi, inklusi/eksklusi)"
    - "Day-by-day itinerary editor dengan aktivitas & lokasi"
    - "Bundling komponen: transportasi + hotel + aktivitas dalam 1 paket"
    - "Harga paket: per orang, per grup, atau private"
    - "Minimum & maksimum pax per paket"
    - "DP booking untuk paket wisata"
    - "Photo gallery & rich content editor untuk halaman paket"
    - "Availability calendar & ketersediaan slot keberangkatan"
    # Vehicle Rental Management
    - "Katalog kendaraan rental dengan tarif harian/mingguan/bulanan"
    - "Pemesanan rental dengan/tanpa pengemudi (with/without driver)"
    - "Booking rental dengan DP, pelunasan sebelum pickup"
    - "Kontrak digital & e-signature untuk penyewaan"
    - "Manajemen deposit: hold, release, atau potong untuk denda"
    - "Pengecekan kondisi kendaraan sebelum & sesudah rental (foto bukti)"
    # Airport Transfer & Shuttle Management
    - "Pemesanan transfer bandara (Arrival & Departure pickup)"
    - "Pilihan tipe kendaraan (sedan, MPV, minibus) berdasarkan jumlah pax"
    - "Shuttle jadwal tetap (fixed departure point & waktu)"
    - "Manifest penumpang digital untuk setiap run perjalanan"
    # Hotel & Accommodation Management
    - "Pendaftaran properti hotel & tipe kamar"
    - "Manajemen rate plan & harga musiman"
    - "Booking kamar individual maupun bulk (group tour)"
    - "DP booking hotel & pelunasan sebelum check-in"
    - "Voucher hotel digital & instruksi check-in otomatis"
    - "Kebijakan cancellation & no-show fee per properti"
    # Tenant & Multi-Tenancy Management
    - "Self-service tenant onboarding & KYB (Know Your Business) verification"
    - "Konfigurasi profil bisnis & white-label branding (logo, warna, domain)"
    - "Manajemen subscription tier (Starter, Growth, Enterprise)"
    - "Feature flag management per tier"
    - "Trial period & grace period management"
    - "Tenant data isolation (logical separation)"
    # Identity, Access & Security (IAM)
    - "Registrasi & login (email/password, Google OAuth)"
    - "Two-Factor Authentication (TOTP / WhatsApp OTP)"
    - "RBAC granular (permission level per menu/aksi per role)"
    - "Session management & forced logout"
    - "Audit log semua aksi user (who, what, when, from where)"
    - "Password policy enforcement & account lockout"
    # Pricing & Inventory Engine
    - "Harga dasar per rute/produk/kendaraan"
    - "Seasonal pricing & holiday surcharge"
    - "Early bird discount (harga lebih murah saat book jauh hari)"
    - "Child/infant fare configuration"
    - "Markup & commission rules per channel penjualan"
    # Promotions & Loyalty Engine
    - "Voucher & promo code (fixed amount, % discount, free service)"
    - "Batas penggunaan voucher (per user, total penggunaan, berlaku sampai)"
    # Notifications & Communications
    - "Email konfirmasi booking otomatis"
    - "WhatsApp Business API notification (konfirmasi, reminder, e-ticket)"
    - "SMS fallback notification"
    - "Reminder DP & pelunasan H-3, H-1 otomatis"
    - "Notifikasi perubahan jadwal / pembatalan ke semua penumpang"
    - "Template notifikasi yang bisa dikustomisasi per tenant"
    # CRM & Customer Management
    - "Profil customer terpusat (data pribadi, preferensi, histori booking)"
    - "Histori transaksi & status pembayaran per customer"
    - "Review & rating management (moderasi & response)"
    - "Complaint & dispute management system"
    # Analytics & Reporting
    - "Dashboard operasional real-time (booking hari ini, revenue, occupancy)"
    - "Laporan penjualan (per rute, per produk, per channel, per periode)"
    - "Laporan keuangan (revenue, refund, outstanding DP, settlement)"
    - "Occupancy report per kendaraan/jadwal"
    - "Export laporan ke Excel/CSV/PDF"
    - "SaaS-level analytics: tenant growth, GMV, churn rate"
    # Vendor & Partner Management
    - "Onboarding vendor pihak ketiga (profil, kontrak, bank account)"
    - "Pengaturan komisi vendor secara fleksibel per produk"

  out_of_scope:
    - "Booking penerbangan via GDS/OTA API (Phase 2)"
    - "Booking kereta api via KAI Access/INKA API (Phase 2)"
    - "Waitlist management (Phase 2)"
    - "Split payment untuk group booking (Phase 2)"
    - "Paylater/BNPL integration (Phase 2)"
    - "Corporate invoice & net-term billing (Phase 2)"
    - "GPS real-time tracking armada & geofence alert (Phase 2)"
    - "Driver performance scorecard & laporan utilisasi armada (Phase 2)"
    - "Paket custom/tailor-made quotation request (Phase 2)"
    - "Template paket wisata clone & modifikasi (Phase 2)"
    - "Overtime & late return fee calculation otomatis (Phase 2)"
    - "Blacklist customer bermasalah (Phase 2)"
    - "Integrasi GPS tracker kendaraan rental (Phase 2)"
    - "Integrasi data penerbangan untuk auto-adjust transfer bandara (Phase 2)"
    - "Shuttle on-demand booking & dispatch real-time (Phase 2)"
    - "Penugasan pengemudi otomatis (Phase 2)"
    - "Live tracking link untuk customer (Phase 2)"
    - "Integrasi OTA eksternal via channel manager hotel (Phase 2)"
    - "Sub-tenant/branch management untuk enterprise (Phase 2)"
    - "Impersonation mode untuk SaaS support (Phase 2)"
    - "SSO via SAML 2.0/OIDC untuk tenant enterprise (Phase 2)"
    - "Passkey/WebAuthn authentication (Phase 2)"
    - "Dynamic pricing otomatis berdasarkan % kursi terisi (Phase 2)"
    - "Last-minute deal (Phase 2)"
    - "Corporate rate & contract pricing (Phase 2)"
    - "Flash sale dengan countdown timer (Phase 2)"
    - "Loyalty points system (Phase 2)"
    - "Referral program & cashback campaign (Phase 2)"
    - "Push notification mobile & web (Phase 2)"
    - "In-app chat CS tenant dan customer (Phase 2)"
    - "Segmentasi customer & CLV tracking (Phase 2)"
    - "Customer acquisition & retention funnel analytics (Phase 2)"
    - "Scheduled report via email (Phase 2)"
    - "Vendor portal self-service (Phase 2)"
    - "Disbursement otomatis ke rekening vendor (Phase 2)"
    - "Vendor performance rating & review (Phase 2)"
    - "Native mobile application (iOS/Android)"
    - "Hardware GPS tracker sendiri"
    - "Payment gateway sendiri"
    - "Marketplace publik antar-tenant"
    - "Modul HR/Payroll pengemudi"
    - "Akuntansi & ERP terintegrasi"
    - "Program asuransi perjalanan"
    - "Sistem ticketing event/konser"

roles:
  - id: "super_admin"
    name: "Super Admin"
    description: >
      Admin level SaaS: mengelola seluruh platform, onboarding tenant,
      konfigurasi global pricing rules, monitoring system health, manajemen
      subscription & billing antar tenant, audit log penuh, suspend/activate tenant.

  - id: "saas_support_agent"
    name: "SaaS Support Agent"
    description: >
      Memberikan dukungan teknis & operasional kepada tenant; eskalasi tiket;
      akses read-only untuk troubleshooting.

  - id: "saas_billing_admin"
    name: "SaaS Billing Admin"
    description: >
      Mengelola invoice tenant, pembayaran subscription, dispute resolution,
      laporan revenue platform, refund & credit note kepada tenant.

  - id: "saas_product_manager"
    name: "SaaS Product Manager"
    description: >
      Konfigurasi feature flags per tier, manajemen changelog, announcement
      platform-wide.

  - id: "tenant_owner"
    name: "Tenant Owner"
    description: >
      Pemilik akun bisnis: setup profil perusahaan, white-label branding,
      manajemen subscription, akses penuh semua modul, undang & kelola user internal.

  - id: "operations_manager"
    name: "Operations Manager"
    description: >
      Mengelola jadwal perjalanan, armada, pengemudi, rute, dan kapasitas.
      Approval pemesanan grup, override pricing, manajemen vendor pihak ketiga.

  - id: "finance_staff"
    name: "Finance Staff"
    description: >
      Rekonsiliasi pembayaran, manajemen DP & pelunasan, penerbitan invoice,
      laporan keuangan harian/bulanan, verifikasi transfer manual.

  - id: "booking_staff_cs"
    name: "Booking Staff / CS Agent"
    description: >
      Input pemesanan manual, modifikasi & pembatalan booking atas nama customer,
      verifikasi dokumen perjalanan, komunikasi dengan customer.

  - id: "driver_operator"
    name: "Driver / Operator"
    description: >
      Akses jadwal perjalanan pribadi, konfirmasi keberangkatan, update status
      perjalanan real-time, laporan insiden, akses manifest penumpang.

  - id: "fleet_supervisor"
    name: "Fleet Supervisor"
    description: >
      Monitor jadwal maintenance kendaraan, assign driver ke kendaraan,
      notifikasi maintenance jatuh tempo.

  - id: "marketing_staff"
    name: "Marketing Staff"
    description: >
      Buat & kelola promo/voucher, campaign email, kelola konten paket wisata,
      pantau performa campaign.

  - id: "registered_customer"
    name: "Registered Customer (B2C)"
    description: >
      Cari & pesan tiket, paket wisata, rental kendaraan, atau hotel.
      Bayar DP atau full payment, kelola booking aktif, tulis ulasan, gunakan voucher.

  - id: "corporate_booker"
    name: "Corporate Booker (B2B)"
    description: >
      Pesan perjalanan bisnis atas nama perusahaan, akses corporate rate,
      manajemen travel policy, laporan pengeluaran perjalanan.

  - id: "guest"
    name: "Guest (Unauthenticated)"
    description: >
      Browsing produk & harga, cek ketersediaan, booking tanpa registrasi
      dengan email konfirmasi, redirect ke registrasi pasca-booking.

  - id: "passenger_traveler"
    name: "Passenger / Traveler"
    description: >
      Akses e-ticket, boarding pass digital, status perjalanan real-time,
      emergency contact, rating & review pasca-perjalanan.

data_models:
  - entity_name: "User"
    description: "Global identity account untuk semua persona (SaaS staff, tenant user, end customer)."
    key_attributes:
      - "id (ULID, PK)"
      - "email (unique)"
      - "phone_e164 (unique, nullable)"
      - "password_hash"
      - "status (active/suspended/locked/deleted)"
      - "email_verified_at"
      - "failed_login_attempts"
      - "locked_until"
      - "last_login_at"
      - "tenant_id (nullable — null berarti SaaS-level user)"

  - entity_name: "Tenant"
    description: "Entitas bisnis yang menggunakan platform (agen perjalanan, operator bus, dll)."
    key_attributes:
      - "id (ULID, PK)"
      - "tenant_code (unique, slug)"
      - "legal_name"
      - "business_type"
      - "kyb_status (pending/approved/rejected)"
      - "subscription_tier (starter/growth/enterprise)"
      - "subscription_status (trial/active/grace/suspended)"
      - "white_label_config (logo_url, primary_color, custom_domain)"
      - "trial_ends_at"
      - "grace_ends_at"

  - entity_name: "Role"
    description: "Peran dalam sistem, bisa global (SaaS) atau tenant-scoped."
    key_attributes:
      - "id (ULID, PK)"
      - "tenant_id (nullable — null = global SaaS role)"
      - "role_code (unique per tenant)"
      - "role_name"
      - "is_system_role"

  - entity_name: "Permission"
    description: "Izin atomik untuk resource dan aksi tertentu."
    key_attributes:
      - "id (ULID, PK)"
      - "permission_code (unique, e.g., booking.read, fleet.update)"
      - "resource"
      - "action (create/read/update/delete/approve/export/manage)"

  - entity_name: "TripSchedule"
    description: "Jadwal perjalanan transportasi darat (bus, shuttle, travel)."
    key_attributes:
      - "id (ULID, PK)"
      - "tenant_id (FK)"
      - "origin_location_id (FK)"
      - "destination_location_id (FK)"
      - "departure_at"
      - "arrival_at"
      - "vehicle_id (FK)"
      - "driver_id (FK)"
      - "total_seats"
      - "available_seats"
      - "status (scheduled/in_progress/completed/cancelled)"
      - "base_price"

  - entity_name: "Booking"
    description: "Header pemesanan yang menyatukan satu atau lebih item perjalanan."
    key_attributes:
      - "id (ULID, PK)"
      - "tenant_id (FK)"
      - "booking_code (unique, human-readable)"
      - "customer_id (FK, nullable untuk guest)"
      - "guest_email (nullable)"
      - "booking_status (draft/dp_paid/confirmed/cancelled/auto_cancelled)"
      - "payment_mode (full/dp)"
      - "dp_percentage"
      - "dp_amount"
      - "total_amount"
      - "settlement_deadline"
      - "sales_channel_id (FK)"

  - entity_name: "BookingItem"
    description: "Item individual dalam satu booking (tiket, paket, rental, hotel)."
    key_attributes:
      - "id (ULID, PK)"
      - "booking_id (FK)"
      - "item_type (trip/tour/rental/hotel/transfer)"
      - "reference_id (FK ke produk terkait)"
      - "quantity"
      - "unit_price"
      - "subtotal"

  - entity_name: "Passenger"
    description: "Data penumpang dalam booking (manifest)."
    key_attributes:
      - "id (ULID, PK)"
      - "booking_id (FK)"
      - "booking_item_id (FK)"
      - "full_name"
      - "id_type (ktp/passport/sim)"
      - "id_number"
      - "seat_code"
      - "fare_type (adult/child/infant)"
      - "ticket_qr_code"

  - entity_name: "PaymentIntent"
    description: "Intensi pembayaran untuk booking (DP, pelunasan, full payment)."
    key_attributes:
      - "id (ULID, PK)"
      - "booking_id (FK)"
      - "intent_type (dp/settlement/full/deposit_hold/deposit_release)"
      - "gateway_code"
      - "method_type (va/qris/ewallet/credit_card)"
      - "amount"
      - "status (pending/paid/expired/failed)"
      - "va_number (nullable)"
      - "expires_at"

  - entity_name: "PaymentTransaction"
    description: "Transaksi pembayaran aktual yang diterima dari gateway."
    key_attributes:
      - "id (ULID, PK)"
      - "payment_intent_id (FK)"
      - "gateway_transaction_id"
      - "amount_received"
      - "status (confirmed/failed/refunded)"
      - "paid_at"
      - "raw_webhook_payload"

  - entity_name: "Refund"
    description: "Pengajuan dan pemrosesan refund."
    key_attributes:
      - "id (ULID, PK)"
      - "booking_id (FK)"
      - "refund_type (partial/full)"
      - "refund_amount"
      - "reason"
      - "status (requested/approved/rejected/completed)"
      - "approved_by (FK user)"
      - "approved_at"

  - entity_name: "Vehicle"
    description: "Kendaraan dalam armada tenant."
    key_attributes:
      - "id (ULID, PK)"
      - "tenant_id (FK)"
      - "plate_number (unique per tenant)"
      - "vehicle_type (bus/minibus/mpv/sedan)"
      - "capacity"
      - "facilities (ac, toilet, entertainment, wifi)"
      - "status (active/maintenance/inactive)"
      - "stnk_expiry"
      - "kir_expiry"

  - entity_name: "Driver"
    description: "Pengemudi yang terdaftar di tenant."
    key_attributes:
      - "id (ULID, PK)"
      - "tenant_id (FK)"
      - "user_id (FK, nullable — link ke akun login)"
      - "full_name"
      - "sim_number"
      - "sim_expiry"
      - "ktp_number"
      - "status (active/inactive/suspended)"
      - "track_record_notes"

  - entity_name: "TourPackage"
    description: "Paket wisata yang dijual oleh tenant agen."
    key_attributes:
      - "id (ULID, PK)"
      - "tenant_id (FK)"
      - "package_name"
      - "description"
      - "duration_days"
      - "inclusions"
      - "exclusions"
      - "pricing_type (per_person/per_group/private)"
      - "price"
      - "min_pax"
      - "max_pax"
      - "dp_percentage"
      - "status (draft/published/archived)"

  - entity_name: "HotelProperty"
    description: "Properti hotel yang dikelola tenant agen."
    key_attributes:
      - "id (ULID, PK)"
      - "tenant_id (FK)"
      - "property_name"
      - "address"
      - "star_rating"
      - "cancellation_policy"
      - "no_show_fee_percentage"

  - entity_name: "HotelRoomType"
    description: "Tipe kamar dalam properti hotel."
    key_attributes:
      - "id (ULID, PK)"
      - "property_id (FK)"
      - "room_type_name"
      - "base_price"
      - "capacity"
      - "total_rooms"
      - "available_rooms"

  - entity_name: "Voucher"
    description: "Kode promo/voucher yang dibuat tenant."
    key_attributes:
      - "id (ULID, PK)"
      - "tenant_id (FK)"
      - "voucher_code (unique per tenant)"
      - "discount_type (fixed/percentage)"
      - "discount_value"
      - "max_usage_total"
      - "max_usage_per_user"
      - "valid_from"
      - "valid_until"
      - "status (active/expired/disabled)"

  - entity_name: "Vendor"
    description: "Mitra penyedia layanan pihak ketiga."
    key_attributes:
      - "id (ULID, PK)"
      - "tenant_id (FK)"
      - "vendor_name"
      - "contact_info"
      - "bank_account_info"
      - "commission_percentage"
      - "status (active/inactive)"

  - entity_name: "AuditLog"
    description: "Log audit immutable untuk semua aksi user."
    key_attributes:
      - "id (ULID, PK)"
      - "user_id (FK)"
      - "tenant_id (FK, nullable)"
      - "action"
      - "resource_type"
      - "resource_id"
      - "old_values (JSONB)"
      - "new_values (JSONB)"
      - "ip_address"
      - "user_agent"
      - "created_at"

state_machines:
  - workflow: "Booking Lifecycle"
    transitions:
      - "Draft -> DP_Paid (setelah DP dibayar)"
      - "DP_Paid -> Confirmed (setelah pelunasan diterima)"
      - "Draft -> Confirmed (jika full payment langsung lunas)"
      - "DP_Paid -> Auto_Cancelled (jika pelunasan melewati deadline)"
      - "Draft -> Cancelled (pembatalan oleh customer/CS sebelum pembayaran)"
      - "DP_Paid -> Cancelled (pembatalan dengan refund setelah DP)"
      - "Confirmed -> Cancelled (pembatalan dengan refund setelah lunas)"

  - workflow: "Payment Intent Lifecycle"
    transitions:
      - "Pending -> Paid (webhook gateway mengkonfirmasi pembayaran)"
      - "Pending -> Expired (melewati batas waktu pembayaran)"
      - "Pending -> Failed (gateway melaporkan kegagalan)"
      - "Paid -> Refunded (setelah refund disetujui dan diproses)"

  - workflow: "Refund Lifecycle"
    transitions:
      - "Requested -> Approved (setelah approval oleh tenant_owner/operations_manager)"
      - "Requested -> Rejected (ditolak oleh approver)"
      - "Approved -> Completed (setelah gateway memproses refund)"

  - workflow: "Tenant KYB Lifecycle"
    transitions:
      - "Pending -> Approved (setelah verifikasi dokumen oleh Super Admin)"
      - "Pending -> Rejected (dokumen tidak memenuhi syarat)"
      - "Rejected -> Pending (tenant mengunggah ulang dokumen)"

  - workflow: "Tenant Subscription Lifecycle"
    transitions:
      - "Trial -> Active (konversi ke subscription berbayar)"
      - "Active -> Grace (pembayaran subscription terlambat)"
      - "Grace -> Active (pembayaran diterima dalam masa grace)"
      - "Grace -> Suspended (melewati masa grace tanpa pembayaran)"
      - "Suspended -> Active (pembayaran diterima setelah suspend)"
      - "Active -> Cancelled (tenant memutuskan berhenti berlangganan)"

  - workflow: "Vehicle Lifecycle"
    transitions:
      - "Active -> Maintenance (kendaraan masuk jadwal servis)"
      - "Maintenance -> Active (servis selesai, kendaraan siap operasi)"
      - "Active -> Inactive (kendaraan dinonaktifkan permanen)"

