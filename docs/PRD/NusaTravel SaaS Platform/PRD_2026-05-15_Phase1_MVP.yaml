acceptance_criteria:
  # ─── Core Booking Engine ───
  - story_id: "US-BKG-1"
    scenarios:
      - scenario: "Pencarian dan pemesanan tiket one-way berhasil"
        given: "Customer berada di halaman pencarian tiket"
        when: "Customer memilih origin, destination, tanggal keberangkatan, dan jumlah penumpang lalu klik Search"
        then: "Sistem menampilkan daftar trip schedule yang tersedia dengan harga dan sisa kursi"
      - scenario: "Pemesanan tiket round-trip berhasil"
        given: "Customer telah memilih trip keberangkatan"
        when: "Customer memilih trip untuk perjalanan kembali dan menyelesaikan checkout"
        then: "Sistem membuat satu booking dengan dua booking item (departure & return)"

  - story_id: "US-BKG-2"
    scenarios:
      - scenario: "Seat map menampilkan kursi tersedia dan terisi"
        given: "Customer telah memilih trip schedule"
        when: "Customer membuka halaman seat selection"
        then: "Sistem menampilkan layout kursi kendaraan dengan indikator available/booked/selected secara real-time"
      - scenario: "Customer memilih kursi spesifik"
        given: "Seat map ditampilkan dengan kursi tersedia"
        when: "Customer mengklik kursi yang diinginkan dan melanjutkan ke checkout"
        then: "Kursi tersebut di-lock untuk customer selama masa checkout dan tidak bisa dipilih customer lain"

  - story_id: "US-BKG-3"
    scenarios:
      - scenario: "Guest berhasil booking tanpa registrasi"
        given: "Guest berada di halaman checkout tanpa login"
        when: "Guest mengisi data penumpang, email, dan menyelesaikan pembayaran"
        then: "Sistem membuat booking dengan status guest, mengirim email konfirmasi, dan memberikan link untuk registrasi akun"

  - story_id: "US-BKG-4"
    scenarios:
      - scenario: "CS Agent membuat booking manual untuk customer"
        given: "CS Agent login ke dashboard tenant"
        when: "CS Agent mengisi form booking manual (data customer, trip, penumpang) dan submit"
        then: "Sistem membuat booking atas nama customer tersebut dengan flag created_by CS Agent"

  - story_id: "US-BKG-5"
    scenarios:
      - scenario: "Customer membatalkan booking yang belum dibayar"
        given: "Customer memiliki booking dengan status Draft"
        when: "Customer membuka halaman My Bookings dan klik Cancel"
        then: "Status booking berubah menjadi Cancelled dan kursi yang di-lock dilepaskan kembali ke inventori"
      - scenario: "Customer memodifikasi tanggal perjalanan"
        given: "Customer memiliki booking dengan status DP_Paid"
        when: "Customer mengajukan perubahan tanggal ke jadwal lain yang tersedia"
        then: "Sistem menghitung selisih harga (jika ada) dan mengupdate booking item dengan jadwal baru"

  - story_id: "US-BKG-6"
    scenarios:
      - scenario: "Operations Manager membuat group booking"
        given: "Operations Manager login ke dashboard tenant"
        when: "Operations Manager membuat booking dengan 20 penumpang, mengisi manifest nama dan ID masing-masing"
        then: "Sistem membuat satu booking header dengan 20 passenger records dan mengurangi 20 kursi dari inventori"

  - story_id: "US-BKG-7"
    scenarios:
      - scenario: "E-ticket dan QR code digenerate otomatis"
        given: "Booking telah dikonfirmasi (status Confirmed)"
        when: "Sistem memproses event booking.confirmed"
        then: "Setiap passenger menerima e-ticket dengan QR code unik yang dapat di-scan oleh driver/operator saat boarding"

  # ─── Payment & Financial Engine ───
  - story_id: "US-PAY-1"
    scenarios:
      - scenario: "Customer membayar DP 30% untuk booking"
        given: "Customer telah menyelesaikan pemilihan kursi dan checkout"
        when: "Customer memilih metode pembayaran DP dan menyelesaikan pembayaran DP sebesar 30%"
        then: "Status booking berubah menjadi DP_Paid, kursi dikonfirmasi, dan settlement deadline tercatat"

  - story_id: "US-PAY-2"
    scenarios:
      - scenario: "Tenant Owner mengatur DP minimum 25% untuk rute Jakarta-Bandung"
        given: "Tenant Owner login ke dashboard konfigurasi"
        when: "Tenant Owner mengatur DP minimum 25% untuk rute Jakarta-Bandung dan menyimpan"
        then: "Setiap booking untuk rute tersebut hanya bisa memilih DP minimal 25% dari total harga"

  - story_id: "US-PAY-3"
    scenarios:
      - scenario: "Customer menerima reminder pelunasan H-3"
        given: "Customer memiliki booking DP_Paid dengan settlement deadline 3 hari lagi"
        when: "Sistem scheduler berjalan pada H-3"
        then: "Customer menerima notifikasi WhatsApp dan email yang mengingatkan untuk melunasi sebelum deadline"

  - story_id: "US-PAY-4"
    scenarios:
      - scenario: "Customer membayar via Virtual Account BCA"
        given: "Customer berada di halaman pembayaran"
        when: "Customer memilih metode VA BCA dan menyelesaikan checkout"
        then: "Sistem membuat payment intent dengan VA number BCA, customer dapat transfer ke nomor VA tersebut"
      - scenario: "Customer membayar via QRIS"
        given: "Customer berada di halaman pembayaran"
        when: "Customer memilih metode QRIS"
        then: "Sistem menampilkan QR code QRIS yang dapat di-scan oleh aplikasi e-wallet"

  - story_id: "US-PAY-5"
    scenarios:
      - scenario: "Finance Staff memproses refund parsial"
        given: "Booking Confirmed dengan nilai Rp 500.000, customer mengajukan refund 50%"
        when: "Finance Staff membuat refund request parsial Rp 250.000 dan mengirim ke approval"
        then: "Refund request menunggu approval tenant_owner sebelum diproses ke gateway"
      - scenario: "Refund disetujui dan diproses"
        given: "Refund request menunggu approval"
        when: "Tenant Owner menyetujui refund"
        then: "Sistem memproses refund ke gateway dan mengupdate status refund menjadi Completed"

  - story_id: "US-PAY-6"
    scenarios:
      - scenario: "Finance Staff melihat laporan rekonsiliasi harian"
        given: "Finance Staff login ke dashboard"
        when: "Finance Staff membuka halaman Rekonsiliasi Harian untuk tanggal tertentu"
        then: "Sistem menampilkan semua transaksi masuk (payment confirmed) dan keluar (refund) yang direkonsiliasi dengan data gateway"

  - story_id: "US-PAY-7"
    scenarios:
      - scenario: "Tenant Owner mengatur markup 5% untuk channel agen eksternal"
        given: "Tenant Owner login ke dashboard pricing"
        when: "Tenant Owner menambahkan markup rule 5% untuk sales channel 'Agen Mitra'"
        then: "Setiap booking yang berasal dari channel 'Agen Mitra' otomatis dikenakan markup 5% dari harga dasar"

  # ─── Fleet & Driver Management ───
  - story_id: "US-FLT-1"
    scenarios:
      - scenario: "Operations Manager mendaftarkan kendaraan baru"
        given: "Operations Manager login ke dashboard fleet"
        when: "Operations Manager mengisi form kendaraan (nomor polisi, tipe, kapasitas, fasilitas) dan submit"
        then: "Kendaraan baru tersimpan dengan status Active dan siap di-assign ke jadwal"

  - story_id: "US-FLT-2"
    scenarios:
      - scenario: "Operations Manager meng-assign kendaraan ke trip schedule"
        given: "Ada trip schedule tanpa kendaraan dan kendaraan tersedia"
        when: "Operations Manager memilih kendaraan untuk trip schedule tersebut"
        then: "Sistem memvalidasi tidak ada konflik jadwal dan meng-assign kendaraan"
      - scenario: "Sistem menolak double-assignment kendaraan"
        given: "Kendaraan A sudah di-assign ke Trip X pada jam 08:00-12:00"
        when: "Operations Manager mencoba meng-assign Kendaraan A ke Trip Y pada jam 10:00-14:00"
        then: "Sistem menolak dengan pesan error 'Kendaraan sudah di-assign pada jadwal yang bentrok'"

  - story_id: "US-FLT-3"
    scenarios:
      - scenario: "Operations Manager onboarding pengemudi baru"
        given: "Operations Manager login ke dashboard driver"
        when: "Operations Manager mengisi data pengemudi (nama, SIM, KTP, rekam jejak) dan submit"
        then: "Pengemudi baru tersimpan dengan status Active dan siap dijadwalkan"

  - story_id: "US-FLT-4"
    scenarios:
      - scenario: "Fleet Supervisor menjadwalkan maintenance"
        given: "Fleet Supervisor login ke dashboard maintenance"
        when: "Fleet Supervisor menambahkan jadwal servis berkala untuk Kendaraan X pada tanggal tertentu"
        then: "Status kendaraan berubah menjadi Maintenance pada tanggal tersebut"
      - scenario: "Notifikasi maintenance jatuh tempo terkirim"
        given: "Kendaraan Y memiliki jadwal servis 3 hari lagi"
        when: "Sistem scheduler berjalan"
        then: "Fleet Supervisor menerima notifikasi bahwa servis Kendaraan Y jatuh tempo dalam 3 hari"

  - story_id: "US-FLT-5"
    scenarios:
      - scenario: "Driver melihat jadwal perjalanan hari ini"
        given: "Driver login ke aplikasi mobile/dashboard"
        when: "Driver membuka halaman My Schedule"
        then: "Sistem menampilkan daftar trip yang di-assign ke driver tersebut untuk hari ini"
      - scenario: "Driver update status perjalanan"
        given: "Driver sedang dalam perjalanan"
        when: "Driver mengupdate status menjadi 'Berangkat' atau 'Tiba di tujuan'"
        then: "Status trip schedule terupdate secara real-time dan terlihat oleh operations manager"

  # ─── Tour Package & Itinerary Management ───
  - story_id: "US-TOUR-1"
    scenarios:
      - scenario: "Tenant Owner membuat paket wisata baru"
        given: "Tenant Owner login ke dashboard tour package"
        when: "Tenant Owner mengisi nama paket, deskripsi, durasi, inklusi/eksklusi, itinerary harian, dan harga"
        then: "Paket wisata tersimpan dengan status Draft dan bisa dipublikasikan"
      - scenario: "Tenant Owner mem-bundle transportasi dan hotel dalam paket"
        given: "Tenant Owner sedang membuat paket wisata"
        when: "Tenant Owner menambahkan komponen transportasi (trip schedule) dan hotel (kamar) ke dalam paket"
        then: "Harga paket otomatis mengkalkulasi total dari komponen yang di-bundle"

  - story_id: "US-TOUR-2"
    scenarios:
      - scenario: "Customer memesan paket wisata dengan DP"
        given: "Customer melihat halaman detail paket wisata"
        when: "Customer memilih tanggal keberangkatan, jumlah pax, dan memilih opsi DP 30%"
        then: "Customer diarahkan ke checkout dengan total DP yang harus dibayar dan deadline pelunasan"

  - story_id: "US-TOUR-3"
    scenarios:
      - scenario: "Marketing Staff menambahkan foto ke galeri paket"
        given: "Marketing Staff login dan membuka editor paket wisata"
        when: "Marketing Staff mengunggah 5 foto ke galeri paket dan menambahkan deskripsi rich text"
        then: "Halaman publik paket wisata menampilkan galeri foto dan konten yang telah diformat"

  - story_id: "US-TOUR-4"
    scenarios:
      - scenario: "Customer melihat kalender ketersediaan paket"
        given: "Customer berada di halaman detail paket wisata"
        when: "Customer membuka availability calendar"
        then: "Sistem menampilkan kalender dengan tanggal yang tersedia (hijau) dan yang sudah penuh (merah)"

  # ─── Vehicle Rental Management ───
  - story_id: "US-RNT-1"
    scenarios:
      - scenario: "Customer memesan rental mobil dengan driver"
        given: "Customer berada di halaman katalog rental"
        when: "Customer memilih kendaraan, opsi 'Dengan Driver', tanggal mulai & selesai, lalu checkout dengan DP"
        then: "Booking rental dibuat dengan status DP_Paid dan kendaraan di-reserve untuk periode tersebut"

  - story_id: "US-RNT-2"
    scenarios:
      - scenario: "CS Agent membuat kontrak digital"
        given: "Booking rental telah dikonfirmasi"
        when: "CS Agent mengirim kontrak digital ke customer melalui platform e-signature"
        then: "Customer menerima link untuk menandatangani kontrak secara digital, dan kontrak tersimpan di sistem"

  - story_id: "US-RNT-3"
    scenarios:
      - scenario: "Finance Staff menahan deposit rental"
        given: "Customer akan mengambil kendaraan rental"
        when: "Finance Staff membuat payment intent deposit_hold sebesar Rp 1.000.000"
        then: "Deposit di-hold dari customer dan akan di-release saat kendaraan dikembalikan tanpa masalah"
      - scenario: "Finance Staff memotong deposit untuk denda"
        given: "Kendaraan rental dikembalikan dengan kerusakan"
        when: "Finance Staff memotong deposit sebesar biaya perbaikan Rp 300.000"
        then: "Sisa deposit Rp 700.000 di-release ke customer dan Rp 300.000 dicatat sebagai denda"

  - story_id: "US-RNT-4"
    scenarios:
      - scenario: "CS Agent mendokumentasikan kondisi kendaraan"
        given: "Customer akan mengambil kendaraan rental"
        when: "CS Agent mengambil foto kondisi kendaraan (eksterior, interior) dan menyimpannya di sistem"
        then: "Foto kondisi sebelum rental tersimpan sebagai bukti untuk perbandingan saat pengembalian"

  # ─── Airport Transfer & Shuttle Management ───
  - story_id: "US-XFER-1"
    scenarios:
      - scenario: "Customer memesan transfer bandara arrival"
        given: "Customer berada di halaman transfer bandara"
        when: "Customer memilih tipe Arrival, mengisi nomor penerbangan, jumlah pax, dan memilih tipe kendaraan MPV"
        then: "Booking transfer dibuat dengan detail penerbangan dan tipe kendaraan yang dipilih"

  - story_id: "US-XFER-2"
    scenarios:
      - scenario: "Operations Manager membuat jadwal shuttle tetap"
        given: "Operations Manager login ke dashboard shuttle"
        when: "Operations Manager membuat rute shuttle Jakarta-Bandung dengan jadwal keberangkatan setiap jam 08:00 dan 14:00"
        then: "Jadwal shuttle tersimpan dan tersedia untuk dipesan customer"

  - story_id: "US-XFER-3"
    scenarios:
      - scenario: "Passenger mengakses manifest digital"
        given: "Passenger telah booking shuttle"
        when: "Passenger membuka halaman e-ticket/booking detail"
        then: "Passenger dapat melihat detail perjalanan termasuk titik keberangkatan, estimasi tiba, dan kontak darurat"

  # ─── Hotel & Accommodation Management ───
  - story_id: "US-HTL-1"
    scenarios:
      - scenario: "Tenant Owner mendaftarkan properti hotel"
        given: "Tenant Owner login ke dashboard hotel"
        when: "Tenant Owner mengisi data properti (nama, alamat, bintang) dan menambahkan tipe kamar dengan harga"
        then: "Properti hotel dan tipe kamar tersimpan dan siap dijual"

  - story_id: "US-HTL-2"
    scenarios:
      - scenario: "Customer memesan kamar hotel dengan DP"
        given: "Customer melihat detail hotel"
        when: "Customer memilih tipe kamar, tanggal check-in/check-out, dan membayar DP 25%"
        then: "Booking hotel dibuat dengan status DP_Paid, kamar di-reserve, dan deadline pelunasan sebelum check-in"

  - story_id: "US-HTL-3"
    scenarios:
      - scenario: "Finance Staff mengkonfigurasi cancellation policy"
        given: "Finance Staff login ke dashboard hotel"
        when: "Finance Staff mengatur cancellation policy: 'Free cancellation H-7, 50% refund H-3, no refund < H-3'"
        then: "Setiap pembatalan booking hotel otomatis mengikuti policy tersebut"

  # ─── Tenant & Multi-Tenancy Management ───
  - story_id: "US-TNT-1"
    scenarios:
      - scenario: "Bisnis baru mendaftar tenant"
        given: "Calon tenant berada di halaman pendaftaran"
        when: "Calon tenant mengisi data bisnis (legal name, business type, owner email) dan mengunggah dokumen KYB"
        then: "Tenant dibuat dengan status KYB Pending dan Super Admin menerima notifikasi untuk review"

  - story_id: "US-TNT-2"
    scenarios:
      - scenario: "Tenant Owner mengkonfigurasi white-label"
        given: "Tenant Owner login ke dashboard pengaturan"
        when: "Tenant Owner mengunggah logo, memilih warna primer, dan mengatur custom domain"
        then: "Customer-facing pages menampilkan branding tenant tersebut"

  - story_id: "US-TNT-3"
    scenarios:
      - scenario: "Super Admin mengelola tier subscription"
        given: "Super Admin login ke SaaS dashboard"
        when: "Super Admin mengubah tier tenant dari Starter ke Growth dan mengaktifkan feature flag tambahan"
        then: "Tenant langsung mendapatkan akses ke fitur-fitur tier Growth"

  - story_id: "US-TNT-4"
    scenarios:
      - scenario: "Super Admin men-suspend tenant"
        given: "Tenant melanggar kebijakan platform"
        when: "Super Admin membuka halaman tenant dan klik Suspend"
        then: "Semua user tenant tidak dapat login, dan customer-facing pages tenant menampilkan pesan maintenance"

  # ─── Identity, Access & Security (IAM) ───
  - story_id: "US-IAM-1"
    scenarios:
      - scenario: "User registrasi dengan email dan password"
        given: "User berada di halaman registrasi"
        when: "User mengisi email, password (min 8 karakter, ada huruf besar & angka), dan submit"
        then: "Akun dibuat, email verifikasi dikirim, dan user bisa login setelah verifikasi"
      - scenario: "User login dengan Google OAuth"
        given: "User berada di halaman login"
        when: "User klik 'Login with Google' dan menyetujui otorisasi"
        then: "User berhasil login tanpa password, akun otomatis terverifikasi"

  - story_id: "US-IAM-2"
    scenarios:
      - scenario: "Tenant Owner mengaktifkan TOTP 2FA"
        given: "Tenant Owner login ke pengaturan keamanan"
        when: "Tenant Owner mengaktifkan 2FA metode TOTP dan memindai QR code dengan authenticator app"
        then: "Setiap login berikutnya akan meminta kode TOTP setelah password berhasil"

  - story_id: "US-IAM-3"
    scenarios:
      - scenario: "Super Admin mengkonfigurasi permission role"
        given: "Super Admin login ke dashboard RBAC"
        when: "Super Admin menambahkan permission 'booking.approve' ke role operations_manager"
        then: "Semua user dengan role operations_manager langsung memiliki izin tersebut"

  - story_id: "US-IAM-4"
    scenarios:
      - scenario: "Tenant Owner melakukan forced logout"
        given: "Tenant Owner melihat daftar sesi aktif"
        when: "Tenant Owner mengklik 'Revoke' pada sesi yang mencurigakan"
        then: "Sesi tersebut langsung di-revoke dan user terkait harus login ulang"

  - story_id: "US-IAM-5"
    scenarios:
      - scenario: "Super Admin mencari audit log"
        given: "Super Admin login ke dashboard audit"
        when: "Super Admin memfilter audit log berdasarkan user, rentang tanggal, dan tipe aksi"
        then: "Sistem menampilkan daftar log dengan detail who, what, when, from where, dan old/new values"

  # ─── Pricing & Inventory Engine ───
  - story_id: "US-PRC-1"
    scenarios:
      - scenario: "Operations Manager menetapkan harga dasar rute"
        given: "Operations Manager login ke dashboard pricing"
        when: "Operations Manager menetapkan harga Rp 150.000 untuk rute Jakarta-Bandung"
        then: "Semua trip schedule di rute tersebut menggunakan harga dasar Rp 150.000"

  - story_id: "US-PRC-2"
    scenarios:
      - scenario: "Operations Manager mengatur holiday surcharge"
        given: "Operations Manager login ke dashboard pricing"
        when: "Operations Manager menambahkan surcharge 20% untuk periode Lebaran (tanggal tertentu)"
        then: "Harga tiket di periode tersebut otomatis naik 20% dari harga dasar"

  - story_id: "US-PRC-3"
    scenarios:
      - scenario: "Customer mendapat early bird discount"
        given: "Customer mencari tiket untuk keberangkatan 30 hari lagi"
        when: "Sistem menghitung harga dengan early bird discount 15%"
        then: "Customer melihat harga yang lebih murah dibandingkan pemesanan mendekati keberangkatan"

  # ─── Promotions & Loyalty Engine ───
  - story_id: "US-PROMO-1"
    scenarios:
      - scenario: "Marketing Staff membuat voucher diskon"
        given: "Marketing Staff login ke dashboard promosi"
        when: "Marketing Staff membuat voucher 'LEBARAN20' dengan diskon 20%, maksimal 500 penggunaan, berlaku sampai akhir bulan"
        then: "Voucher tersimpan dan siap digunakan customer saat checkout"

  - story_id: "US-PROMO-2"
    scenarios:
      - scenario: "Customer menggunakan voucher saat checkout"
        given: "Customer berada di halaman checkout dengan total Rp 500.000"
        when: "Customer memasukkan kode voucher 'LEBARAN20' yang memberikan diskon 20%"
        then: "Total pembayaran berkurang menjadi Rp 400.000 dan penggunaan voucher tercatat"

  # ─── Notifications & Communications ───
  - story_id: "US-NTF-1"
    scenarios:
      - scenario: "Customer menerima email konfirmasi booking"
        given: "Booking baru saja dibuat dengan status Draft"
        when: "Sistem memproses event booking.created"
        then: "Customer menerima email berisi detail booking, jumlah yang harus dibayar, dan instruksi pembayaran"

  - story_id: "US-NTF-2"
    scenarios:
      - scenario: "Customer menerima e-ticket via WhatsApp"
        given: "Booking telah dikonfirmasi (Confirmed)"
        when: "Sistem mengirim e-ticket melalui WhatsApp Business API"
        then: "Customer menerima pesan WhatsApp berisi QR code dan detail perjalanan"

  - story_id: "US-NTF-3"
    scenarios:
      - scenario: "Tenant Owner mengkustomisasi template notifikasi"
        given: "Tenant Owner login ke pengaturan notifikasi"
        when: "Tenant Owner mengedit template email konfirmasi dengan logo dan warna brand"
        then: "Semua email konfirmasi ke customer tenant tersebut menggunakan template yang sudah dikustomisasi"

  # ─── CRM & Customer Management ───
  - story_id: "US-CRM-1"
    scenarios:
      - scenario: "CS Agent melihat profil customer"
        given: "Customer menghubungi CS Agent"
        when: "CS Agent mencari customer berdasarkan email atau nomor telepon"
        then: "Sistem menampilkan profil lengkap customer beserta histori booking dan status pembayaran"

  - story_id: "US-CRM-2"
    scenarios:
      - scenario: "Customer menulis review setelah perjalanan"
        given: "Perjalanan customer telah selesai (trip status Completed)"
        when: "Customer membuka halaman booking dan menulis review bintang 4 serta komentar"
        then: "Review tersimpan dengan status pending moderation dan akan ditampilkan setelah disetujui"

  - story_id: "US-CRM-3"
    scenarios:
      - scenario: "CS Agent membuka tiket komplain"
        given: "Customer melaporkan keluhan melalui form complaint"
        when: "CS Agent menerima notifikasi komplain baru dan membuka tiket"
        then: "Sistem membuat tiket komplain dengan status Open, tercatat timestamp, dan CS Agent dapat merespons"

  # ─── Analytics & Reporting ───
  - story_id: "US-ANL-1"
    scenarios:
      - scenario: "Tenant Owner melihat dashboard real-time"
        given: "Tenant Owner login ke dashboard"
        when: "Tenant Owner membuka halaman Dashboard"
        then: "Sistem menampilkan metrik hari ini: total booking, total revenue, occupancy rate, dan outstanding DP"

  - story_id: "US-ANL-2"
    scenarios:
      - scenario: "Finance Staff mengekspor laporan keuangan"
        given: "Finance Staff berada di halaman laporan keuangan"
        when: "Finance Staff memilih periode bulan ini dan klik Export PDF"
        then: "Sistem menghasilkan file PDF berisi laporan revenue, refund, dan settlement untuk periode tersebut"

  - story_id: "US-ANL-3"
    scenarios:
      - scenario: "Super Admin melihat SaaS analytics"
        given: "Super Admin login ke SaaS dashboard"
        when: "Super Admin membuka halaman Platform Analytics"
        then: "Sistem menampilkan grafik tenant growth, GMV bulanan, dan churn rate"

  # ─── Vendor & Partner Management ───
  - story_id: "US-VND-1"
    scenarios:
      - scenario: "Operations Manager onboarding vendor baru"
        given: "Operations Manager login ke dashboard vendor"
        when: "Operations Manager mengisi data vendor (nama, kontak, informasi bank) dan mengunggah kontrak"
        then: "Vendor tersimpan dengan status Active dan siap dikaitkan dengan produk"

  - story_id: "US-VND-2"
    scenarios:
      - scenario: "Operations Manager mengatur komisi vendor"
        given: "Vendor telah terdaftar"
        when: "Operations Manager mengatur komisi 10% untuk produk-produk dari vendor tersebut"
        then: "Setiap penjualan produk vendor otomatis menghitung komisi 10% untuk vendor"
