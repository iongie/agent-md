name: "NusaTravel SaaS Platform — Phase 2: Growth"
version: "1.0.0"
generated_at: "2026-05-15"
objective: >
  Memperluas platform NusaTravel dari MVP ke fase Growth dengan menambahkan
  integrasi multi-moda lanjutan (penerbangan via GDS, kereta api via KAI),
  fitur pembayaran lanjutan (split payment, BNPL, corporate billing),
  operational excellence (GPS tracking, auto-dispatch, driver performance),
  personalisasi & loyalty (dynamic pricing, loyalty points, referral),
  serta enterprise readiness (SSO, branch management, impersonation mode).

target_metrics:
  - "Onboarding 50+ tenant pada akhir Phase 2"
  - "Integrasi minimal 2 GDS provider dan 1 KAI API"
  - "Tingkat retensi customer meningkat 25% melalui loyalty program"
  - "Tingkat utilisasi armada meningkat 15% melalui dynamic pricing & last-minute deal"
  - "Waktu dispatch pengemudi berkurang 40% melalui auto-assignment"
  - "Corporate segment menyumbang 20% dari total GMV"

phases:
  - id: "phase-2"
    name: "Growth"
    duration: "Month 5-9"
    modules:
      - "Core Booking Engine (Extended)"
      - "Payment & Financial Engine (Extended)"
      - "Fleet & Driver Management (Extended)"
      - "Tour Package & Itinerary Management (Extended)"
      - "Vehicle Rental Management (Extended)"
      - "Airport Transfer & Shuttle Management (Extended)"
      - "Hotel & Accommodation Management (Extended)"
      - "Tenant & Multi-Tenancy Management (Extended)"
      - "Identity, Access & Security (Extended)"
      - "Pricing & Inventory Engine (Extended)"
      - "Promotions & Loyalty Engine (Extended)"
      - "Notifications & Communications (Extended)"
      - "CRM & Customer Management (Extended)"
      - "Analytics & Reporting (Extended)"
      - "Vendor & Partner Management (Extended)"

scope:
  in_scope:
    # Core Booking Engine (Extended)
    - "Booking penerbangan via integrasi GDS / OTA API (Amadeus, Sabre, Travelport)"
    - "Booking kereta api via integrasi KAI Access / INKA API"
    - "Waitlist management & auto-notify saat seat tersedia"
    # Payment & Financial Engine (Extended)
    - "Split payment (patungan bayar untuk group booking)"
    - "Paylater / BNPL integration (Kredivo, Akulaku, Atome)"
    - "Corporate invoice & net-term billing (Net 30/Net 60)"
    # Fleet & Driver Management (Extended)
    - "GPS real-time tracking armada"
    - "Geofence alert (kendaraan keluar dari rute yang ditentukan)"
    - "Driver performance scorecard (ketepatan waktu, rating penumpang)"
    - "Laporan utilisasi armada (% aktif vs idle per periode)"
    # Tour Package & Itinerary Management (Extended)
    - "Paket custom / tailor-made quotation request"
    - "Template paket wisata (clone & modifikasi paket yang sudah ada)"
    # Vehicle Rental Management (Extended)
    - "Overtime & late return fee calculation otomatis"
    - "Blacklist customer bermasalah"
    - "Integrasi GPS tracker untuk kendaraan yang sedang disewa"
    # Airport Transfer & Shuttle Management (Extended)
    - "Integrasi data penerbangan untuk flight tracking & buffer keterlambatan"
    - "Shuttle on-demand (booking & dispatch real-time)"
    - "Penugasan pengemudi otomatis berdasarkan ketersediaan & lokasi"
    - "Live tracking link untuk dikirim ke customer"
    # Hotel & Accommodation Management (Extended)
    - "Integrasi OTA eksternal (Booking.com, Agoda, Traveloka) via channel manager"
    # Tenant & Multi-Tenancy Management (Extended)
    - "Sub-tenant / cabang (Branch Management) untuk enterprise"
    - "Impersonation mode (read-only) untuk SaaS support"
    # Identity, Access & Security (Extended)
    - "SSO via SAML 2.0 / OIDC untuk tenant enterprise"
    - "Passkey / WebAuthn authentication support"
    # Pricing & Inventory Engine (Extended)
    - "Dynamic pricing otomatis berdasarkan % kursi terisi"
    - "Last-minute deal untuk kursi yang belum terjual"
    - "Corporate rate & contract pricing per klien"
    # Promotions & Loyalty Engine (Extended)
    - "Flash sale dengan countdown timer"
    - "Loyalty points system (earn & redeem)"
    - "Referral program (customer ajak teman, keduanya dapat reward)"
    - "Cashback campaign management"
    # Notifications & Communications (Extended)
    - "Push notification (mobile & web) untuk status booking"
    - "In-app chat antara CS tenant dan customer"
    # CRM & Customer Management (Extended)
    - "Segmentasi customer (frekuensi, value, rute favorit)"
    - "Customer lifetime value (CLV) tracking"
    - "Customer acquisition & retention funnel analytics"
    # Analytics & Reporting (Extended)
    - "Scheduled report via email (harian/mingguan/bulanan)"
    # Vendor & Partner Management (Extended)
    - "Vendor portal self-service: vendor input jadwal, stok, harga sendiri"
    - "Disbursement otomatis ke rekening vendor pasca settlement"
    - "Vendor performance rating & review"

  out_of_scope:
    - "Native mobile application (iOS/Android) — cukup dengan mobile-responsive web & PWA"
    - "Hardware GPS tracker sendiri — menggunakan integrasi hardware pihak ketiga"
    - "Payment gateway sendiri — tetap menggunakan integrasi pihak ketiga"
    - "Marketplace publik antar-tenant"
    - "Modul HR/Payroll pengemudi"
    - "Akuntansi & ERP terintegrasi"
    - "Program asuransi perjalanan"
    - "Sistem ticketing event/konser"

roles:
  - id: "super_admin"
    name: "Super Admin"
    description: >
      Admin level SaaS: mengelola seluruh platform, onboarding tenant,
      konfigurasi global pricing rules, monitoring system health, manajemen
      subscription & billing antar tenant, audit log penuh, suspend/activate tenant.

  - id: "saas_support_agent"
    name: "SaaS Support Agent"
    description: >
      Memberikan dukungan teknis & operasional kepada tenant; impersonation mode
      read-only untuk troubleshoot masalah tenant; eskalasi tiket.

  - id: "saas_billing_admin"
    name: "SaaS Billing Admin"
    description: >
      Mengelola invoice tenant, pembayaran subscription, dispute resolution,
      laporan revenue platform, refund & credit note kepada tenant.

  - id: "saas_product_manager"
    name: "SaaS Product Manager"
    description: >
      Konfigurasi feature flags per tier, manajemen changelog, announcement
      platform-wide, A/B testing fitur baru.

  - id: "tenant_owner"
    name: "Tenant Owner"
    description: >
      Pemilik akun bisnis: setup profil perusahaan, white-label branding,
      manajemen subscription, akses penuh semua modul, undang & kelola user internal.

  - id: "operations_manager"
    name: "Operations Manager"
    description: >
      Mengelola jadwal perjalanan, armada, pengemudi, rute, dan kapasitas.
      Approval pemesanan grup, override pricing, manajemen vendor pihak ketiga.

  - id: "finance_staff"
    name: "Finance Staff"
    description: >
      Rekonsiliasi pembayaran, manajemen DP & pelunasan, penerbitan invoice,
      laporan keuangan harian/bulanan, verifikasi transfer manual, kelola corporate billing.

  - id: "booking_staff_cs"
    name: "Booking Staff / CS Agent"
    description: >
      Input pemesanan manual, modifikasi & pembatalan booking atas nama customer,
      verifikasi dokumen perjalanan, komunikasi dengan customer via in-app chat.

  - id: "driver_operator"
    name: "Driver / Operator"
    description: >
      Akses jadwal perjalanan pribadi, konfirmasi keberangkatan, update status
      perjalanan real-time, laporan insiden, akses manifest penumpang.

  - id: "fleet_supervisor"
    name: "Fleet Supervisor"
    description: >
      Monitor posisi armada via GPS, jadwal maintenance kendaraan, assign driver
      ke kendaraan, laporan utilisasi armada, pantau driver performance scorecard.

  - id: "marketing_staff"
    name: "Marketing Staff"
    description: >
      Buat & kelola promo/voucher, campaign email/push notification, kelola konten
      paket wisata, pantau performa campaign, kelola loyalty & referral program.

  - id: "registered_customer"
    name: "Registered Customer (B2C)"
    description: >
      Cari & pesan tiket, paket wisata, rental kendaraan, atau hotel.
      Bayar DP atau full payment, kelola booking aktif, tulis ulasan, gunakan voucher,
      kumpulkan & redeem loyalty points, ikut referral program.

  - id: "corporate_booker"
    name: "Corporate Booker (B2B)"
    description: >
      Pesan perjalanan bisnis atas nama perusahaan, akses corporate rate,
      manajemen travel policy, approval workflow, laporan pengeluaran perjalanan,
      corporate invoice & net-term billing.

  - id: "guest"
    name: "Guest (Unauthenticated)"
    description: >
      Browsing produk & harga, cek ketersediaan, booking tanpa registrasi
      dengan email konfirmasi, redirect ke registrasi pasca-booking.

  - id: "passenger_traveler"
    name: "Passenger / Traveler"
    description: >
      Akses e-ticket, boarding pass digital, status perjalanan real-time,
      live tracking link, emergency contact, rating & review pasca-perjalanan.

data_models:
  # Extended entities for Phase 2
  - entity_name: "FlightBooking"
    description: "Booking penerbangan yang terintegrasi dengan GDS/OTA API."
    key_attributes:
      - "id (ULID, PK)"
      - "booking_item_id (FK ke BookingItem)"
      - "gds_provider (amadeus/sabre/travelport)"
      - "gds_booking_ref"
      - "airline_code"
      - "flight_number"
      - "departure_airport"
      - "arrival_airport"
      - "departure_at"
      - "arrival_at"
      - "ticket_number"
      - "pnr_code"

  - entity_name: "TrainBooking"
    description: "Booking kereta api via KAI Access/INKA API."
    key_attributes:
      - "id (ULID, PK)"
      - "booking_item_id (FK ke BookingItem)"
      - "kai_booking_ref"
      - "train_number"
      - "train_name"
      - "class (ekonomi/bisnis/eksekutif)"
      - "departure_station"
      - "arrival_station"
      - "departure_at"
      - "arrival_at"

  - entity_name: "Waitlist"
    description: "Daftar tunggu customer untuk trip yang sudah penuh."
    key_attributes:
      - "id (ULID, PK)"
      - "trip_schedule_id (FK)"
      - "customer_id (FK)"
      - "pax_count"
      - "status (waiting/notified/expired/converted)"
      - "notified_at"

  - entity_name: "SplitPayment"
    description: "Pembayaran patungan untuk group booking."
    key_attributes:
      - "id (ULID, PK)"
      - "booking_id (FK)"
      - "total_split_amount"
      - "status (pending_partial/fully_paid)"
      - "split_deadline"

  - entity_name: "SplitPaymentShare"
    description: "Bagian pembayaran individual dalam split payment."
    key_attributes:
      - "id (ULID, PK)"
      - "split_payment_id (FK)"
      - "payer_email"
      - "share_amount"
      - "payment_intent_id (FK)"
      - "status (pending/paid)"

  - entity_name: "CorporateAccount"
    description: "Akun korporat dengan contract pricing dan net-term billing."
    key_attributes:
      - "id (ULID, PK)"
      - "tenant_id (FK)"
      - "company_name"
      - "contract_discount_percentage"
      - "billing_term (net_30/net_60)"
      - "credit_limit"
      - "status (active/inactive)"

  - entity_name: "CorporateInvoice"
    description: "Invoice untuk corporate booking dengan net-term."
    key_attributes:
      - "id (ULID, PK)"
      - "corporate_account_id (FK)"
      - "booking_id (FK)"
      - "invoice_number"
      - "total_amount"
      - "due_date"
      - "status (unpaid/paid/overdue)"

  - entity_name: "GpsTrackingRecord"
    description: "Data tracking GPS armada secara real-time."
    key_attributes:
      - "id (ULID, PK)"
      - "vehicle_id (FK)"
      - "trip_schedule_id (FK, nullable)"
      - "latitude"
      - "longitude"
      - "speed_kmh"
      - "heading"
      - "recorded_at"

  - entity_name: "GeofenceZone"
    description: "Zona geofence untuk monitoring rute kendaraan."
    key_attributes:
      - "id (ULID, PK)"
      - "tenant_id (FK)"
      - "zone_name"
      - "route_id (FK)"
      - "polygon_coordinates (JSONB)"
      - "alert_on_exit (boolean)"

  - entity_name: "GeofenceAlert"
    description: "Alert ketika kendaraan keluar dari zona geofence."
    key_attributes:
      - "id (ULID, PK)"
      - "geofence_zone_id (FK)"
      - "vehicle_id (FK)"
      - "gps_record_id (FK)"
      - "alert_type (exit/enter)"
      - "resolved_at"

  - entity_name: "DriverScorecard"
    description: "Kartu performa pengemudi berdasarkan metrik operasional."
    key_attributes:
      - "id (ULID, PK)"
      - "driver_id (FK)"
      - "period_start"
      - "period_end"
      - "on_time_percentage"
      - "avg_passenger_rating"
      - "total_trips_completed"
      - "incident_count"
      - "overall_score"

  - entity_name: "LoyaltyPoints"
    description: "Poin loyalitas yang dikumpulkan customer."
    key_attributes:
      - "id (ULID, PK)"
      - "customer_id (FK)"
      - "tenant_id (FK)"
      - "total_points_earned"
      - "total_points_redeemed"
      - "current_balance"

  - entity_name: "LoyaltyTransaction"
    description: "Riwayat transaksi poin loyalitas."
    key_attributes:
      - "id (ULID, PK)"
      - "loyalty_points_id (FK)"
      - "transaction_type (earn/redeem/expire/adjust)"
      - "points_amount"
      - "reference_type (booking/referral/bonus)"
      - "reference_id"

  - entity_name: "Referral"
    description: "Program referral customer."
    key_attributes:
      - "id (ULID, PK)"
      - "referrer_customer_id (FK)"
      - "referred_email"
      - "referral_code (unique)"
      - "status (pending/registered/booked/rewarded)"
      - "reward_granted_at"

  - entity_name: "FlashSale"
    description: "Campaign flash sale dengan countdown timer."
    key_attributes:
      - "id (ULID, PK)"
      - "tenant_id (FK)"
      - "sale_name"
      - "discount_percentage"
      - "starts_at"
      - "ends_at"
      - "max_redemptions"
      - "current_redemptions"
      - "status (scheduled/active/ended)"

  - entity_name: "InAppChatMessage"
    description: "Pesan dalam in-app chat antara CS dan customer."
    key_attributes:
      - "id (ULID, PK)"
      - "booking_id (FK)"
      - "sender_type (cs/customer)"
      - "sender_id (FK user)"
      - "message_text"
      - "attachment_url"
      - "read_at"
      - "sent_at"

  - entity_name: "Branch"
    description: "Cabang/sub-tenant untuk enterprise."
    key_attributes:
      - "id (ULID, PK)"
      - "parent_tenant_id (FK)"
      - "branch_name"
      - "branch_code"
      - "address"
      - "status (active/inactive)"

  - entity_name: "VendorPortalAccess"
    description: "Akses self-service vendor ke portal."
    key_attributes:
      - "id (ULID, PK)"
      - "vendor_id (FK)"
      - "user_id (FK)"
      - "permissions (JSONB — modul yang bisa diakses vendor)"
      - "status (active/inactive)"

  - entity_name: "VendorDisbursement"
    description: "Pembayaran otomatis ke rekening vendor."
    key_attributes:
      - "id (ULID, PK)"
      - "vendor_id (FK)"
      - "period_start"
      - "period_end"
      - "total_commission"
      - "disbursement_status (pending/processing/completed/failed)"
      - "disbursed_at"
      - "transaction_ref"

state_machines:
  - workflow: "Waitlist Lifecycle"
    transitions:
      - "Waiting -> Notified (seat tersedia, customer diberitahu)"
      - "Notified -> Converted (customer berhasil booking)"
      - "Notified -> Expired (customer tidak merespons dalam batas waktu)"
      - "Waiting -> Expired (trip sudah lewat tanpa seat tersedia)"

  - workflow: "Split Payment Lifecycle"
    transitions:
      - "Pending_Partial -> Fully_Paid (semua share sudah dibayar)"
      - "Pending_Partial -> Expired (melewati split deadline)"

  - workflow: "Corporate Invoice Lifecycle"
    transitions:
      - "Unpaid -> Paid (pembayaran diterima)"
      - "Unpaid -> Overdue (melewati due_date tanpa pembayaran)"
      - "Overdue -> Paid (pembayaran diterima setelah overdue)"

  - workflow: "Flash Sale Lifecycle"
    transitions:
      - "Scheduled -> Active (starts_at tercapai)"
      - "Active -> Ended (ends_at tercapai ATAU max_redemptions tercapai)"

  - workflow: "Referral Lifecycle"
    transitions:
      - "Pending -> Registered (referred user mendaftar)"
      - "Registered -> Booked (referred user melakukan booking pertama)"
      - "Booked -> Rewarded (reward diberikan ke referrer & referred)"

  - workflow: "Vendor Disbursement Lifecycle"
    transitions:
      - "Pending -> Processing (sistem mulai proses disbursement)"
      - "Processing -> Completed (transfer berhasil)"
      - "Processing -> Failed (transfer gagal, perlu retry manual)"

