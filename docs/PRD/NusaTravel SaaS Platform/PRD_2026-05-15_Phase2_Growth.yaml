    benefit: "saya dapat melakukan troubleshooting masalah tenant dengan cepat dan aman"

  # ─── Identity, Access & Security (Extended) ───
  - id: "US-IAM-6"
    phase: "phase-2"
    role: "tenant_owner"
    goal: "mengintegrasikan login platform dengan SSO perusahaan (SAML 2.0 / OIDC)"
    benefit: "karyawan saya dapat login menggunakan akun korporat yang sudah ada, tanpa membuat akun baru"

  - id: "US-IAM-7"
    phase: "phase-2"
    role: "registered_customer"
    goal: "login tanpa password menggunakan Passkey/WebAuthn (fingerprint, face ID)"
    benefit: "saya dapat login dengan lebih cepat dan aman tanpa harus mengingat password"

  # ─── Pricing & Inventory Engine (Extended) ───
  - id: "US-PRC-4"
    phase: "phase-2"
    role: "operations_manager"
    goal: "mengaktifkan dynamic pricing otomatis — harga naik/turun berdasarkan % kursi yang sudah terisi"
    benefit: "saya dapat mengoptimalkan revenue berdasarkan supply-demand real-time tanpa intervensi manual"

  - id: "US-PRC-5"
    phase: "phase-2"
    role: "registered_customer"
    goal: "mendapatkan last-minute deal dengan harga lebih murah untuk kursi yang belum terjual"
    benefit: "saya dapat bepergian dengan harga murah jika fleksibel dengan waktu keberangkatan"

  - id: "US-PRC-6"
    phase: "phase-2"
    role: "corporate_booker"
    goal: "mendapatkan corporate rate khusus dan contract pricing yang telah dinegosiasikan"
    benefit: "perusahaan saya dapat menghemat biaya perjalanan bisnis secara signifikan"

  # ─── Promotions & Loyalty Engine (Extended) ───
  - id: "US-PROMO-3"
    phase: "phase-2"
    role: "marketing_staff"
    goal: "membuat flash sale dengan countdown timer untuk menciptakan urgensi pembelian"
    benefit: "saya dapat meningkatkan konversi penjualan dalam waktu singkat melalui urgency-driven marketing"

  - id: "US-PROMO-4"
    phase: "phase-2"
    role: "registered_customer"
    goal: "mengumpulkan loyalty points setiap kali melakukan booking dan menukarkannya dengan diskon"
    benefit: "saya mendapatkan reward atas kesetiaan saya menggunakan platform secara berkelanjutan"

  - id: "US-PROMO-5"
    phase: "phase-2"
    role: "registered_customer"
    goal: "mengajak teman melalui referral program dan mendapatkan reward saat teman berhasil booking"
    benefit: "saya bisa mendapatkan diskon atau cashback hanya dengan merekomendasikan platform ke teman"

  - id: "US-PROMO-6"
    phase: "phase-2"
    role: "marketing_staff"
    goal: "menjalankan cashback campaign — customer dapat cashback setelah menyelesaikan perjalanan"
    benefit: "saya dapat meningkatkan retensi dan repeat order melalui insentif cashback"

  # ─── Notifications & Communications (Extended) ───
  - id: "US-NTF-4"
    phase: "phase-2"
    role: "registered_customer"
    goal: "menerima push notification di browser/smartphone untuk update status booking real-time"
    benefit: "saya selalu mendapatkan informasi terbaru tanpa harus membuka email atau WhatsApp"

  - id: "US-NTF-5"
    phase: "phase-2"
    role: "registered_customer"
    goal: "berkomunikasi langsung dengan CS agent tenant melalui in-app chat"
    benefit: "saya dapat menyelesaikan masalah dengan cepat tanpa berpindah ke aplikasi chat lain"

  # ─── CRM & Customer Management (Extended) ───
  - id: "US-CRM-4"
    phase: "phase-2"
    role: "marketing_staff"
    goal: "melihat segmentasi customer berdasarkan frekuensi booking, value, dan rute favorit"
    benefit: "saya dapat menjalankan targeted marketing campaign yang lebih efektif dan personal"

  - id: "US-CRM-5"
    phase: "phase-2"
    role: "marketing_staff"
    goal: "melihat Customer Lifetime Value (CLV) untuk mengidentifikasi high-value customer"
    benefit: "saya dapat fokus pada retensi customer yang paling bernilai bagi bisnis"

  - id: "US-CRM-6"
    phase: "phase-2"
    role: "marketing_staff"
    goal: "menganalisis customer acquisition dan retention funnel"
    benefit: "saya dapat mengidentifikasi bottleneck dalam funnel dan meningkatkan ROI marketing"

  # ─── Analytics & Reporting (Extended) ───
  - id: "US-ANL-4"
    phase: "phase-2"
    role: "tenant_owner"
    goal: "menerima scheduled report via email secara harian, mingguan, atau bulanan"
    benefit: "saya tetap mendapatkan insight bisnis tanpa harus login ke dashboard setiap saat"

  # ─── Vendor & Partner Management (Extended) ───
  - id: "US-VND-3"
    phase: "phase-2"
    role: "operations_manager"
    goal: "memberikan akses vendor portal agar vendor dapat menginput jadwal, stok, dan harga sendiri"
    benefit: "saya dapat mengurangi beban operasional karena vendor mengelola produknya secara mandiri"

  - id: "US-VND-4"
    phase: "phase-2"
    role: "finance_staff"
    goal: "memproses disbursement otomatis ke rekening vendor setelah settlement"
    benefit: "saya dapat membayar komisi vendor tepat waktu tanpa proses manual, meningkatkan kepercayaan mitra"

  - id: "US-VND-5"
    phase: "phase-2"
    role: "operations_manager"
    goal: "melihat vendor performance rating dan review untuk quality control"
    benefit: "saya dapat mempertahankan vendor berkualitas dan mengeliminasi vendor yang buruk"

acceptance_criteria:
  # ─── Core Booking Engine (Extended) ───
  - story_id: "US-BKG-8"
    scenarios:
      - scenario: "Customer mencari penerbangan Jakarta-Singapura"
        given: "Customer berada di halaman pencarian dan memilih tab 'Penerbangan'"
        when: "Customer mengisi origin CGK, destination SIN, tanggal, dan pax lalu klik Search"
        then: "Sistem menampilkan daftar penerbangan dari GDS provider dengan maskapai, jadwal, dan harga"
      - scenario: "Customer berhasil booking penerbangan"
        given: "Customer telah memilih penerbangan"
        when: "Customer menyelesaikan checkout dan pembayaran"
        then: "Sistem membuat booking dengan PNR code dari GDS dan mengirim e-ticket penerbangan"

  - story_id: "US-BKG-9"
    scenarios:
      - scenario: "Customer mencari tiket kereta Jakarta-Surabaya"
        given: "Customer berada di halaman pencarian dan memilih tab 'Kereta Api'"
        when: "Customer mengisi stasiun asal Gambir, tujuan Pasar Turi, tanggal, dan pax"
        then: "Sistem menampilkan jadwal kereta dari KAI API dengan kelas dan harga"
      - scenario: "Customer berhasil booking tiket kereta"
        given: "Customer telah memilih jadwal kereta"
        when: "Customer menyelesaikan checkout dan pembayaran"
        then: "Sistem membuat booking dengan KAI booking reference dan mengirim e-ticket kereta"

  - story_id: "US-BKG-10"
    scenarios:
      - scenario: "Customer mendaftar waitlist untuk trip yang penuh"
        given: "Trip schedule Jakarta-Bandung tanggal tertentu sudah sold out"
        when: "Customer mengklik 'Join Waitlist' dan mengisi jumlah pax"
        then: "Customer masuk ke waitlist dengan status Waiting"
      - scenario: "Customer menerima notifikasi seat tersedia"
        given: "Ada pembatalan booking sehingga 2 kursi tersedia di trip yang di-waitlist"
        when: "Sistem mendeteksi kursi tersedia"
        then: "Customer pertama di waitlist menerima notifikasi WhatsApp/email dan punya waktu 2 jam untuk booking"

  # ─── Payment & Financial Engine (Extended) ───
  - story_id: "US-PAY-8"
    scenarios:
      - scenario: "Customer membuat split payment untuk group booking"
        given: "Customer baru saja membuat group booking untuk 4 orang senilai Rp 2.000.000"
        when: "Customer memilih opsi Split Payment dan memasukkan email 3 teman lainnya (masing-masing Rp 500.000)"
        then: "Sistem membuat split payment links dan mengirim email ke masing-masing teman untuk membayar bagiannya"
      - scenario: "Semua share split payment terbayar"
        given: "Split payment dengan 3 dari 4 share sudah dibayar"
        when: "Pembayar ke-4 menyelesaikan pembayaran"
        then: "Status split payment berubah menjadi Fully_Paid dan booking dilanjutkan ke proses normal"

  - story_id: "US-PAY-9"
    scenarios:
      - scenario: "Customer memilih Paylater saat checkout"
        given: "Customer berada di halaman pembayaran dengan total Rp 1.500.000"
        when: "Customer memilih metode Paylater (Kredivo) dan menyelesaikan proses persetujuan"
        then: "Booking dikonfirmasi dan customer mendapat jadwal cicilan dari provider BNPL"

  - story_id: "US-PAY-10"
    scenarios:
      - scenario: "Corporate booker memesan dengan corporate invoice"
        given: "Corporate booker login dengan akun korporat yang memiliki corporate account aktif"
        when: "Corporate booker menyelesaikan booking dan memilih metode 'Corporate Invoice'"
        then: "Booking dibuat dengan corporate invoice Net 30, due date 30 hari ke depan, tanpa pembayaran di muka"

  # ─── Fleet & Driver Management (Extended) ───
  - story_id: "US-FLT-6"
    scenarios:
      - scenario: "Fleet Supervisor melihat posisi armada di peta"
        given: "Fleet Supervisor login ke dashboard fleet tracking"
        when: "Fleet Supervisor membuka halaman Live Tracking"
        then: "Sistem menampilkan peta dengan posisi real-time semua kendaraan aktif beserta info kecepatan dan arah"

  - story_id: "US-FLT-7"
    scenarios:
      - scenario: "Sistem mengirim geofence alert"
        given: "Kendaraan A di-assign ke rute Jakarta-Bandung dengan geofence zone terdefinisi"
        when: "Kendaraan A keluar dari polygon geofence yang ditentukan"
        then: "Fleet Supervisor menerima alert real-time dan sistem mencatat geofence alert"

  - story_id: "US-FLT-8"
    scenarios:
      - scenario: "Operations Manager melihat driver scorecard bulanan"
        given: "Operations Manager login ke dashboard driver management"
        when: "Operations Manager membuka halaman Driver Scorecard untuk bulan ini"
        then: "Sistem menampilkan skor setiap driver: on-time %, avg rating, total trips, incidents, dan overall score"

  - story_id: "US-FLT-9"
    scenarios:
      - scenario: "Fleet Supervisor melihat laporan utilisasi armada"
        given: "Fleet Supervisor login ke dashboard"
        when: "Fleet Supervisor membuka laporan utilisasi armada untuk kuartal terakhir"
        then: "Sistem menampilkan % aktif vs idle setiap kendaraan dan rata-rata utilisasi armada"

  # ─── Tour Package & Itinerary Management (Extended) ───
  - story_id: "US-TOUR-5"
    scenarios:
      - scenario: "Customer mengajukan tailor-made quotation"
        given: "Customer berada di halaman paket wisata"
        when: "Customer mengklik 'Request Custom Package', mengisi preferensi (destinasi, budget, durasi, minat khusus)"
        then: "Permintaan tersimpan dan marketing staff tenant menerima notifikasi untuk membuatkan quotation"

  - story_id: "US-TOUR-6"
    scenarios:
      - scenario: "Marketing Staff mengkloning paket wisata"
        given: "Marketing Staff login dan melihat paket wisata 'Trip Bali 3 Hari' yang sudah ada"
        when: "Marketing Staff mengklik 'Clone', mengubah nama menjadi 'Trip Bali 5 Hari', dan menyesuaikan itinerary"
        then: "Paket baru tersimpan sebagai Draft tanpa mempengaruhi paket asli"

  # ─── Vehicle Rental Management (Extended) ───
  - story_id: "US-RNT-5"
    scenarios:
      - scenario: "Sistem menghitung overtime fee otomatis"
        given: "Kendaraan rental seharusnya dikembalikan pukul 12:00"
        when: "Kendaraan dikembalikan pukul 15:00 (terlambat 3 jam)"
        then: "Sistem otomatis menghitung biaya overtime sesuai tarif per jam dan menambahkannya ke tagihan"

  - story_id: "US-RNT-6"
    scenarios:
      - scenario: "Operations Manager memasukkan customer ke blacklist"
        given: "Customer X tercatat 3 kali terlambat mengembalikan kendaraan dan 1 kali menyebabkan kerusakan"
        when: "Operations Manager membuka profil customer dan mengklik 'Add to Blacklist' dengan alasan"
        then: "Customer X tidak dapat membuat booking rental baru, dan CS Agent mendapat peringatan jika customer mencoba"

  - story_id: "US-RNT-7"
    scenarios:
      - scenario: "Fleet Supervisor melacak kendaraan rental"
        given: "Kendaraan Y sedang disewa oleh customer"
        when: "Fleet Supervisor membuka dashboard GPS dan memilih kendaraan Y"
        then: "Sistem menampilkan posisi terkini dan riwayat pergerakan kendaraan Y selama periode rental"

  # ─── Airport Transfer & Shuttle Management (Extended) ───
  - story_id: "US-XFER-4"
    scenarios:
      - scenario: "Sistem auto-adjust waktu jemput karena flight delay"
        given: "Customer memesan transfer bandara arrival dengan nomor penerbangan GA123"
        when: "Flight status API melaporkan GA123 delay 45 menit"
        then: "Sistem otomatis menggeser waktu jemput 45 menit dan mengirim notifikasi ke customer dan driver"

  - story_id: "US-XFER-5"
    scenarios:
      - scenario: "Customer memesan shuttle on-demand"
        given: "Customer berada di lokasi tertentu dan butuh shuttle segera"
        when: "Customer membuka aplikasi, memilih 'Shuttle On-Demand', dan request pickup"
        then: "Sistem mencari driver terdekat yang tersedia dan meng-assign secara real-time"

  - story_id: "US-XFER-6"
    scenarios:
      - scenario: "Sistem auto-assign driver ke transfer"
        given: "Booking transfer bandara baru dibuat untuk 2 jam lagi"
        when: "Sistem auto-dispatch berjalan"
        then: "Sistem memilih driver yang: (1) tersedia di jam tersebut, (2) lokasi terdekat dengan pickup point, dan meng-assign otomatis"

  - story_id: "US-XFER-7"
    scenarios:
      - scenario: "Passenger menerima live tracking link"
        given: "Driver sudah di-assign dan sedang menuju pickup point"
        when: "Sistem mengirim notifikasi ke passenger"
        then: "Passenger menerima link yang menampilkan peta dengan posisi real-time kendaraan dan estimasi waktu tiba"

  # ─── Hotel & Accommodation Management (Extended) ───
  - story_id: "US-HTL-4"
    scenarios:
      - scenario: "Operations Manager mengintegrasikan channel manager"
        given: "Operations Manager login ke dashboard hotel"
        when: "Operations Manager mengkonfigurasi koneksi ke channel manager (Siteminder) dan memetakan tipe kamar"
        then: "Inventori dan harga kamar tersinkronisasi dua arah antara platform dan OTA eksternal"

  # ─── Tenant & Multi-Tenancy Management (Extended) ───
  - story_id: "US-TNT-5"
    scenarios:
      - scenario: "Tenant Owner membuat cabang baru"
        given: "Tenant Owner login ke dashboard tenant management"
        when: "Tenant Owner membuat cabang 'NusaTravel Cabang Bandung' dengan alamat dan kode cabang"
        then: "Cabang dibuat dan tenant owner dapat meng-assign user ke cabang tersebut dengan role terbatas"

  - story_id: "US-TNT-6"
    scenarios:
      - scenario: "SaaS Support Agent impersonate tenant"
        given: "Tenant melaporkan masalah pada dashboard mereka"
        when: "SaaS Support Agent membuka halaman tenant dan mengklik 'Impersonate (Read-Only)'"
        then: "Support Agent melihat dashboard persis seperti tenant owner, tetapi tidak bisa melakukan perubahan apa pun"

  # ─── Identity, Access & Security (Extended) ───
  - story_id: "US-IAM-6"
    scenarios:
      - scenario: "Tenant Owner mengkonfigurasi SSO SAML"
        given: "Tenant Owner login ke pengaturan keamanan"
        when: "Tenant Owner mengisi metadata SAML dari Azure AD dan mengaktifkan SSO"
        then: "Semua user tenant dapat login menggunakan akun Azure AD perusahaan"

  - story_id: "US-IAM-7"
    scenarios:
      - scenario: "Customer mendaftarkan Passkey"
        given: "Customer login ke pengaturan keamanan"
        when: "Customer mengklik 'Register Passkey' dan menyelesaikan verifikasi fingerprint/Face ID"
        then: "Passkey tersimpan dan customer dapat login berikutnya hanya dengan fingerprint/Face ID tanpa password"

  # ─── Pricing & Inventory Engine (Extended) ───
  - story_id: "US-PRC-4"
    scenarios:
      - scenario: "Dynamic pricing menaikkan harga saat kursi hampir penuh"
        given: "Trip schedule memiliki 50 kursi dan sudah terisi 45 (90%)"
        when: "Customer mencari tiket untuk trip tersebut"
        then: "Harga yang ditampilkan 25% lebih tinggi dari harga dasar sesuai aturan dynamic pricing"
      - scenario: "Dynamic pricing menurunkan harga saat kursi masih kosong"
        given: "Trip schedule H-3 masih memiliki 40 dari 50 kursi kosong"
        when: "Customer mencari tiket"
        then: "Harga yang ditampilkan 10% lebih rendah dari harga dasar untuk mendorong pemesanan"

  - story_id: "US-PRC-5"
    scenarios:
      - scenario: "Customer melihat last-minute deal"
        given: "Ada trip schedule besok pagi dengan 20 kursi masih kosong"
        when: "Customer membuka halaman 'Last Minute Deals'"
        then: "Sistem menampilkan trip tersebut dengan label diskon 40% dan countdown waktu keberangkatan"

  - story_id: "US-PRC-6"
    scenarios:
      - scenario: "Corporate booker mendapat harga khusus"
        given: "Corporate booker dari PT ABC login (corporate account dengan diskon 15%)"
        when: "Corporate booker mencari tiket"
        then: "Harga yang ditampilkan sudah termasuk diskon 15% sesuai contract pricing"

  # ─── Promotions & Loyalty Engine (Extended) ───
  - story_id: "US-PROMO-3"
    scenarios:
      - scenario: "Marketing Staff membuat flash sale"
        given: "Marketing Staff login ke dashboard promosi"
        when: "Marketing Staff membuat flash sale 'Flash Sale Friday' — diskon 50%, max 100 redemption, durasi 2 jam"
        then: "Flash sale tampil di halaman utama dengan countdown timer real-time"
      - scenario: "Flash sale berakhir karena kuota habis"
        given: "Flash sale aktif dengan 100 kuota"
        when: "Redemption ke-100 terjadi"
        then: "Flash sale otomatis berakhir meskipun countdown belum selesai, dan label 'Sold Out' ditampilkan"

  - story_id: "US-PROMO-4"
    scenarios:
      - scenario: "Customer mendapatkan loyalty points setelah booking selesai"
        given: "Customer menyelesaikan perjalanan (trip status Completed)"
        when: "Sistem memproses pemberian poin"
        then: "Customer mendapat 500 poin (1 poin per Rp 2.000 transaksi) yang tercatat di loyalty account"
      - scenario: "Customer menukarkan loyalty points"
        given: "Customer memiliki 5.000 poin (setara Rp 50.000)"
        when: "Customer checkout dan memilih 'Redeem 5.000 points'"
        then: "Total pembayaran berkurang Rp 50.000 dan poin customer berkurang 5.000"

  - story_id: "US-PROMO-5"
    scenarios:
      - scenario: "Customer mengirim referral link ke teman"
        given: "Customer login dan membuka halaman Referral"
        when: "Customer membagikan referral link unik ke teman via WhatsApp"
        then: "Teman menerima link dengan kode referral customer"
      - scenario: "Referrer dan referred mendapat reward"
        given: "Teman mendaftar via referral link dan menyelesaikan booking pertama"
        when: "Booking pertama referred terkonfirmasi"
        then: "Referrer mendapat voucher Rp 50.000 dan referred mendapat voucher Rp 25.000"

  - story_id: "US-PROMO-6"
    scenarios:
      - scenario: "Marketing Staff membuat cashback campaign"
        given: "Marketing Staff login ke dashboard promosi"
        when: "Marketing Staff membuat campaign 'Cashback 10% untuk semua booking ke Bali bulan ini'"
        then: "Setiap booking ke Bali yang selesai di bulan ini otomatis mendapat cashback 10% ke saldo/voucher"

  # ─── Notifications & Communications (Extended) ───
  - story_id: "US-NTF-4"
    scenarios:
      - scenario: "Customer menerima push notification booking confirmed"
        given: "Customer telah mengaktifkan push notification di browser"
        when: "Booking customer berubah status menjadi Confirmed"
        then: "Customer menerima push notification 'Booking #ABC123 telah dikonfirmasi!' bahkan saat tidak membuka platform"

  - story_id: "US-NTF-5"
    scenarios:
      - scenario: "Customer chat dengan CS Agent"
        given: "Customer memiliki pertanyaan tentang booking"
        when: "Customer membuka halaman booking dan mengklik 'Chat with CS'"
        then: "In-app chat terbuka, customer bisa mengirim pesan, dan CS Agent tenant menerima notifikasi"
      - scenario: "CS Agent membalas chat customer"
        given: "CS Agent menerima pesan dari customer"
        when: "CS Agent membalas pesan melalui dashboard CS"
        then: "Customer menerima balasan secara real-time di halaman booking"

  # ─── CRM & Customer Management (Extended) ───
  - story_id: "US-CRM-4"
    scenarios:
      - scenario: "Marketing Staff melihat segmentasi customer"
        given: "Marketing Staff login ke dashboard CRM"
        when: "Marketing Staff membuka halaman Customer Segments"
        then: "Sistem menampilkan segmen: Frequent Traveler (>5 booking/bulan), High Value (>Rp 10jt/bulan), rute favorit, dll"

  - story_id: "US-CRM-5"
    scenarios:
      - scenario: "Marketing Staff melihat CLV report"
        given: "Marketing Staff login ke dashboard CRM"
        when: "Marketing Staff membuka halaman Customer Lifetime Value"
        then: "Sistem menampilkan daftar customer dengan CLV tertinggi, rata-rata order value, dan frekuensi booking"

  - story_id: "US-CRM-6"
    scenarios:
      - scenario: "Marketing Staff menganalisis funnel"
        given: "Marketing Staff login ke dashboard analytics"
        when: "Marketing Staff membuka halaman Acquisition & Retention Funnel"
        then: "Sistem menampilkan funnel: Visitor -> Registered -> First Booking -> Repeat Booking, dengan conversion rate di setiap tahap"

  # ─── Analytics & Reporting (Extended) ───
  - story_id: "US-ANL-4"
    scenarios:
      - scenario: "Tenant Owner menerima scheduled report mingguan"
        given: "Tenant Owner telah mengkonfigurasi scheduled report setiap Senin pagi"
        when: "Sistem scheduler berjalan pada hari Senin pukul 07:00"
        then: "Tenant Owner menerima email berisi PDF laporan penjualan, revenue, dan occupancy minggu sebelumnya"

  # ─── Vendor & Partner Management (Extended) ───
  - story_id: "US-VND-3"
    scenarios:
      - scenario: "Vendor login ke vendor portal"
        given: "Vendor telah diberikan akses portal oleh operations manager"
        when: "Vendor login ke vendor portal"
        then: "Vendor melihat dashboard khusus yang menampilkan produk mereka, bisa update jadwal, stok, dan harga"
      - scenario: "Vendor menambah jadwal baru"
        given: "Vendor login ke vendor portal"
        when: "Vendor menambahkan jadwal keberangkatan baru untuk produk mereka"
        then: "Jadwal baru langsung tersedia di platform tenant untuk dijual"

  - story_id: "US-VND-4"
    scenarios:
      - scenario: "Sistem memproses disbursement otomatis"
        given: "Periode settlement mingguan telah berakhir"
        when: "Sistem disbursement scheduler berjalan"
        then: "Sistem menghitung total komisi setiap vendor, membuat disbursement, dan mengirim ke payment gateway untuk transfer ke rekening vendor"

  - story_id: "US-VND-5"
    scenarios:
      - scenario: "Operations Manager melihat vendor rating"
        given: "Operations Manager login ke dashboard vendor"
        when: "Operations Manager membuka halaman Vendor Performance"
        then: "Sistem menampilkan rating setiap vendor berdasarkan: ketepatan waktu, kualitas layanan, review customer, dan response rate"
