phase: "phase-1"
phase_name: "MVP"

security_notes:
  - "Setiap entity dengan tenant_id WAJIB menggunakan TypeORM Subscriber atau Global Interceptor untuk inject klausa WHERE tenant_id = X pada setiap query. Ini menjamin data isolation antar tenant."
  - "Gunakan ULID (varchar(26)) sebagai primary key di semua tabel untuk mencegah enumerasi ID dan memudahkan distributed system di masa depan."
  - "Password user di-hash dengan bcrypt/argon2. Jangan pernah simpan plaintext."
  - "AuditLog bersifat append-only & immutable — gunakan trigger/Subscriber untuk mencegah UPDATE/DELETE."
  - "PaymentTransaction.raw_webhook_payload disimpan sebagai JSONB untuk audit trail lengkap dari gateway."
  - "Semua kolom bertipe timestamp menggunakan TIMESTAMPTZ (UTC) untuk konsistensi lintas zona waktu."

