  # ──────────────────────────────────────────────────────────────────────────

  - entity_name: "AuditLog"
    table_name: "audit_logs"
    is_isolated: false  # Global — mencakup semua tenant
    description: "Log audit immutable untuk semua aksi user. Append-only."
    columns:
      - name: "id"
        type: "varchar"
        length: 26
        is_primary: true
        comment: "ULID format"
      - name: "user_id"
        type: "varchar"
        length: 26
        is_nullable: false
      - name: "tenant_id"
        type: "varchar"
        length: 26
        is_nullable: true
        comment: "NULL untuk aksi SaaS-level"
      - name: "action"
        type: "varchar"
        length: 50
        is_nullable: false
        comment: "e.g., 'booking.create', 'user.login', 'payment.confirm'"
      - name: "resource_type"
        type: "varchar"
        length: 50
        is_nullable: false
        comment: "e.g., 'Booking', 'User', 'PaymentIntent'"
      - name: "resource_id"
        type: "varchar"
        length: 26
        is_nullable: false
      - name: "old_values"
        type: "jsonb"
        is_nullable: true
      - name: "new_values"
        type: "jsonb"
        is_nullable: true
      - name: "ip_address"
        type: "varchar"
        length: 45
        is_nullable: true
      - name: "user_agent"
        type: "varchar"
        length: 500
        is_nullable: true
      - name: "created_at"
        type: "timestamptz"
        is_nullable: false
        default: "NOW()"
    relations:
      - type: "ManyToOne"
        target_entity: "User"
        join_column: "user_id"
        inverse_side: "audit_logs"
        on_delete: "RESTRICT"
      - type: "ManyToOne"
        target_entity: "Tenant"
        join_column: "tenant_id"
        inverse_side: "audit_logs"
        on_delete: "SET NULL"

