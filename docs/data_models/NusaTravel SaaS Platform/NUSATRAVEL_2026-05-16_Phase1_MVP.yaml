      - name: "tenant_id"
        type: "varchar"
        length: 26
        is_nullable: false
      - name: "booking_id"
        type: "varchar"
        length: 26
        is_nullable: false
      - name: "user_id"
        type: "varchar"
        length: 26
        is_nullable: false
      - name: "rating"
        type: "int"
        is_nullable: false
        comment: "1-5"
      - name: "comment"
        type: "text"
        is_nullable: true
      - name: "status"
        type: "varchar"
        length: 20
        is_nullable: false
        default: "pending"
        comment: "pending | approved | rejected"
      - name: "moderated_by"
        type: "varchar"
        length: 26
        is_nullable: true
      - name: "moderated_at"
        type: "timestamptz"
        is_nullable: true
      - name: "tenant_response"
        type: "text"
        is_nullable: true
        comment: "Balasan dari tenant terhadap review"
      - name: "tenant_responded_at"
        type: "timestamptz"
        is_nullable: true
      - name: "created_at"
        type: "timestamptz"
        is_nullable: false
        default: "NOW()"
    relations:
      - type: "ManyToOne"
        target_entity: "Tenant"
        join_column: "tenant_id"
        inverse_side: "reviews"
        on_delete: "CASCADE"
      - type: "ManyToOne"
        target_entity: "Booking"
        join_column: "booking_id"
        inverse_side: "reviews"
        on_delete: "CASCADE"
      - type: "ManyToOne"
        target_entity: "User"
        join_column: "user_id"
        inverse_side: "reviews_written"
        on_delete: "CASCADE"

  - entity_name: "Complaint"
    table_name: "complaints"
    is_isolated: true
    description: "Sistem tiket komplain dan dispute."
    columns:
      - name: "id"
        type: "varchar"
        length: 26
        is_primary: true
        comment: "ULID format"
      - name: "tenant_id"
        type: "varchar"
        length: 26
        is_nullable: false
      - name: "booking_id"
        type: "varchar"
        length: 26
        is_nullable: true
      - name: "user_id"
        type: "varchar"
        length: 26
        is_nullable: false
        comment: "Customer yang komplain"
      - name: "ticket_number"
        type: "varchar"
        length: 20
        is_unique: true
        is_nullable: false
        comment: "e.g., 'CMP-2405001'"
      - name: "subject"
        type: "varchar"
        length: 300
        is_nullable: false
      - name: "description"
        type: "text"
        is_nullable: false
      - name: "category"
        type: "varchar"
        length: 30
        is_nullable: false
        comment: "service | refund | baggage | delay | safety | other"
      - name: "priority"
        type: "varchar"
        length: 10
        is_nullable: false
        default: "medium"
        comment: "low | medium | high | urgent"
      - name: "status"
        type: "varchar"
        length: 20
        is_nullable: false
        default: "open"
        comment: "open | in_progress | waiting_customer | resolved | closed"
      - name: "assigned_to"
        type: "varchar"
        length: 26
        is_nullable: true
        comment: "FK ke User (CS Agent yang menangani)"
      - name: "resolved_at"
        type: "timestamptz"
        is_nullable: true
      - name: "created_at"
        type: "timestamptz"
        is_nullable: false
        default: "NOW()"
      - name: "updated_at"
        type: "timestamptz"
        is_nullable: false
        default: "NOW()"
    relations:
      - type: "ManyToOne"
        target_entity: "Tenant"
        join_column: "tenant_id"
        inverse_side: "complaints"
        on_delete: "CASCADE"
      - type: "ManyToOne"
        target_entity: "Booking"
        join_column: "booking_id"
        inverse_side: "complaints"
        on_delete: "SET NULL"
      - type: "ManyToOne"
        target_entity: "User"
        join_column: "user_id"
        inverse_side: "complaints_filed"
        on_delete: "CASCADE"
      - type: "ManyToOne"
        target_entity: "User"
        join_column: "assigned_to"
        inverse_side: "complaints_assigned"
        on_delete: "SET NULL"
      - type: "OneToMany"
        target_entity: "ComplaintResponse"
        inverse_side: "complaint"
        on_delete: "CASCADE"

  - entity_name: "ComplaintResponse"
    table_name: "complaint_responses"
    is_isolated: true
    description: "Respons/tanggapan dalam tiket komplain."
    columns:
      - name: "id"
        type: "varchar"
        length: 26
        is_primary: true
        comment: "ULID format"
      - name: "complaint_id"
        type: "varchar"
        length: 26
        is_nullable: false
      - name: "responder_id"
        type: "varchar"
        length: 26
        is_nullable: false
        comment: "FK ke User (CS Agent atau Customer)"
      - name: "message"
        type: "text"
        is_nullable: false
      - name: "is_internal_note"
        type: "boolean"
        is_nullable: false
        default: false
        comment: "true = hanya visible ke internal CS, false = visible ke customer"
      - name: "created_at"
        type: "timestamptz"
        is_nullable: false
        default: "NOW()"
    relations:
      - type: "ManyToOne"
        target_entity: "Complaint"
        join_column: "complaint_id"
        inverse_side: "responses"
        on_delete: "CASCADE"
      - type: "ManyToOne"
        target_entity: "User"
        join_column: "responder_id"
        inverse_side: "complaint_responses"
        on_delete: "CASCADE"

