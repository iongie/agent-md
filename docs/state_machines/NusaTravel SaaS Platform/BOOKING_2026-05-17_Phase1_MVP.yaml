  # TENANT KYB STATE MACHINE
  # ═══════════════════════════════════════════════════════════════════════════
  - module_name: "TenantKybStateMachineModule"
    description: >
      Mengelola transisi status verifikasi KYB Tenant:
      Pending -> Approved (verifikasi dokumen oleh Super Admin)
      Pending -> Rejected (dokumen tidak memenuhi syarat)
      Rejected -> Pending (tenant mengunggah ulang dokumen)
    files:
      - file_path: "src/modules/tenant/tenant-kyb-state-machine.module.ts"
        code: |
          import { Module } from '@nestjs/common';
          import { TypeOrmModule } from '@nestjs/typeorm';
          import { TenantKybStateMachineService } from './tenant-kyb-state-machine.service';
          import { TenantKybStateMachineController } from './tenant-kyb-state-machine.controller';
          import { Tenant } from './entities/tenant.entity';
          import { IamModule } from '../iam/iam.module';
          import { NotificationModule } from '../notification/notification.module';
          import { AuditModule } from '../audit/audit.module';

          @Module({
            imports: [
              TypeOrmModule.forFeature([Tenant]),
              IamModule,
              NotificationModule,
              AuditModule,
            ],
            controllers: [TenantKybStateMachineController],
            providers: [TenantKybStateMachineService],
            exports: [TenantKybStateMachineService],
          })
          export class TenantKybStateMachineModule {}

      - file_path: "src/modules/tenant/tenant-kyb-state-machine.service.ts"
        code: |
          import {
            Injectable,
            BadRequestException,
            NotFoundException,
          } from '@nestjs/common';
          import { InjectRepository } from '@nestjs/typeorm';
          import { Repository } from 'typeorm';
          import { Tenant, KybStatus } from './entities/tenant.entity';
          import { NotificationService } from '../notification/notification.service';
          import { AuditService } from '../audit/audit.service';

          /**
           * Tenant KYB State Machine.
           *
           * Valid transitions:
           *   Pending ──┬──> Approved  (verifikasi dokumen oleh Super Admin)
           *             └──> Rejected  (dokumen tidak memenuhi syarat)
           *   Rejected ────> Pending   (tenant mengunggah ulang dokumen)
           */
          @Injectable()
          export class TenantKybStateMachineService {
            private readonly VALID_TRANSITIONS: Record<KybStatus, KybStatus[]> = {
              [KybStatus.PENDING]: [
                KybStatus.APPROVED,
                KybStatus.REJECTED,
              ],
              [KybStatus.APPROVED]: [],
              [KybStatus.REJECTED]: [
                KybStatus.PENDING,
              ],
            };

            constructor(
              @InjectRepository(Tenant)
              private readonly tenantRepo: Repository<Tenant>,
              private readonly notificationService: NotificationService,
              private readonly auditService: AuditService,
            ) {}

            private validateTransition(
              currentStatus: KybStatus,
              targetStatus: KybStatus,
            ): void {
              const allowed = this.VALID_TRANSITIONS[currentStatus];
              if (!allowed || !allowed.includes(targetStatus)) {
                throw new BadRequestException(
                  `Transisi KYB tidak valid: ${currentStatus} -> ${targetStatus}`,
                );
              }
            }

            private async findTenantOrFail(tenantId: string): Promise<Tenant> {
              const tenant = await this.tenantRepo.findOne({
                where: { id: tenantId },
              });
              if (!tenant) {
                throw new NotFoundException(`Tenant ${tenantId} tidak ditemukan`);
              }
              return tenant;
            }

            // ──────────────────────────────────────────────────────────────
            // TRANSISI: Pending -> Approved
            // ──────────────────────────────────────────────────────────────

            /**
             * Approve KYB tenant — Pending -> Approved.
             * Hanya Super Admin yang bisa melakukan ini.
             *
             * Side effects:
             * - Status KYB -> Approved
             * - Tenant bisa mulai menggunakan platform
             * - Notifikasi ke tenant owner
             */
            async approveKyb(
              tenantId: string,
              approvedBy: string,
              notes?: string,
            ): Promise<Tenant> {
              const tenant = await this.findTenantOrFail(tenantId);
              this.validateTransition(tenant.kybStatus, KybStatus.APPROVED);

              tenant.kybStatus = KybStatus.APPROVED;
              tenant.kybApprovedBy = approvedBy;
              tenant.kybApprovedAt = new Date();
              tenant.kybNotes = notes;
              await this.tenantRepo.save(tenant);

              await this.notificationService.sendKybApprovedNotification(tenant);

              await this.auditService.log({
                userId: approvedBy,
                tenantId: null, // SaaS-level action
                action: 'tenant.kyb_approved',
                resourceType: 'Tenant',
                resourceId: tenant.id,
                newValues: {
                  kybStatus: KybStatus.APPROVED,
                  notes,
                },
              });

              return tenant;
            }

            // ──────────────────────────────────────────────────────────────
            // TRANSISI: Pending -> Rejected
            // ──────────────────────────────────────────────────────────────

            /**
             * Tolak KYB tenant — Pending -> Rejected.
             * Harus menyertakan alasan penolakan agar tenant bisa memperbaiki.
             */
            async rejectKyb(
              tenantId: string,
              rejectedBy: string,
              rejectionReason: string,
            ): Promise<Tenant> {
              const tenant = await this.findTenantOrFail(tenantId);
              this.validateTransition(tenant.kybStatus, KybStatus.REJECTED);

              if (!rejectionReason || rejectionReason.trim().length === 0) {
                throw new BadRequestException(
                  'Alasan penolakan KYB wajib diisi',
                );
              }

              tenant.kybStatus = KybStatus.REJECTED;
              tenant.kybRejectedBy = rejectedBy;
              tenant.kybRejectedAt = new Date();
              tenant.kybRejectionReason = rejectionReason;
              await this.tenantRepo.save(tenant);

              await this.notificationService.sendKybRejectedNotification(tenant);

              await this.auditService.log({
                userId: rejectedBy,
                tenantId: null,
                action: 'tenant.kyb_rejected',
                resourceType: 'Tenant',
                resourceId: tenant.id,
                newValues: {
                  kybStatus: KybStatus.REJECTED,
                  rejectionReason,
                },
              });

              return tenant;
            }

            // ──────────────────────────────────────────────────────────────
            // TRANSISI: Rejected -> Pending (Resubmit)
            // ──────────────────────────────────────────────────────────────

            /**
             * Tenant mengunggah ulang dokumen KYB — Rejected -> Pending.
             * Dipanggil oleh tenant owner setelah memperbaiki dokumen.
             */
            async resubmitKyb(tenantId: string): Promise<Tenant> {
              const tenant = await this.findTenantOrFail(tenantId);
              this.validateTransition(tenant.kybStatus, KybStatus.PENDING);

              tenant.kybStatus = KybStatus.PENDING;
              tenant.kybResubmittedAt = new Date();
              // Clear rejection data
              tenant.kybRejectionReason = null;
              await this.tenantRepo.save(tenant);

              await this.notificationService.sendKybResubmittedNotification(tenant);

              await this.auditService.log({
                userId: tenant.ownerUserId || 'system',
                tenantId: tenant.id,
                action: 'tenant.kyb_resubmitted',
                resourceType: 'Tenant',
                resourceId: tenant.id,
                newValues: { kybStatus: KybStatus.PENDING },
              });

              return tenant;
            }
          }

      - file_path: "src/modules/tenant/tenant-kyb-state-machine.controller.ts"
        code: |
          import {
            Controller,
            Post,
            Param,
            Body,
            HttpCode,
            HttpStatus,
          } from '@nestjs/common';
          import { TenantKybStateMachineService } from './tenant-kyb-state-machine.service';
