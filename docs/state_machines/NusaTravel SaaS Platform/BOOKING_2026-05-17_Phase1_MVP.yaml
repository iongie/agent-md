architecture_overview: >
  Implementasi state machine untuk NusaTravel SaaS Platform Phase 1 MVP.
  Mencakup 6 workflow: Booking Lifecycle, Payment Intent Lifecycle, Refund Lifecycle,
  Tenant KYB Lifecycle, Tenant Subscription Lifecycle, dan Vehicle Lifecycle.
  Setiap state machine diimplementasikan sebagai dedicated Service method dengan
  validasi ketat: current state diperiksa sebelum transisi diizinkan.
  Multi-tenancy dijamin melalui TenantContextService dan filter tenant_id di setiap query.
  RBAC ditegakkan di Controller layer menggunakan @RequirePermissions decorator
  dari IamModule.

modules:
  # ═══════════════════════════════════════════════════════════════════════════
  # BOOKING STATE MACHINE
  # ═══════════════════════════════════════════════════════════════════════════
  - module_name: "BookingStateMachineModule"
    description: >
      Mengelola seluruh transisi status Booking Lifecycle:
      Draft -> DP_Paid -> Confirmed
      Draft -> Confirmed (full payment)
      DP_Paid -> Auto_Cancelled (deadline lewat)
      Draft -> Cancelled
      DP_Paid -> Cancelled
      Confirmed -> Cancelled
    files:
      - file_path: "src/modules/booking/booking-state-machine.module.ts"
        code: |
          import { Module } from '@nestjs/common';
          import { TypeOrmModule } from '@nestjs/typeorm';
          import { BookingStateMachineService } from './booking-state-machine.service';
          import { BookingStateMachineController } from './booking-state-machine.controller';
          import { Booking } from './entities/booking.entity';
          import { BookingItem } from './entities/booking-item.entity';
          import { Passenger } from './entities/passenger.entity';
          import { TripSchedule } from '../trip/entities/trip-schedule.entity';
          import { IamModule } from '../iam/iam.module';
          import { NotificationModule } from '../notification/notification.module';
          import { AuditModule } from '../audit/audit.module';

          @Module({
            imports: [
              TypeOrmModule.forFeature([
                Booking,
                BookingItem,
                Passenger,
                TripSchedule,
              ]),
              IamModule,
              NotificationModule,
              AuditModule,
            ],
            controllers: [BookingStateMachineController],
            providers: [BookingStateMachineService],
            exports: [BookingStateMachineService],
          })
          export class BookingStateMachineModule {}

      - file_path: "src/modules/booking/booking-state-machine.service.ts"
        code: |
          import {
            Injectable,
            BadRequestException,
            NotFoundException,
            ForbiddenException,
          } from '@nestjs/common';
          import { InjectRepository } from '@nestjs/typeorm';
          import { Repository, DataSource } from 'typeorm';
          import { Booking, BookingStatus } from './entities/booking.entity';
          import { BookingItem } from './entities/booking-item.entity';
          import { Passenger } from './entities/passenger.entity';
          import { TripSchedule, TripStatus } from '../trip/entities/trip-schedule.entity';
          import { TenantContextService } from '../iam/services/tenant-context.service';
          import { NotificationService } from '../notification/notification.service';
          import { AuditService } from '../audit/audit.service';
          import { ulid } from 'ulid';

          /**
           * Booking State Machine — mengelola seluruh transisi status Booking.
           *
           * Valid transitions:
           *   Draft ──┬──> DP_Paid       (DP dibayar)
           *           ├──> Confirmed      (full payment langsung lunas)
           *           └──> Cancelled      (batal sebelum bayar)
           *   DP_Paid ──┬──> Confirmed    (pelunasan diterima)
           *             ├──> Auto_Cancelled (deadline pelunasan lewat)
           *             └──> Cancelled     (batal dengan refund)
           *   Confirmed ───> Cancelled     (batal dengan refund)
           */
          @Injectable()
          export class BookingStateMachineService {
            private readonly VALID_TRANSITIONS: Record<BookingStatus, BookingStatus[]> = {
              [BookingStatus.DRAFT]: [
                BookingStatus.DP_PAID,
                BookingStatus.CONFIRMED,
                BookingStatus.CANCELLED,
              ],
              [BookingStatus.DP_PAID]: [
                BookingStatus.CONFIRMED,
                BookingStatus.AUTO_CANCELLED,
                BookingStatus.CANCELLED,
              ],
              [BookingStatus.CONFIRMED]: [
                BookingStatus.CANCELLED,
              ],
              [BookingStatus.CANCELLED]: [],
              [BookingStatus.AUTO_CANCELLED]: [],
            };

            constructor(
              @InjectRepository(Booking)
              private readonly bookingRepo: Repository<Booking>,
              @InjectRepository(BookingItem)
              private readonly bookingItemRepo: Repository<BookingItem>,
              @InjectRepository(Passenger)
              private readonly passengerRepo: Repository<Passenger>,
              @InjectRepository(TripSchedule)
              private readonly tripScheduleRepo: Repository<TripSchedule>,
              private readonly tenantContext: TenantContextService,
              private readonly notificationService: NotificationService,
              private readonly auditService: AuditService,
              private readonly dataSource: DataSource,
            ) {}

            /**
             * Validasi transisi status — throw jika tidak valid.
             */
            private validateTransition(
              currentStatus: BookingStatus,
              targetStatus: BookingStatus,
            ): void {
              const allowed = this.VALID_TRANSITIONS[currentStatus];
              if (!allowed || !allowed.includes(targetStatus)) {
                throw new BadRequestException(
                  `Transisi status tidak valid: ${currentStatus} -> ${targetStatus}. ` +
                  `Transisi yang diizinkan: ${allowed?.join(', ') || 'tidak ada'}`,
                );
              }
            }

            /**
             * Ambil booking dengan validasi tenant isolation.
             */
            private async findBookingOrFail(bookingId: string): Promise<Booking> {
              const tenantId = this.tenantContext.getTenantId();
              const booking = await this.bookingRepo.findOne({
                where: { id: bookingId, tenantId },
                relations: ['bookingItems', 'passengers'],
              });

              if (!booking) {
                throw new NotFoundException(
                  `Booking dengan ID ${bookingId} tidak ditemukan`,
                );
              }
              return booking;
            }

            // ──────────────────────────────────────────────────────────────
            // TRANSISI: Draft -> DP_Paid
            // ──────────────────────────────────────────────────────────────

            /**
             * Konfirmasi bahwa DP telah dibayar — transisi Draft -> DP_Paid.
             * Dipanggil setelah PaymentIntent DP berstatus Paid.
             *
             * Side effects:
             * - Status booking -> DP_Paid
             * - Kursi dikonfirmasi (tidak lagi di-lock sementara)
             * - Settlement deadline dicatat
             * - Notifikasi dikirim ke customer
             */
            async confirmDpPayment(bookingId: string): Promise<Booking> {
              const booking = await this.findBookingOrFail(bookingId);
              this.validateTransition(booking.bookingStatus, BookingStatus.DP_PAID);

              const queryRunner = this.dataSource.createQueryRunner();
              await queryRunner.connect();
              await queryRunner.startTransaction();

              try {
                // Update status booking
                booking.bookingStatus = BookingStatus.DP_PAID;
                booking.settlementDeadline = this.calculateSettlementDeadline(booking);
                await queryRunner.manager.save(booking);

                // Konfirmasi kursi di trip schedule (dari lock sementara ke booked)
                for (const item of booking.bookingItems) {
                  if (item.itemType === 'trip') {
                    const schedule = await queryRunner.manager.findOne(TripSchedule, {
                      where: { id: item.referenceId },
                    });
                    if (schedule) {
                      schedule.availableSeats -= item.quantity;
                      await queryRunner.manager.save(schedule);
                    }
                  }
                }

                await queryRunner.commitTransaction();

                // Kirim notifikasi
                await this.notificationService.sendBookingDpConfirmed(booking);

                // Audit log
                await this.auditService.log({
                  userId: booking.customerId || 'system',
                  tenantId: booking.tenantId,
                  action: 'booking.dp_paid',
                  resourceType: 'Booking',
                  resourceId: booking.id,
                  newValues: { bookingStatus: BookingStatus.DP_PAID },
                });

                return booking;
              } catch (error) {
                await queryRunner.rollbackTransaction();
                throw error;
              } finally {
                await queryRunner.release();
              }
            }

            // ──────────────────────────────────────────────────────────────
            // TRANSISI: Draft -> Confirmed (Full Payment)
            // ──────────────────────────────────────────────────────────────

            /**
             * Konfirmasi full payment — transisi Draft -> Confirmed.
             * Dipanggil saat customer membayar penuh (bukan DP).
             *
             * Side effects:
             * - Status booking -> Confirmed
             * - Kursi dikonfirmasi permanen
             * - E-ticket & QR code digenerate
             * - Notifikasi dikirim
             */
            async confirmFullPayment(bookingId: string): Promise<Booking> {
              const booking = await this.findBookingOrFail(bookingId);
              this.validateTransition(booking.bookingStatus, BookingStatus.CONFIRMED);

              const queryRunner = this.dataSource.createQueryRunner();
              await queryRunner.connect();
              await queryRunner.startTransaction();

              try {
                booking.bookingStatus = BookingStatus.CONFIRMED;
                await queryRunner.manager.save(booking);

                // Konfirmasi kursi & generate e-ticket
                for (const item of booking.bookingItems) {
                  if (item.itemType === 'trip') {
                    const schedule = await queryRunner.manager.findOne(TripSchedule, {
                      where: { id: item.referenceId },
                    });
                    if (schedule) {
                      schedule.availableSeats -= item.quantity;
                      await queryRunner.manager.save(schedule);
                    }
                  }
                }

                // Generate QR code untuk setiap passenger
                for (const passenger of booking.passengers) {
                  passenger.ticketQrCode = this.generateQrCode(passenger);
                  await queryRunner.manager.save(passenger);
                }

                await queryRunner.commitTransaction();

                // Kirim e-ticket & notifikasi
                await this.notificationService.sendETicket(booking);

                await this.auditService.log({
                  userId: booking.customerId || 'system',
                  tenantId: booking.tenantId,
                  action: 'booking.confirmed',
                  resourceType: 'Booking',
                  resourceId: booking.id,
                  newValues: { bookingStatus: BookingStatus.CONFIRMED },
                });

                return booking;
              } catch (error) {
                await queryRunner.rollbackTransaction();
                throw error;
              } finally {
                await queryRunner.release();
              }
            }

            // ──────────────────────────────────────────────────────────────
            // TRANSISI: DP_Paid -> Confirmed (Pelunasan)
            // ──────────────────────────────────────────────────────────────

            /**
             * Konfirmasi pelunasan — transisi DP_Paid -> Confirmed.
             * Dipanggil setelah PaymentIntent settlement berstatus Paid.
             *
             * Side effects:
             * - Status booking -> Confirmed
             * - E-ticket & QR code digenerate
             * - Notifikasi dikirim
             */
            async confirmSettlement(bookingId: string): Promise<Booking> {
              const booking = await this.findBookingOrFail(bookingId);
              this.validateTransition(booking.bookingStatus, BookingStatus.CONFIRMED);

              const queryRunner = this.dataSource.createQueryRunner();
              await queryRunner.connect();
              await queryRunner.startTransaction();

              try {
                booking.bookingStatus = BookingStatus.CONFIRMED;
                await queryRunner.manager.save(booking);

                // Generate QR code untuk setiap passenger
                for (const passenger of booking.passengers) {
                  passenger.ticketQrCode = this.generateQrCode(passenger);
                  await queryRunner.manager.save(passenger);
                }

                await queryRunner.commitTransaction();

                await this.notificationService.sendETicket(booking);

                await this.auditService.log({
                  userId: booking.customerId || 'system',
                  tenantId: booking.tenantId,
                  action: 'booking.settlement_confirmed',
                  resourceType: 'Booking',
                  resourceId: booking.id,
                  newValues: { bookingStatus: BookingStatus.CONFIRMED },
                });

                return booking;
              } catch (error) {
                await queryRunner.rollbackTransaction();
                throw error;
              } finally {
                await queryRunner.release();
              }
            }

            // ──────────────────────────────────────────────────────────────
            // TRANSISI: DP_Paid -> Auto_Cancelled
            // ──────────────────────────────────────────────────────────────

            /**
             * Auto-cancel booking karena pelunasan melewati deadline.
             * Dipanggil oleh scheduled job (cron) yang berjalan setiap jam.
             *
             * Side effects:
             * - Status booking -> Auto_Cancelled
             * - Kursi dilepaskan kembali ke inventori
             * - DP hangus (tidak direfund otomatis — perlu proses refund terpisah)
             * - Notifikasi dikirim ke customer
             */
            async autoCancelOverdue(bookingId: string): Promise<Booking> {
              const booking = await this.findBookingOrFail(bookingId);

              // Validasi tambahan: hanya proses jika memang overdue
              if (
                booking.bookingStatus !== BookingStatus.DP_PAID ||
                !booking.settlementDeadline ||
                new Date(booking.settlementDeadline) > new Date()
              ) {
                throw new BadRequestException(
                  'Booking belum melewati deadline pelunasan',
                );
              }

              this.validateTransition(booking.bookingStatus, BookingStatus.AUTO_CANCELLED);

              const queryRunner = this.dataSource.createQueryRunner();
              await queryRunner.connect();
              await queryRunner.startTransaction();

              try {
                booking.bookingStatus = BookingStatus.AUTO_CANCELLED;
                await queryRunner.manager.save(booking);

                // Kembalikan kursi ke inventori
                await this.releaseSeats(queryRunner, booking);

                await queryRunner.commitTransaction();

                await this.notificationService.sendAutoCancelledNotification(booking);

                await this.auditService.log({
                  userId: 'system',
                  tenantId: booking.tenantId,
                  action: 'booking.auto_cancelled',
                  resourceType: 'Booking',
                  resourceId: booking.id,
                  newValues: { bookingStatus: BookingStatus.AUTO_CANCELLED },
                });

                return booking;
              } catch (error) {
                await queryRunner.rollbackTransaction();
                throw error;
              } finally {
                await queryRunner.release();
              }
            }

            /**
             * Batch auto-cancel untuk semua booking yang overdue.
             * Dipanggil oleh cron scheduler.
             */
            async batchAutoCancelOverdue(): Promise<number> {
              const now = new Date();
              const overdueBookings = await this.bookingRepo.find({
                where: {
                  bookingStatus: BookingStatus.DP_PAID,
                },
              });

              let cancelledCount = 0;
              for (const booking of overdueBookings) {
                if (
                  booking.settlementDeadline &&
                  new Date(booking.settlementDeadline) <= now
                ) {
                  try {
                    await this.autoCancelOverdue(booking.id);
                    cancelledCount++;
                  } catch (error) {
                    // Log error tapi lanjutkan ke booking berikutnya
                    console.error(
                      `Gagal auto-cancel booking ${booking.id}:`,
                      error,
                    );
                  }
                }
              }

              return cancelledCount;
            }

            // ──────────────────────────────────────────────────────────────
            // TRANSISI: Draft -> Cancelled
            // ──────────────────────────────────────────────────────────────

            /**
             * Pembatalan oleh customer/CS sebelum pembayaran — Draft -> Cancelled.
             *
             * Side effects:
             * - Status booking -> Cancelled
             * - Kursi yang di-lock dilepaskan kembali
             * - Tidak ada refund (belum ada pembayaran)
             */
            async cancelDraftBooking(
              bookingId: string,
              cancelledBy: string,
              reason?: string,
            ): Promise<Booking> {
              const booking = await this.findBookingOrFail(bookingId);
              this.validateTransition(booking.bookingStatus, BookingStatus.CANCELLED);

              const queryRunner = this.dataSource.createQueryRunner();
              await queryRunner.connect();
              await queryRunner.startTransaction();

              try {
                booking.bookingStatus = BookingStatus.CANCELLED;
                booking.cancellationReason = reason || 'Dibatalkan oleh customer';
                booking.cancelledBy = cancelledBy;
                booking.cancelledAt = new Date();
                await queryRunner.manager.save(booking);

                // Kembalikan kursi yang di-lock
                await this.releaseSeats(queryRunner, booking);

                await queryRunner.commitTransaction();

                await this.notificationService.sendCancellationNotification(booking);

                await this.auditService.log({
                  userId: cancelledBy,
                  tenantId: booking.tenantId,
                  action: 'booking.cancelled_draft',
                  resourceType: 'Booking',
                  resourceId: booking.id,
                  newValues: {
                    bookingStatus: BookingStatus.CANCELLED,
                    reason,
                  },
                });

                return booking;
              } catch (error) {
                await queryRunner.rollbackTransaction();
                throw error;
              } finally {
                await queryRunner.release();
              }
            }

            // ──────────────────────────────────────────────────────────────
            // TRANSISI: DP_Paid -> Cancelled / Confirmed -> Cancelled
            // ──────────────────────────────────────────────────────────────

            /**
             * Pembatalan booking yang sudah ada pembayaran (DP atau lunas).
             * Membutuhkan proses refund terpisah.
             *
             * Side effects:
             * - Status booking -> Cancelled
             * - Kursi dilepaskan
             * - Refund request dibuat (jika ada pembayaran)
             */
            async cancelPaidBooking(
              bookingId: string,
              cancelledBy: string,
              reason?: string,
            ): Promise<Booking> {
              const booking = await this.findBookingOrFail(bookingId);

              // Hanya izinkan dari DP_Paid atau Confirmed
              if (
                booking.bookingStatus !== BookingStatus.DP_PAID &&
                booking.bookingStatus !== BookingStatus.CONFIRMED
              ) {
                throw new BadRequestException(
                  `Booking dengan status ${booking.bookingStatus} tidak dapat dibatalkan dengan refund`,
                );
              }

              this.validateTransition(booking.bookingStatus, BookingStatus.CANCELLED);

              const queryRunner = this.dataSource.createQueryRunner();
              await queryRunner.connect();
              await queryRunner.startTransaction();

              try {
                booking.bookingStatus = BookingStatus.CANCELLED;
                booking.cancellationReason = reason || 'Dibatalkan oleh customer';
                booking.cancelledBy = cancelledBy;
                booking.cancelledAt = new Date();
                await queryRunner.manager.save(booking);

                // Kembalikan kursi
                await this.releaseSeats(queryRunner, booking);

                await queryRunner.commitTransaction();

                await this.notificationService.sendCancellationNotification(booking);

                await this.auditService.log({
                  userId: cancelledBy,
                  tenantId: booking.tenantId,
                  action: 'booking.cancelled_paid',
                  resourceType: 'Booking',
                  resourceId: booking.id,
                  newValues: {
                    bookingStatus: BookingStatus.CANCELLED,
                    reason,
                  },
                });

                return booking;
              } catch (error) {
                await queryRunner.rollbackTransaction();
                throw error;
              } finally {
                await queryRunner.release();
              }
            }

            // ──────────────────────────────────────────────────────────────
            // HELPER METHODS
            // ──────────────────────────────────────────────────────────────

            /**
             * Kembalikan kursi ke inventori trip schedule.
             */
            private async releaseSeats(
              queryRunner: any,
              booking: Booking,
            ): Promise<void> {
              for (const item of booking.bookingItems) {
                if (item.itemType === 'trip') {
                  const schedule = await queryRunner.manager.findOne(TripSchedule, {
                    where: { id: item.referenceId },
                  });
                  if (schedule) {
                    schedule.availableSeats += item.quantity;
                    await queryRunner.manager.save(schedule);
                  }
                }
              }
            }

            /**
             * Hitung deadline pelunasan berdasarkan konfigurasi tenant.
             * Default: H-3 sebelum keberangkatan pertama.
             */
            private calculateSettlementDeadline(booking: Booking): Date {
              // Cari departure date paling awal dari booking items
              // Untuk simplifikasi, gunakan 3 hari sebelum departure pertama
              const now = new Date();
              // Default: 7 hari dari sekarang jika tidak ada trip item
              let earliestDeparture: Date | null = null;

              // Dalam implementasi nyata, lookup TripSchedule untuk dapat departure_at
              // Untuk sekarang, gunakan default 7 hari
              const deadline = new Date(now);
              deadline.setDate(deadline.getDate() + 7);
              return deadline;
            }

            /**
             * Generate QR code untuk passenger.
             */
            private generateQrCode(passenger: Passenger): string {
              // Dalam implementasi nyata, gunakan library qrcode
              // Format: base64 encoded QR code image atau signed token
              const payload = JSON.stringify({
                pid: passenger.id,
                bid: passenger.bookingId,
                name: passenger.fullName,
                seat: passenger.seatCode,
              });
              return Buffer.from(payload).toString('base64');
            }
          }

      - file_path: "src/modules/booking/booking-state-machine.controller.ts"
        code: |
          import {
            Controller,
            Post,
            Param,
            Body,
            HttpCode,
            HttpStatus,
          } from '@nestjs/common';
          import { BookingStateMachineService } from './booking-state-machine.service';
          import { RequirePermissions } from '../iam/decorators/require-permissions.decorator';
          import { CurrentUser } from '../iam/decorators/current-user.decorator';
          import { Booking } from './entities/booking.entity';
          import { ApiTags, ApiOperation, ApiResponse } from '@nestjs/swagger';

          @ApiTags('Booking State Machine')
          @Controller('bookings')
          export class BookingStateMachineController {
            constructor(
              private readonly stateMachine: BookingStateMachineService,
            ) {}

            /**
             * Konfirmasi DP dibayar — transisi Draft -> DP_Paid.
             * Dipanggil oleh PaymentModule setelah webhook gateway mengkonfirmasi pembayaran DP.
             */
            @Post(':bookingId/confirm-dp')
            @HttpCode(HttpStatus.OK)
            @RequirePermissions('booking.approve')
            @ApiOperation({ summary: 'Konfirmasi pembayaran DP — Draft -> DP_Paid' })
            @ApiResponse({ status: 200, description: 'Booking berhasil dikonfirmasi DP' })
            async confirmDpPayment(
              @Param('bookingId') bookingId: string,
            ): Promise<Booking> {
              return this.stateMachine.confirmDpPayment(bookingId);
            }

            /**
             * Konfirmasi full payment — transisi Draft -> Confirmed.
             */
            @Post(':bookingId/confirm-full')
            @HttpCode(HttpStatus.OK)
            @RequirePermissions('booking.approve')
            @ApiOperation({ summary: 'Konfirmasi full payment — Draft -> Confirmed' })
            async confirmFullPayment(
              @Param('bookingId') bookingId: string,
            ): Promise<Booking> {
              return this.stateMachine.confirmFullPayment(bookingId);
            }

            /**
             * Konfirmasi pelunasan — transisi DP_Paid -> Confirmed.
             */
            @Post(':bookingId/confirm-settlement')
            @HttpCode(HttpStatus.OK)
            @RequirePermissions('booking.approve')
            @ApiOperation({ summary: 'Konfirmasi pelunasan — DP_Paid -> Confirmed' })
            async confirmSettlement(
              @Param('bookingId') bookingId: string,
            ): Promise<Booking> {
              return this.stateMachine.confirmSettlement(bookingId);
            }

            /**
             * Batalkan booking Draft (belum bayar) — Draft -> Cancelled.
             */
            @Post(':bookingId/cancel-draft')
            @HttpCode(HttpStatus.OK)
            @RequirePermissions('booking.cancel')
            @ApiOperation({ summary: 'Batalkan booking Draft — Draft -> Cancelled' })
            async cancelDraftBooking(
              @Param('bookingId') bookingId: string,
              @CurrentUser('id') userId: string,
              @Body('reason') reason?: string,
            ): Promise<Booking> {
              return this.stateMachine.cancelDraftBooking(bookingId, userId, reason);
            }

            /**
             * Batalkan booking yang sudah dibayar — DP_Paid/Confirmed -> Cancelled.
             * Akan memicu proses refund.
             */
            @Post(':bookingId/cancel-paid')
            @HttpCode(HttpStatus.OK)
            @RequirePermissions('booking.cancel')
            @ApiOperation({ summary: 'Batalkan booking berbayar — DP_Paid/Confirmed -> Cancelled' })
            async cancelPaidBooking(
              @Param('bookingId') bookingId: string,
              @CurrentUser('id') userId: string,
              @Body('reason') reason?: string,
            ): Promise<Booking> {
              return this.stateMachine.cancelPaidBooking(bookingId, userId, reason);
            }

            /**
             * Trigger auto-cancel untuk booking overdue (admin only).
             */
            @Post('auto-cancel-overdue')
            @HttpCode(HttpStatus.OK)
            @RequirePermissions('booking.manage')
            @ApiOperation({ summary: 'Batch auto-cancel booking overdue' })
            async batchAutoCancel(): Promise<{ cancelledCount: number }> {
              const cancelledCount = await this.stateMachine.batchAutoCancelOverdue();
              return { cancelledCount };
            }
          }

  # ═══════════════════════════════════════════════════════════════════════════
  # PAYMENT INTENT STATE MACHINE
  # ═══════════════════════════════════════════════════════════════════════════
  - module_name: "PaymentStateMachineModule"
    description: >
      Mengelola transisi status Payment Intent Lifecycle:
      Pending -> Paid (webhook gateway konfirmasi)
      Pending -> Expired (melewati batas waktu)
      Pending -> Failed (gateway melaporkan kegagalan)
      Paid -> Refunded (setelah refund disetujui & diproses)
    files:
      - file_path: "src/modules/payment/payment-state-machine.module.ts"
        code: |
          import { Module } from '@nestjs/common';
          import { TypeOrmModule } from '@nestjs/typeorm';
          import { PaymentStateMachineService } from './payment-state-machine.service';
          import { PaymentStateMachineController } from './payment-state-machine.controller';
          import { PaymentIntent } from './entities/payment-intent.entity';
