          @ApiTags('Tenant KYB State Machine')
          @Controller('tenants')
          export class TenantKybStateMachineController {
            constructor(
              private readonly stateMachine: TenantKybStateMachineService,
            ) {}

            /**
             * Approve KYB — Super Admin only.
             */
            @Post(':tenantId/kyb/approve')
            @HttpCode(HttpStatus.OK)
            @RequirePermissions('tenant.kyb.approve')
            @ApiOperation({ summary: 'Approve KYB tenant — Pending -> Approved' })
            async approveKyb(
              @Param('tenantId') tenantId: string,
              @CurrentUser('id') userId: string,
              @Body('notes') notes?: string,
            ): Promise<Tenant> {
              return this.stateMachine.approveKyb(tenantId, userId, notes);
            }

            /**
             * Tolak KYB — Super Admin only.
             */
            @Post(':tenantId/kyb/reject')
            @HttpCode(HttpStatus.OK)
            @RequirePermissions('tenant.kyb.approve')
            @ApiOperation({ summary: 'Tolak KYB tenant — Pending -> Rejected' })
            async rejectKyb(
              @Param('tenantId') tenantId: string,
              @CurrentUser('id') userId: string,
              @Body('rejectionReason') rejectionReason: string,
            ): Promise<Tenant> {
              return this.stateMachine.rejectKyb(tenantId, userId, rejectionReason);
            }

            /**
             * Resubmit KYB — Tenant Owner.
             */
            @Post(':tenantId/kyb/resubmit')
            @HttpCode(HttpStatus.OK)
            @RequirePermissions('tenant.kyb.resubmit')
