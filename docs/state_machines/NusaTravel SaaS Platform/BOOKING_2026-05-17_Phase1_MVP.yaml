  # TENANT SUBSCRIPTION STATE MACHINE
  # ═══════════════════════════════════════════════════════════════════════════
  - module_name: "TenantSubscriptionStateMachineModule"
    description: >
      Mengelola transisi status Subscription Tenant:
      Trial -> Active (konversi ke subscription berbayar)
      Active -> Grace (pembayaran subscription terlambat)
      Grace -> Active (pembayaran diterima dalam masa grace)
      Grace -> Suspended (melewati masa grace tanpa pembayaran)
      Suspended -> Active (pembayaran diterima setelah suspend)
      Active -> Cancelled (tenant berhenti berlangganan)
    files:
      - file_path: "src/modules/tenant/tenant-subscription-state-machine.module.ts"
        code: |
          import { Module } from '@nestjs/common';
          import { TypeOrmModule } from '@nestjs/typeorm';
          import { TenantSubscriptionStateMachineService } from './tenant-subscription-state-machine.service';
          import { TenantSubscriptionStateMachineController } from './tenant-subscription-state-machine.controller';
          import { Tenant } from './entities/tenant.entity';
          import { IamModule } from '../iam/iam.module';
          import { NotificationModule } from '../notification/notification.module';
          import { AuditModule } from '../audit/audit.module';

          @Module({
            imports: [
              TypeOrmModule.forFeature([Tenant]),
              IamModule,
              NotificationModule,
              AuditModule,
            ],
            controllers: [TenantSubscriptionStateMachineController],
            providers: [TenantSubscriptionStateMachineService],
            exports: [TenantSubscriptionStateMachineService],
          })
          export class TenantSubscriptionStateMachineModule {}

      - file_path: "src/modules/tenant/tenant-subscription-state-machine.service.ts"
        code: |
          import {
            Injectable,
            BadRequestException,
            NotFoundException,
          } from '@nestjs/common';
          import { InjectRepository } from '@nestjs/typeorm';
          import { Repository, LessThan } from 'typeorm';
          import { Tenant, SubscriptionStatus } from './entities/tenant.entity';
          import { NotificationService } from '../notification/notification.service';
          import { AuditService } from '../audit/audit.service';

          /**
           * Tenant Subscription State Machine.
           *
           * Valid transitions:
           *   Trial ────────> Active     (konversi ke subscription berbayar)
           *   Active ───────> Grace      (pembayaran subscription terlambat)
           *   Grace ────────> Active     (pembayaran diterima dalam masa grace)
           *   Grace ────────> Suspended  (melewati masa grace tanpa pembayaran)
           *   Suspended ────> Active     (pembayaran diterima setelah suspend)
           *   Active ───────> Cancelled  (tenant berhenti berlangganan)
           */
          @Injectable()
          export class TenantSubscriptionStateMachineService {
            private readonly VALID_TRANSITIONS: Record<SubscriptionStatus, SubscriptionStatus[]> = {
              [SubscriptionStatus.TRIAL]: [
                SubscriptionStatus.ACTIVE,
              ],
              [SubscriptionStatus.ACTIVE]: [
                SubscriptionStatus.GRACE,
                SubscriptionStatus.CANCELLED,
              ],
              [SubscriptionStatus.GRACE]: [
                SubscriptionStatus.ACTIVE,
                SubscriptionStatus.SUSPENDED,
              ],
              [SubscriptionStatus.SUSPENDED]: [
                SubscriptionStatus.ACTIVE,
              ],
              [SubscriptionStatus.CANCELLED]: [],
            };

            constructor(
              @InjectRepository(Tenant)
              private readonly tenantRepo: Repository<Tenant>,
              private readonly notificationService: NotificationService,
              private readonly auditService: AuditService,
            ) {}

            private validateTransition(
              currentStatus: SubscriptionStatus,
              targetStatus: SubscriptionStatus,
            ): void {
              const allowed = this.VALID_TRANSITIONS[currentStatus];
              if (!allowed || !allowed.includes(targetStatus)) {
                throw new BadRequestException(
                  `Transisi Subscription tidak valid: ${currentStatus} -> ${targetStatus}`,
                );
              }
            }

            private async findTenantOrFail(tenantId: string): Promise<Tenant> {
              const tenant = await this.tenantRepo.findOne({
                where: { id: tenantId },
              });
              if (!tenant) {
                throw new NotFoundException(`Tenant ${tenantId} tidak ditemukan`);
              }
              return tenant;
            }

            // ──────────────────────────────────────────────────────────────
            // TRANSISI: Trial -> Active
            // ──────────────────────────────────────────────────────────────

            /**
             * Konversi trial ke subscription aktif — Trial -> Active.
             * Dipanggil saat tenant memilih paket berbayar dan pembayaran pertama diterima.
             */
            async activateFromTrial(
              tenantId: string,
              newTier: string,
            ): Promise<Tenant> {
              const tenant = await this.findTenantOrFail(tenantId);
              this.validateTransition(tenant.subscriptionStatus, SubscriptionStatus.ACTIVE);

              tenant.subscriptionStatus = SubscriptionStatus.ACTIVE;
              tenant.subscriptionTier = newTier;
              tenant.subscriptionActivatedAt = new Date();
              await this.tenantRepo.save(tenant);

              await this.notificationService.sendSubscriptionActivatedNotification(tenant);

              await this.auditService.log({
                userId: 'system',
                tenantId: tenant.id,
                action: 'tenant.subscription_activated',
                resourceType: 'Tenant',
                resourceId: tenant.id,
                newValues: {
                  subscriptionStatus: SubscriptionStatus.ACTIVE,
                  subscriptionTier: newTier,
                },
              });

              return tenant;
            }

            // ──────────────────────────────────────────────────────────────
            // TRANSISI: Active -> Grace
            // ──────────────────────────────────────────────────────────────

            /**
             * Masuk masa grace karena pembayaran terlambat — Active -> Grace.
             * Dipanggil oleh cron job saat pembayaran subscription melewati due date.
             */
            async enterGracePeriod(tenantId: string): Promise<Tenant> {
              const tenant = await this.findTenantOrFail(tenantId);
              this.validateTransition(tenant.subscriptionStatus, SubscriptionStatus.GRACE);

              const graceEndDate = new Date();
              graceEndDate.setDate(graceEndDate.getDate() + 14); // 14 hari grace period

              tenant.subscriptionStatus = SubscriptionStatus.GRACE;
              tenant.graceEndsAt = graceEndDate;
              await this.tenantRepo.save(tenant);

              await this.notificationService.sendGracePeriodNotification(tenant);

              await this.auditService.log({
                userId: 'system',
                tenantId: tenant.id,
                action: 'tenant.subscription_grace',
                resourceType: 'Tenant',
                resourceId: tenant.id,
                newValues: {
                  subscriptionStatus: SubscriptionStatus.GRACE,
                  graceEndsAt: graceEndDate,
                },
              });

              return tenant;
            }

            // ──────────────────────────────────────────────────────────────
            // TRANSISI: Grace -> Active
            // ──────────────────────────────────────────────────────────────

            /**
             * Pembayaran diterima dalam masa grace — Grace -> Active.
             */
            async reactivateFromGrace(tenantId: string): Promise<Tenant> {
              const tenant = await this.findTenantOrFail(tenantId);
              this.validateTransition(tenant.subscriptionStatus, SubscriptionStatus.ACTIVE);

              tenant.subscriptionStatus = SubscriptionStatus.ACTIVE;
              tenant.graceEndsAt = null;
              await this.tenantRepo.save(tenant);

              await this.notificationService.sendSubscriptionReactivatedNotification(tenant);

              await this.auditService.log({
                userId: 'system',
                tenantId: tenant.id,
                action: 'tenant.subscription_reactivated',
                resourceType: 'Tenant',
                resourceId: tenant.id,
                newValues: { subscriptionStatus: SubscriptionStatus.ACTIVE },
              });

              return tenant;
            }

            // ──────────────────────────────────────────────────────────────
            // TRANSISI: Grace -> Suspended
            // ──────────────────────────────────────────────────────────────

            /**
             * Suspend tenant karena melewati grace period — Grace -> Suspended.
             * Dipanggil oleh cron job.
             *
             * Side effects:
             * - Semua user tenant tidak bisa login
             * - Customer-facing pages menampilkan maintenance
             */
            async suspendTenant(tenantId: string): Promise<Tenant> {
              const tenant = await this.findTenantOrFail(tenantId);
              this.validateTransition(tenant.subscriptionStatus, SubscriptionStatus.SUSPENDED);

              tenant.subscriptionStatus = SubscriptionStatus.SUSPENDED;
              tenant.suspendedAt = new Date();
              await this.tenantRepo.save(tenant);

              await this.notificationService.sendSuspensionNotification(tenant);

              await this.auditService.log({
                userId: 'system',
                tenantId: tenant.id,
                action: 'tenant.suspended',
                resourceType: 'Tenant',
                resourceId: tenant.id,
                newValues: {
                  subscriptionStatus: SubscriptionStatus.SUSPENDED,
                  suspendedAt: new Date(),
                },
              });

              return tenant;
            }

            // ──────────────────────────────────────────────────────────────
            // TRANSISI: Suspended -> Active
            // ──────────────────────────────────────────────────────────────

            /**
             * Aktifkan kembali tenant setelah suspend — Suspended -> Active.
             * Dipanggil setelah tenant menyelesaikan pembayaran.
             */
            async reactivateFromSuspension(tenantId: string): Promise<Tenant> {
              const tenant = await this.findTenantOrFail(tenantId);
              this.validateTransition(tenant.subscriptionStatus, SubscriptionStatus.ACTIVE);

              tenant.subscriptionStatus = SubscriptionStatus.ACTIVE;
              tenant.suspendedAt = null;
              await this.tenantRepo.save(tenant);

              await this.notificationService.sendSubscriptionReactivatedNotification(tenant);

              await this.auditService.log({
                userId: 'system',
                tenantId: tenant.id,
                action: 'tenant.reactivated_from_suspension',
                resourceType: 'Tenant',
                resourceId: tenant.id,
                newValues: { subscriptionStatus: SubscriptionStatus.ACTIVE },
              });

              return tenant;
            }

            // ──────────────────────────────────────────────────────────────
            // TRANSISI: Active -> Cancelled
            // ──────────────────────────────────────────────────────────────

            /**
             * Tenant berhenti berlangganan — Active -> Cancelled.
             */
            async cancelSubscription(
              tenantId: string,
              reason?: string,
            ): Promise<Tenant> {
              const tenant = await this.findTenantOrFail(tenantId);
              this.validateTransition(tenant.subscriptionStatus, SubscriptionStatus.CANCELLED);

              tenant.subscriptionStatus = SubscriptionStatus.CANCELLED;
              tenant.cancelledAt = new Date();
              tenant.cancellationReason = reason;
              await this.tenantRepo.save(tenant);

              await this.notificationService.sendSubscriptionCancelledNotification(tenant);

              await this.auditService.log({
                userId: 'system',
                tenantId: tenant.id,
                action: 'tenant.subscription_cancelled',
                resourceType: 'Tenant',
                resourceId: tenant.id,
                newValues: {
                  subscriptionStatus: SubscriptionStatus.CANCELLED,
                  reason,
                },
              });

              return tenant;
            }

            // ──────────────────────────────────────────────────────────────
            // BATCH OPERATIONS (CRON)
            // ──────────────────────────────────────────────────────────────

            /**
             * Batch: pindahkan tenant yang overdue ke grace period.
             */
            async batchEnterGracePeriod(): Promise<number> {
              // Cari tenant active yang pembayarannya overdue
              // Dalam implementasi nyata, cek dari billing/invoice table
              const tenants = await this.tenantRepo.find({
                where: { subscriptionStatus: SubscriptionStatus.ACTIVE },
              });

              let count = 0;
              for (const tenant of tenants) {
                // TODO: Cek invoice terakhir, jika overdue -> grace
                // Untuk sekarang, skip
              }
              return count;
            }

            /**
             * Batch: suspend tenant yang melewati grace period.
             */
            async batchSuspendExpiredGrace(): Promise<number> {
              const now = new Date();
              const tenants = await this.tenantRepo.find({
                where: {
                  subscriptionStatus: SubscriptionStatus.GRACE,
                  graceEndsAt: LessThan(now),
                },
              });

              let count = 0;
              for (const tenant of tenants) {
                try {
                  await this.suspendTenant(tenant.id);
                  count++;
                } catch (error) {
                  console.error(`Gagal suspend tenant ${tenant.id}:`, error);
                }
              }
              return count;
            }
          }

      - file_path: "src/modules/tenant/tenant-subscription-state-machine.controller.ts"
        code: |
          import {
            Controller,
            Post,
            Param,
            Body,
            HttpCode,
            HttpStatus,
          } from '@nestjs/common';
          import { TenantSubscriptionStateMachineService } from './tenant-subscription-state-machine.service';
          import { RequirePermissions } from '../iam/decorators/require-permissions.decorator';
          import { Tenant } from './entities/tenant.entity';
          import { ApiTags, ApiOperation, ApiResponse } from '@nestjs/swagger';

          @ApiTags('Tenant Subscription State Machine')
          @Controller('tenants')
          export class TenantSubscriptionStateMachineController {
            constructor(
              private readonly stateMachine: TenantSubscriptionStateMachineService,
            ) {}

            /**
             * Aktivasi subscription dari trial — Super Admin.
             */
            @Post(':tenantId/subscription/activate')
            @HttpCode(HttpStatus.OK)
            @RequirePermissions('tenant.subscription.manage')
            @ApiOperation({ summary: 'Aktivasi subscription — Trial -> Active' })
            async activateSubscription(
              @Param('tenantId') tenantId: string,
              @Body('tier') tier: string,
            ): Promise<Tenant> {
              return this.stateMachine.activateFromTrial(tenantId, tier);
            }

            /**
             * Suspend tenant — Super Admin.
             */
            @Post(':tenantId/subscription/suspend')
            @HttpCode(HttpStatus.OK)
            @RequirePermissions('tenant.subscription.manage')
            @ApiOperation({ summary: 'Suspend tenant — Grace -> Suspended' })
            async suspendTenant(
              @Param('tenantId') tenantId: string,
            ): Promise<Tenant> {
              return this.stateMachine.suspendTenant(tenantId);
            }

            /**
             * Aktifkan kembali tenant — Super Admin.
             */
            @Post(':tenantId/subscription/reactivate')
            @HttpCode(HttpStatus.OK)
            @RequirePermissions('tenant.subscription.manage')
            @ApiOperation({ summary: 'Reaktivasi tenant — Suspended/Grace -> Active' })
            async reactivateTenant(
              @Param('tenantId') tenantId: string,
            ): Promise<Tenant> {
              const tenant = await this.stateMachine.findTenantOrFail(tenantId);
              if (tenant.subscriptionStatus === 'grace') {
                return this.stateMachine.reactivateFromGrace(tenantId);
              }
              return this.stateMachine.reactivateFromSuspension(tenantId);
            }

            /**
             * Batalkan subscription — Super Admin.
             */
            @Post(':tenantId/subscription/cancel')
            @HttpCode(HttpStatus.OK)
            @RequirePermissions('tenant.subscription.manage')
            @ApiOperation({ summary: 'Batalkan subscription — Active -> Cancelled' })
            async cancelSubscription(
              @Param('tenantId') tenantId: string,
              @Body('reason') reason?: string,
            ): Promise<Tenant> {
              return this.stateMachine.cancelSubscription(tenantId, reason);
            }

            /**
             * Batch suspend grace-expired tenants (cron trigger).
             */
            @Post('subscription/batch-suspend')
            @HttpCode(HttpStatus.OK)
            @RequirePermissions('tenant.subscription.manage')
            @ApiOperation({ summary: 'Batch suspend tenant grace-expired' })
            async batchSuspend(): Promise<{ suspendedCount: number }> {
              const suspendedCount = await this.stateMachine.batchSuspendExpiredGrace();
              return { suspendedCount };
            }
          }

  # ═══════════════════════════════════════════════════════════════════════════
  # VEHICLE STATE MACHINE
  # ═══════════════════════════════════════════════════════════════════════════
  - module_name: "VehicleStateMachineModule"
    description: >
      Mengelola transisi status Vehicle Lifecycle:
      Active -> Maintenance (kendaraan masuk jadwal servis)
      Maintenance -> Active (servis selesai, kendaraan siap operasi)
      Active -> Inactive (kendaraan dinonaktifkan permanen)
    files:
      - file_path: "src/modules/fleet/vehicle-state-machine.module.ts"
        code: |
          import { Module } from '@nestjs/common';
          import { TypeOrmModule } from '@nestjs/typeorm';
          import { VehicleStateMachineService } from './vehicle-state-machine.service';
          import { VehicleStateMachineController } from './vehicle-state-machine.controller';
          import { Vehicle } from './entities/vehicle.entity';
          import { TripSchedule } from '../trip/entities/trip-schedule.entity';
          import { IamModule } from '../iam/iam.module';
          import { NotificationModule } from '../notification/notification.module';
          import { AuditModule } from '../audit/audit.module';

          @Module({
            imports: [
              TypeOrmModule.forFeature([Vehicle, TripSchedule]),
              IamModule,
              NotificationModule,
              AuditModule,
            ],
            controllers: [VehicleStateMachineController],
            providers: [VehicleStateMachineService],
            exports: [VehicleStateMachineService],
          })
          export class VehicleStateMachineModule {}

      - file_path: "src/modules/fleet/vehicle-state-machine.service.ts"
        code: |
          import {
            Injectable,
            BadRequestException,
            NotFoundException,
          } from '@nestjs/common';
          import { InjectRepository } from '@nestjs/typeorm';
          import { Repository, MoreThanOrEqual, LessThanOrEqual } from 'typeorm';
          import { Vehicle, VehicleStatus } from './entities/vehicle.entity';
          import { TripSchedule, TripStatus } from '../trip/entities/trip-schedule.entity';
          import { TenantContextService } from '../iam/services/tenant-context.service';
          import { NotificationService } from '../notification/notification.service';
          import { AuditService } from '../audit/audit.service';

          /**
           * Vehicle State Machine.
           *
           * Valid transitions:
           *   Active ───────> Maintenance  (kendaraan masuk jadwal servis)
           *   Maintenance ──> Active       (servis selesai, kendaraan siap operasi)
           *   Active ───────> Inactive     (kendaraan dinonaktifkan permanen)
           */
          @Injectable()
          export class VehicleStateMachineService {
            private readonly VALID_TRANSITIONS: Record<VehicleStatus, VehicleStatus[]> = {
              [VehicleStatus.ACTIVE]: [
                VehicleStatus.MAINTENANCE,
                VehicleStatus.INACTIVE,
              ],
              [VehicleStatus.MAINTENANCE]: [
                VehicleStatus.ACTIVE,
              ],
              [VehicleStatus.INACTIVE]: [],
            };

            constructor(
              @InjectRepository(Vehicle)
              private readonly vehicleRepo: Repository<Vehicle>,
              @InjectRepository(TripSchedule)
              private readonly tripScheduleRepo: Repository<TripSchedule>,
              private readonly tenantContext: TenantContextService,
              private readonly notificationService: NotificationService,
              private readonly auditService: AuditService,
            ) {}

            private validateTransition(
              currentStatus: VehicleStatus,
              targetStatus: VehicleStatus,
            ): void {
              const allowed = this.VALID_TRANSITIONS[currentStatus];
              if (!allowed || !allowed.includes(targetStatus)) {
                throw new BadRequestException(
                  `Transisi Vehicle tidak valid: ${currentStatus} -> ${targetStatus}`,
                );
              }
            }

            private async findVehicleOrFail(vehicleId: string): Promise<Vehicle> {
              const tenantId = this.tenantContext.getTenantId();
              const vehicle = await this.vehicleRepo.findOne({
                where: { id: vehicleId, tenantId },
              });
              if (!vehicle) {
                throw new NotFoundException(
                  `Kendaraan ${vehicleId} tidak ditemukan`,
                );
              }
              return vehicle;
            }

            // ──────────────────────────────────────────────────────────────
            // TRANSISI: Active -> Maintenance
            // ──────────────────────────────────────────────────────────────

            /**
             * Kendaraan masuk maintenance — Active -> Maintenance.
             *
             * Validasi:
             * - Kendaraan tidak sedang di-assign ke trip schedule aktif
             * - Jika ada trip schedule mendatang, harus di-reassign dulu
             *
             * Side effects:
             * - Status kendaraan -> Maintenance
             * - Notifikasi ke fleet supervisor
             */
            async sendToMaintenance(
              vehicleId: string,
              maintenanceDate: Date,
              maintenanceType: string,
              notes?: string,
            ): Promise<Vehicle> {
              const vehicle = await this.findVehicleOrFail(vehicleId);
              this.validateTransition(vehicle.status, VehicleStatus.MAINTENANCE);

              // Cek apakah kendaraan sedang di-assign ke trip aktif
              const activeTrip = await this.tripScheduleRepo.findOne({
                where: {
                  vehicleId: vehicle.id,
                  status: TripStatus.IN_PROGRESS,
                },
              });

              if (activeTrip) {
                throw new BadRequestException(
                  `Kendaraan sedang dalam perjalanan (Trip: ${activeTrip.id}). ` +
                  `Tidak dapat dialihkan ke maintenance saat ini.`,
                );
              }

              // Cek trip schedule mendatang yang bentrok dengan maintenance
              const conflictingTrips = await this.tripScheduleRepo.find({
                where: {
                  vehicleId: vehicle.id,
                  status: TripStatus.SCHEDULED,
                  departureAt: LessThanOrEqual(
                    new Date(maintenanceDate.getTime() + 24 * 60 * 60 * 1000),
                  ),
                },
              });

              if (conflictingTrips.length > 0) {
                throw new BadRequestException(
                  `Terdapat ${conflictingTrips.length} trip schedule mendatang ` +
                  `yang menggunakan kendaraan ini. Harap reassign terlebih dahulu.`,
                );
              }

              vehicle.status = VehicleStatus.MAINTENANCE;
              vehicle.maintenanceDate = maintenanceDate;
              vehicle.maintenanceType = maintenanceType;
              vehicle.maintenanceNotes = notes;
              await this.vehicleRepo.save(vehicle);

              await this.notificationService.sendVehicleMaintenanceNotification(vehicle);

              await this.auditService.log({
                userId: this.tenantContext.getCurrentUserId(),
                tenantId: vehicle.tenantId,
                action: 'vehicle.maintenance_started',
                resourceType: 'Vehicle',
                resourceId: vehicle.id,
                newValues: {
                  status: VehicleStatus.MAINTENANCE,
                  maintenanceDate,
                  maintenanceType,
                },
              });

              return vehicle;
            }

            // ──────────────────────────────────────────────────────────────
            // TRANSISI: Maintenance -> Active
            // ──────────────────────────────────────────────────────────────

            /**
             * Kendaraan selesai maintenance — Maintenance -> Active.
             *
             * Side effects:
             * - Status kendaraan -> Active
             * - Kendaraan siap di-assign ke trip schedule
             * - Notifikasi ke fleet supervisor
             */
            async returnFromMaintenance(
              vehicleId: string,
              completionNotes?: string,
            ): Promise<Vehicle> {
              const vehicle = await this.findVehicleOrFail(vehicleId);
              this.validateTransition(vehicle.status, VehicleStatus.ACTIVE);

              vehicle.status = VehicleStatus.ACTIVE;
              vehicle.lastMaintenanceCompletedAt = new Date();
              vehicle.maintenanceCompletionNotes = completionNotes;
              await this.vehicleRepo.save(vehicle);

              await this.notificationService.sendVehicleReadyNotification(vehicle);

              await this.auditService.log({
                userId: this.tenantContext.getCurrentUserId(),
                tenantId: vehicle.tenantId,
                action: 'vehicle.maintenance_completed',
                resourceType: 'Vehicle',
                resourceId: vehicle.id,
                newValues: {
                  status: VehicleStatus.ACTIVE,
                  completionNotes,
                },
              });

              return vehicle;
            }

            // ──────────────────────────────────────────────────────────────
            // TRANSISI: Active -> Inactive
            // ──────────────────────────────────────────────────────────────

            /**
             * Nonaktifkan kendaraan permanen — Active -> Inactive.
             *
             * Validasi:
             * - Kendaraan tidak sedang di-assign ke trip schedule
             * - Semua trip mendatang sudah di-reassign
             */
            async deactivateVehicle(
              vehicleId: string,
              reason: string,
            ): Promise<Vehicle> {
              const vehicle = await this.findVehicleOrFail(vehicleId);
              this.validateTransition(vehicle.status, VehicleStatus.INACTIVE);

              // Cek trip schedule aktif
              const activeOrScheduledTrips = await this.tripScheduleRepo.find({
                where: {
                  vehicleId: vehicle.id,
                  status: TripStatus.SCHEDULED,
                },
              });

              if (activeOrScheduledTrips.length > 0) {
                throw new BadRequestException(
                  `Tidak dapat menonaktifkan kendaraan. Terdapat ` +
                  `${activeOrScheduledTrips.length} trip schedule yang masih ` +
                  `menggunakan kendaraan ini. Harap reassign terlebih dahulu.`,
                );
              }

              vehicle.status = VehicleStatus.INACTIVE;
              vehicle.deactivatedAt = new Date();
              vehicle.deactivationReason = reason;
              await this.vehicleRepo.save(vehicle);

              await this.auditService.log({
                userId: this.tenantContext.getCurrentUserId(),
                tenantId: vehicle.tenantId,
                action: 'vehicle.deactivated',
                resourceType: 'Vehicle',
                resourceId: vehicle.id,
                newValues: {
                  status: VehicleStatus.INACTIVE,
                  reason,
                },
              });

              return vehicle;
            }

            // ──────────────────────────────────────────────────────────────
            // MAINTENANCE REMINDER (CRON)
            // ──────────────────────────────────────────────────────────────

            /**
             * Kirim notifikasi untuk kendaraan yang maintenance-nya jatuh tempo.
             * Dipanggil oleh cron job harian.
             */
            async sendMaintenanceReminders(): Promise<number> {
              const now = new Date();
              const threeDaysLater = new Date(now);
              threeDaysLater.setDate(threeDaysLater.getDate() + 3);

              // Cari kendaraan dengan STNK atau KIR yang akan expired dalam 3 hari
              const vehicles = await this.vehicleRepo.find({
                where: { status: VehicleStatus.ACTIVE },
              });

              let reminderCount = 0;
              for (const vehicle of vehicles) {
                let needsReminder = false;

                if (
                  vehicle.stnkExpiry &&
                  new Date(vehicle.stnkExpiry) <= threeDaysLater
                ) {
                  needsReminder = true;
                }
                if (
                  vehicle.kirExpiry &&
                  new Date(vehicle.kirExpiry) <= threeDaysLater
                ) {
                  needsReminder = true;
                }

                if (needsReminder) {
                  await this.notificationService.sendMaintenanceReminderNotification(
                    vehicle,
                  );
                  reminderCount++;
                }
              }

              return reminderCount;
            }
          }

      - file_path: "src/modules/fleet/vehicle-state-machine.controller.ts"
        code: |
          import {
            Controller,
            Post,
            Param,
            Body,
            HttpCode,
            HttpStatus,
          } from '@nestjs/common';
          import { VehicleStateMachineService } from './vehicle-state-machine.service';
          import { RequirePermissions } from '../iam/decorators/require-permissions.decorator';
          import { Vehicle } from './entities/vehicle.entity';
          import { ApiTags, ApiOperation, ApiResponse } from '@nestjs/swagger';

          @ApiTags('Vehicle State Machine')
          @Controller('vehicles')
          export class VehicleStateMachineController {
            constructor(
              private readonly stateMachine: VehicleStateMachineService,
            ) {}

            /**
             * Kirim kendaraan ke maintenance — Active -> Maintenance.
             * Role: fleet_supervisor, operations_manager
             */
            @Post(':vehicleId/maintenance/start')
            @HttpCode(HttpStatus.OK)
            @RequirePermissions('fleet.manage')
            @ApiOperation({ summary: 'Kirim kendaraan ke maintenance — Active -> Maintenance' })
            async sendToMaintenance(
              @Param('vehicleId') vehicleId: string,
              @Body() body: {
                maintenanceDate: string;
                maintenanceType: string;
                notes?: string;
              },
            ): Promise<Vehicle> {
              return this.stateMachine.sendToMaintenance(
                vehicleId,
                new Date(body.maintenanceDate),
                body.maintenanceType,
                body.notes,
              );
            }

            /**
             * Kembalikan kendaraan dari maintenance — Maintenance -> Active.
             * Role: fleet_supervisor, operations_manager
             */
            @Post(':vehicleId/maintenance/complete')
            @HttpCode(HttpStatus.OK)
            @RequirePermissions('fleet.manage')
            @ApiOperation({ summary: 'Selesaikan maintenance — Maintenance -> Active' })
            async returnFromMaintenance(
              @Param('vehicleId') vehicleId: string,
              @Body('completionNotes') completionNotes?: string,
            ): Promise<Vehicle> {
              return this.stateMachine.returnFromMaintenance(vehicleId, completionNotes);
            }

            /**
             * Nonaktifkan kendaraan — Active -> Inactive.
             * Role: operations_manager
             */
            @Post(':vehicleId/deactivate')
            @HttpCode(HttpStatus.OK)
            @RequirePermissions('fleet.manage')
            @ApiOperation({ summary: 'Nonaktifkan kendaraan — Active -> Inactive' })
            async deactivateVehicle(
              @Param('vehicleId') vehicleId: string,
              @Body('reason') reason: string,
            ): Promise<Vehicle> {
              return this.stateMachine.deactivateVehicle(vehicleId, reason);
            }

            /**
             * Trigger maintenance reminders (cron).
             */
            @Post('maintenance/reminders')
            @HttpCode(HttpStatus.OK)
            @RequirePermissions('fleet.manage')
            @ApiOperation({ summary: 'Kirim reminder maintenance jatuh tempo' })
            async sendReminders(): Promise<{ reminderCount: number }> {
              const reminderCount = await this.stateMachine.sendMaintenanceReminders();
              return { reminderCount };
            }
          }

# ═══════════════════════════════════════════════════════════════════════════════
# SCHEDULED JOBS (CRON)
# ═══════════════════════════════════════════════════════════════════════════════
scheduled_jobs:
  description: >
    Cron jobs yang diperlukan untuk menjalankan state machine transitions
    secara otomatis berdasarkan waktu. Gunakan @nestjs/schedule.
  jobs:
    - name: "AutoCancelOverdueBookings"
      schedule: "0 * * * *"  # Setiap jam
      handler: "BookingStateMachineService.batchAutoCancelOverdue"
      description: "Auto-cancel booking DP_Paid yang melewati settlement deadline"

    - name: "ExpirePaymentIntents"
      schedule: "*/15 * * * *"  # Setiap 15 menit
      handler: "PaymentStateMachineService.batchExpireIntents"
      description: "Expire payment intents yang melewati expires_at"

    - name: "SuspendGraceExpiredTenants"
      schedule: "0 0 * * *"  # Setiap hari jam 00:00
      handler: "TenantSubscriptionStateMachineService.batchSuspendExpiredGrace"
      description: "Suspend tenant yang melewati grace period"

    - name: "MaintenanceReminders"
      schedule: "0 8 * * *"  # Setiap hari jam 08:00
      handler: "VehicleStateMachineService.sendMaintenanceReminders"
      description: "Kirim notifikasi maintenance jatuh tempo (STNK, KIR)"

    - name: "DpSettlementReminders"
      schedule: "0 9 * * *"  # Setiap hari jam 09:00
      handler: "NotificationService.sendDpReminders"
      description: "Kirim reminder pelunasan DP H-3 dan H-1 ke customer"
