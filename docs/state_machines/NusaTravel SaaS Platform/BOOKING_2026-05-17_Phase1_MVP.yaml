      - file_path: "src/modules/payment/refund-state-machine.service.ts"
        code: |
          import {
            Injectable,
            BadRequestException,
            NotFoundException,
            ForbiddenException,
          } from '@nestjs/common';
          import { InjectRepository } from '@nestjs/typeorm';
          import { Repository, DataSource } from 'typeorm';
          import { Refund, RefundStatus, RefundType } from './entities/refund.entity';
          import { PaymentIntent, PaymentIntentStatus } from './entities/payment-intent.entity';
          import { PaymentStateMachineService } from './payment-state-machine.service';
          import { TenantContextService } from '../iam/services/tenant-context.service';
          import { NotificationService } from '../notification/notification.service';
          import { AuditService } from '../audit/audit.service';
          import { ulid } from 'ulid';

          /**
           * Refund State Machine.
           *
           * Valid transitions:
           *   Requested ──┬──> Approved   (approval oleh tenant_owner/operations_manager)
           *               └──> Rejected   (ditolak approver)
           *   Approved ──────> Completed  (gateway memproses refund)
           */
          @Injectable()
          export class RefundStateMachineService {
            private readonly VALID_TRANSITIONS: Record<RefundStatus, RefundStatus[]> = {
              [RefundStatus.REQUESTED]: [
                RefundStatus.APPROVED,
                RefundStatus.REJECTED,
              ],
              [RefundStatus.APPROVED]: [
                RefundStatus.COMPLETED,
              ],
              [RefundStatus.REJECTED]: [],
              [RefundStatus.COMPLETED]: [],
            };

            constructor(
              @InjectRepository(Refund)
              private readonly refundRepo: Repository<Refund>,
              @InjectRepository(PaymentIntent)
              private readonly intentRepo: Repository<PaymentIntent>,
              private readonly paymentStateMachine: PaymentStateMachineService,
              private readonly tenantContext: TenantContextService,
              private readonly notificationService: NotificationService,
              private readonly auditService: AuditService,
              private readonly dataSource: DataSource,
            ) {}

            private validateTransition(
              currentStatus: RefundStatus,
              targetStatus: RefundStatus,
            ): void {
              const allowed = this.VALID_TRANSITIONS[currentStatus];
              if (!allowed || !allowed.includes(targetStatus)) {
                throw new BadRequestException(
                  `Transisi Refund tidak valid: ${currentStatus} -> ${targetStatus}`,
                );
              }
            }

            private async findRefundOrFail(refundId: string): Promise<Refund> {
              const tenantId = this.tenantContext.getTenantId();
              const refund = await this.refundRepo.findOne({
                where: { id: refundId },
                relations: ['booking', 'paymentIntent'],
              });
              if (!refund) {
                throw new NotFoundException(`Refund ${refundId} tidak ditemukan`);
              }
              return refund;
            }

            // ──────────────────────────────────────────────────────────────
            // CREATE REFUND REQUEST
            // ──────────────────────────────────────────────────────────────

            /**
             * Membuat refund request baru — status awal: Requested.
             * Dipanggil setelah booking di-cancel (dari DP_Paid atau Confirmed).
             */
            async createRefundRequest(params: {
              bookingId: string;
              paymentIntentId: string;
              refundType: RefundType;
              refundAmount: number;
              reason: string;
              requestedBy: string;
            }): Promise<Refund> {
              // Validasi payment intent exists dan statusnya Paid
              const intent = await this.intentRepo.findOne({
                where: { id: params.paymentIntentId },
              });
              if (!intent) {
                throw new NotFoundException('PaymentIntent tidak ditemukan');
              }
              if (intent.status !== PaymentIntentStatus.PAID) {
                throw new BadRequestException(
                  'Hanya PaymentIntent dengan status Paid yang dapat direfund',
                );
              }

              // Validasi refund amount tidak melebihi amount yang dibayar
              if (params.refundAmount > intent.amount) {
                throw new BadRequestException(
                  `Jumlah refund (${params.refundAmount}) melebihi jumlah pembayaran (${intent.amount})`,
                );
              }

              const refund = this.refundRepo.create({
                id: ulid(),
                bookingId: params.bookingId,
                paymentIntentId: params.paymentIntentId,
                refundType: params.refundType,
                refundAmount: params.refundAmount,
                reason: params.reason,
                status: RefundStatus.REQUESTED,
                requestedBy: params.requestedBy,
                requestedAt: new Date(),
              });

              await this.refundRepo.save(refund);

              // Notifikasi ke approver
              await this.notificationService.sendRefundRequestedNotification(refund);

              await this.auditService.log({
                userId: params.requestedBy,
                tenantId: this.tenantContext.getTenantId(),
                action: 'refund.requested',
                resourceType: 'Refund',
                resourceId: refund.id,
                newValues: {
                  status: RefundStatus.REQUESTED,
                  refundAmount: params.refundAmount,
                  refundType: params.refundType,
                },
              });

              return refund;
            }

            // ──────────────────────────────────────────────────────────────
            // TRANSISI: Requested -> Approved
            // ──────────────────────────────────────────────────────────────

            /**
             * Approve refund request — Requested -> Approved.
             * Hanya tenant_owner atau operations_manager yang bisa approve.
             *
             * Side effects:
             * - Status refund -> Approved
             * - Trigger proses refund ke payment gateway
             * - Setelah gateway sukses, transisi ke Completed
             */
            async approveRefund(
              refundId: string,
              approvedBy: string,
              approvalNotes?: string,
            ): Promise<Refund> {
              const refund = await this.findRefundOrFail(refundId);
              this.validateTransition(refund.status, RefundStatus.APPROVED);

              refund.status = RefundStatus.APPROVED;
              refund.approvedBy = approvedBy;
              refund.approvedAt = new Date();
              refund.approvalNotes = approvalNotes;
              await this.refundRepo.save(refund);

              // Trigger refund ke payment gateway (async)
              await this.processRefundToGateway(refund);

              await this.notificationService.sendRefundApprovedNotification(refund);

              await this.auditService.log({
                userId: approvedBy,
                tenantId: this.tenantContext.getTenantId(),
                action: 'refund.approved',
                resourceType: 'Refund',
                resourceId: refund.id,
                newValues: {
                  status: RefundStatus.APPROVED,
                  approvedBy,
                },
              });

              return refund;
            }

            // ──────────────────────────────────────────────────────────────
            // TRANSISI: Requested -> Rejected
            // ──────────────────────────────────────────────────────────────

            /**
             * Tolak refund request — Requested -> Rejected.
             */
            async rejectRefund(
              refundId: string,
              rejectedBy: string,
              rejectionReason: string,
            ): Promise<Refund> {
              const refund = await this.findRefundOrFail(refundId);
              this.validateTransition(refund.status, RefundStatus.REJECTED);

              refund.status = RefundStatus.REJECTED;
              refund.rejectedBy = rejectedBy;
              refund.rejectedAt = new Date();
              refund.rejectionReason = rejectionReason;
              await this.refundRepo.save(refund);

              await this.notificationService.sendRefundRejectedNotification(refund);

              await this.auditService.log({
                userId: rejectedBy,
                tenantId: this.tenantContext.getTenantId(),
                action: 'refund.rejected',
                resourceType: 'Refund',
                resourceId: refund.id,
                newValues: {
                  status: RefundStatus.REJECTED,
                  rejectionReason,
                },
              });

              return refund;
            }

            // ──────────────────────────────────────────────────────────────
            // TRANSISI: Approved -> Completed
            // ──────────────────────────────────────────────────────────────

            /**
             * Tandai refund selesai — Approved -> Completed.
             * Dipanggil setelah gateway mengkonfirmasi refund berhasil diproses.
             */
            async completeRefund(
              refundId: string,
              gatewayRefundId: string,
            ): Promise<Refund> {
              const refund = await this.findRefundOrFail(refundId);
              this.validateTransition(refund.status, RefundStatus.COMPLETED);

              const queryRunner = this.dataSource.createQueryRunner();
              await queryRunner.connect();
              await queryRunner.startTransaction();

              try {
                refund.status = RefundStatus.COMPLETED;
                refund.completedAt = new Date();
                refund.gatewayRefundId = gatewayRefundId;
                await queryRunner.manager.save(refund);

                // Update PaymentIntent -> Refunded
                if (refund.paymentIntentId) {
                  await this.paymentStateMachine.markAsRefunded(refund.paymentIntentId);
                }

                await queryRunner.commitTransaction();

                await this.notificationService.sendRefundCompletedNotification(refund);

                await this.auditService.log({
                  userId: 'system',
                  tenantId: this.tenantContext.getTenantId(),
                  action: 'refund.completed',
                  resourceType: 'Refund',
                  resourceId: refund.id,
                  newValues: {
                    status: RefundStatus.COMPLETED,
                    gatewayRefundId,
                  },
                });

                return refund;
              } catch (error) {
                await queryRunner.rollbackTransaction();
                throw error;
              } finally {
                await queryRunner.release();
              }
            }

            // ──────────────────────────────────────────────────────────────
            // GATEWAY INTEGRATION
            // ──────────────────────────────────────────────────────────────

            /**
             * Proses refund ke payment gateway.
             * Dalam implementasi nyata, ini akan memanggil API gateway (Midtrans refund, dll).
             */
            private async processRefundToGateway(refund: Refund): Promise<void> {
              // TODO: Integrasi dengan payment gateway untuk memproses refund
              // Contoh: panggil Midtrans refund API, Xendit refund API, dll.
              // Setelah gateway sukses, panggil completeRefund()

              // Untuk sekarang, simulasi async processing
              console.log(
                `[Refund] Memproses refund ${refund.id} sebesar ${refund.refundAmount} ke gateway`,
              );
            }
          }

      - file_path: "src/modules/payment/refund-state-machine.controller.ts"
        code: |
          import {
            Controller,
            Post,
            Get,
            Param,
            Body,
            HttpCode,
            HttpStatus,
            Query,
          } from '@nestjs/common';
          import { RefundStateMachineService } from './refund-state-machine.service';
          import { RequirePermissions } from '../iam/decorators/require-permissions.decorator';
          import { CurrentUser } from '../iam/decorators/current-user.decorator';
          import { Refund, RefundType } from './entities/refund.entity';
          import { ApiTags, ApiOperation, ApiResponse } from '@nestjs/swagger';

          @ApiTags('Refund State Machine')
          @Controller('refunds')
          export class RefundStateMachineController {
            constructor(
              private readonly stateMachine: RefundStateMachineService,
            ) {}

            /**
             * Buat refund request baru.
             * Role: finance_staff, booking_staff_cs
             */
            @Post()
            @HttpCode(HttpStatus.CREATED)
            @RequirePermissions('refund.create')
            @ApiOperation({ summary: 'Buat refund request — status Requested' })
            async createRefund(
              @Body() body: {
                bookingId: string;
                paymentIntentId: string;
                refundType: RefundType;
                refundAmount: number;
                reason: string;
              },
              @CurrentUser('id') userId: string,
            ): Promise<Refund> {
              return this.stateMachine.createRefundRequest({
                ...body,
                requestedBy: userId,
              });
            }

            /**
             * Approve refund request.
             * Role: tenant_owner, operations_manager
             */
            @Post(':refundId/approve')
            @HttpCode(HttpStatus.OK)
            @RequirePermissions('refund.approve')
            @ApiOperation({ summary: 'Approve refund — Requested -> Approved' })
            async approveRefund(
              @Param('refundId') refundId: string,
              @CurrentUser('id') userId: string,
              @Body('approvalNotes') approvalNotes?: string,
            ): Promise<Refund> {
              return this.stateMachine.approveRefund(refundId, userId, approvalNotes);
            }

            /**
             * Tolak refund request.
             * Role: tenant_owner, operations_manager
             */
            @Post(':refundId/reject')
            @HttpCode(HttpStatus.OK)
            @RequirePermissions('refund.approve')
            @ApiOperation({ summary: 'Tolak refund — Requested -> Rejected' })
            async rejectRefund(
              @Param('refundId') refundId: string,
              @CurrentUser('id') userId: string,
              @Body('rejectionReason') rejectionReason: string,
            ): Promise<Refund> {
              return this.stateMachine.rejectRefund(refundId, userId, rejectionReason);
            }

            /**
             * Webhook dari gateway untuk konfirmasi refund selesai.
             */
            @Post(':refundId/complete')
            @HttpCode(HttpStatus.OK)
            @RequirePermissions('refund.manage')
            @ApiOperation({ summary: 'Konfirmasi refund selesai — Approved -> Completed' })
            async completeRefund(
              @Param('refundId') refundId: string,
              @Body('gatewayRefundId') gatewayRefundId: string,
            ): Promise<Refund> {
              return this.stateMachine.completeRefund(refundId, gatewayRefundId);
            }
          }

