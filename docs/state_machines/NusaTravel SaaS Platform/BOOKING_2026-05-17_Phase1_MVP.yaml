  - module_name: "RefundStateMachineModule"
    description: >
      Mengelola transisi status Refund Lifecycle:
      Requested -> Approved (approval oleh tenant_owner/operations_manager)
      Requested -> Rejected (ditolak approver)
      Approved -> Completed (gateway memproses refund)
    files:
      - file_path: "src/modules/payment/refund-state-machine.module.ts"
        code: |
          import { Module } from '@nestjs/common';
          import { TypeOrmModule } from '@nestjs/typeorm';
          import { RefundStateMachineService } from './refund-state-machine.service';
          import { RefundStateMachineController } from './refund-state-machine.controller';
