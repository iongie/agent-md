      - file_path: "src/modules/payment/payment-state-machine.service.ts"
        code: |
          import {
            Injectable,
            BadRequestException,
            NotFoundException,
          } from '@nestjs/common';
          import { InjectRepository } from '@nestjs/typeorm';
          import { Repository, DataSource } from 'typeorm';
          import {
            PaymentIntent,
            PaymentIntentStatus,
            PaymentIntentType,
          } from './entities/payment-intent.entity';
          import {
            PaymentTransaction,
            TransactionStatus,
          } from './entities/payment-transaction.entity';
          import { Booking, BookingStatus } from '../booking/entities/booking.entity';
          import { BookingStateMachineService } from '../booking/booking-state-machine.service';
          import { TenantContextService } from '../iam/services/tenant-context.service';
          import { NotificationService } from '../notification/notification.service';
          import { AuditService } from '../audit/audit.service';

          /**
           * Payment Intent State Machine.
           *
           * Valid transitions:
           *   Pending ──┬──> Paid      (webhook gateway konfirmasi)
           *             ├──> Expired   (melewati batas waktu)
           *             └──> Failed    (gateway melaporkan kegagalan)
           *   Paid ────────> Refunded  (setelah refund diproses)
           */
          @Injectable()
          export class PaymentStateMachineService {
            private readonly VALID_TRANSITIONS: Record<PaymentIntentStatus, PaymentIntentStatus[]> = {
              [PaymentIntentStatus.PENDING]: [
                PaymentIntentStatus.PAID,
                PaymentIntentStatus.EXPIRED,
                PaymentIntentStatus.FAILED,
              ],
              [PaymentIntentStatus.PAID]: [
                PaymentIntentStatus.REFUNDED,
              ],
              [PaymentIntentStatus.EXPIRED]: [],
              [PaymentIntentStatus.FAILED]: [],
              [PaymentIntentStatus.REFUNDED]: [],
            };

            constructor(
              @InjectRepository(PaymentIntent)
              private readonly intentRepo: Repository<PaymentIntent>,
              @InjectRepository(PaymentTransaction)
              private readonly transactionRepo: Repository<PaymentTransaction>,
              @InjectRepository(Booking)
              private readonly bookingRepo: Repository<Booking>,
              private readonly bookingStateMachine: BookingStateMachineService,
              private readonly tenantContext: TenantContextService,
              private readonly notificationService: NotificationService,
              private readonly auditService: AuditService,
              private readonly dataSource: DataSource,
            ) {}

            private validateTransition(
              currentStatus: PaymentIntentStatus,
              targetStatus: PaymentIntentStatus,
            ): void {
              const allowed = this.VALID_TRANSITIONS[currentStatus];
              if (!allowed || !allowed.includes(targetStatus)) {
                throw new BadRequestException(
                  `Transisi PaymentIntent tidak valid: ${currentStatus} -> ${targetStatus}`,
                );
              }
            }

            private async findIntentOrFail(intentId: string): Promise<PaymentIntent> {
              const intent = await this.intentRepo.findOne({
                where: { id: intentId },
                relations: ['booking'],
              });
              if (!intent) {
                throw new NotFoundException(
                  `PaymentIntent ${intentId} tidak ditemukan`,
                );
              }
              return intent;
            }

            // ──────────────────────────────────────────────────────────────
            // TRANSISI: Pending -> Paid
            // ──────────────────────────────────────────────────────────────

            /**
             * Proses webhook dari payment gateway — konfirmasi pembayaran berhasil.
             * Ini adalah entry point utama dari payment gateway callback.
             *
             * Flow:
             * 1. Validasi signature webhook
             * 2. Cari PaymentIntent berdasarkan gateway_transaction_id atau VA number
             * 3. Transisi Pending -> Paid
             * 4. Catat PaymentTransaction
             * 5. Trigger Booking state machine (DP_Paid atau Confirmed)
             */
            async confirmPayment(
              intentId: string,
              gatewayTransactionId: string,
              amountReceived: number,
              rawPayload: Record<string, any>,
            ): Promise<PaymentIntent> {
              const intent = await this.findIntentOrFail(intentId);
              this.validateTransition(intent.status, PaymentIntentStatus.PAID);

              const queryRunner = this.dataSource.createQueryRunner();
              await queryRunner.connect();
              await queryRunner.startTransaction();

              try {
                // Update PaymentIntent
                intent.status = PaymentIntentStatus.PAID;
                intent.paidAt = new Date();
                await queryRunner.manager.save(intent);

                // Catat PaymentTransaction
                const transaction = this.transactionRepo.create({
                  id: require('ulid').ulid(),
                  paymentIntentId: intent.id,
                  gatewayTransactionId,
                  amountReceived,
                  status: TransactionStatus.CONFIRMED,
                  paidAt: new Date(),
                  rawWebhookPayload: rawPayload,
                });
                await queryRunner.manager.save(transaction);

                await queryRunner.commitTransaction();

                // Trigger Booking state machine berdasarkan intent_type
                await this.triggerBookingTransition(intent);

                await this.auditService.log({
                  userId: 'system',
                  tenantId: intent.booking?.tenantId,
                  action: 'payment.confirmed',
                  resourceType: 'PaymentIntent',
                  resourceId: intent.id,
                  newValues: {
                    status: PaymentIntentStatus.PAID,
                    gatewayTransactionId,
                    amountReceived,
                  },
                });

                return intent;
              } catch (error) {
                await queryRunner.rollbackTransaction();
                throw error;
              } finally {
                await queryRunner.release();
              }
            }

            /**
             * Trigger transisi Booking yang sesuai setelah payment confirmed.
             */
            private async triggerBookingTransition(intent: PaymentIntent): Promise<void> {
              if (!intent.bookingId) return;

              switch (intent.intentType) {
                case PaymentIntentType.DP:
                  // DP dibayar -> Booking: Draft -> DP_Paid
                  await this.bookingStateMachine.confirmDpPayment(intent.bookingId);
                  break;

                case PaymentIntentType.FULL:
                  // Full payment -> Booking: Draft -> Confirmed
                  await this.bookingStateMachine.confirmFullPayment(intent.bookingId);
                  break;

                case PaymentIntentType.SETTLEMENT:
                  // Pelunasan -> Booking: DP_Paid -> Confirmed
                  await this.bookingStateMachine.confirmSettlement(intent.bookingId);
                  break;

                default:
                  // deposit_hold, deposit_release — tidak trigger booking transition
                  break;
              }
            }

            // ──────────────────────────────────────────────────────────────
            // TRANSISI: Pending -> Expired
            // ──────────────────────────────────────────────────────────────

            /**
             * Payment intent expired — Pending -> Expired.
             * Dipanggil oleh cron job atau webhook gateway.
             */
            async expireIntent(intentId: string): Promise<PaymentIntent> {
              const intent = await this.findIntentOrFail(intentId);
              this.validateTransition(intent.status, PaymentIntentStatus.EXPIRED);

              intent.status = PaymentIntentStatus.EXPIRED;
              await this.intentRepo.save(intent);

              // Jika ini DP intent, trigger auto-cancel booking
              if (
                intent.intentType === PaymentIntentType.DP &&
                intent.bookingId
              ) {
                const booking = await this.bookingRepo.findOne({
                  where: { id: intent.bookingId },
                });
                if (booking?.bookingStatus === BookingStatus.DRAFT) {
                  await this.bookingStateMachine.cancelDraftBooking(
                    intent.bookingId,
                    'system',
                    'Payment intent expired',
                  );
                }
              }

              await this.auditService.log({
                userId: 'system',
                tenantId: intent.booking?.tenantId,
                action: 'payment.expired',
                resourceType: 'PaymentIntent',
                resourceId: intent.id,
                newValues: { status: PaymentIntentStatus.EXPIRED },
              });

              return intent;
            }

            /**
             * Batch expire untuk payment intent yang melewati expires_at.
             */
            async batchExpireIntents(): Promise<number> {
              const now = new Date();
              const expiredIntents = await this.intentRepo.find({
                where: { status: PaymentIntentStatus.PENDING },
              });

              let count = 0;
              for (const intent of expiredIntents) {
                if (intent.expiresAt && new Date(intent.expiresAt) <= now) {
                  try {
                    await this.expireIntent(intent.id);
                    count++;
                  } catch (error) {
                    console.error(`Gagal expire intent ${intent.id}:`, error);
                  }
                }
              }
              return count;
            }

            // ──────────────────────────────────────────────────────────────
            // TRANSISI: Pending -> Failed
            // ──────────────────────────────────────────────────────────────

            /**
             * Payment failed — Pending -> Failed.
             * Gateway melaporkan kegagalan (dana tidak cukup, dll).
             */
            async failIntent(
              intentId: string,
              failureReason?: string,
            ): Promise<PaymentIntent> {
              const intent = await this.findIntentOrFail(intentId);
              this.validateTransition(intent.status, PaymentIntentStatus.FAILED);

              intent.status = PaymentIntentStatus.FAILED;
              intent.failureReason = failureReason;
              await this.intentRepo.save(intent);

              await this.notificationService.sendPaymentFailedNotification(intent);

              await this.auditService.log({
                userId: 'system',
                tenantId: intent.booking?.tenantId,
                action: 'payment.failed',
                resourceType: 'PaymentIntent',
                resourceId: intent.id,
                newValues: {
                  status: PaymentIntentStatus.FAILED,
                  failureReason,
                },
              });

              return intent;
            }

            // ──────────────────────────────────────────────────────────────
            // TRANSISI: Paid -> Refunded
            // ──────────────────────────────────────────────────────────────

            /**
             * Payment direfund — Paid -> Refunded.
             * Dipanggil setelah Refund state machine mencapai status Completed.
             */
            async markAsRefunded(intentId: string): Promise<PaymentIntent> {
              const intent = await this.findIntentOrFail(intentId);
              this.validateTransition(intent.status, PaymentIntentStatus.REFUNDED);

              intent.status = PaymentIntentStatus.REFUNDED;
              intent.refundedAt = new Date();
              await this.intentRepo.save(intent);

              await this.auditService.log({
                userId: 'system',
                tenantId: intent.booking?.tenantId,
                action: 'payment.refunded',
                resourceType: 'PaymentIntent',
                resourceId: intent.id,
                newValues: { status: PaymentIntentStatus.REFUNDED },
              });

              return intent;
            }
          }

      - file_path: "src/modules/payment/payment-state-machine.controller.ts"
        code: |
          import {
            Controller,
            Post,
            Param,
            Body,
            HttpCode,
            HttpStatus,
            Headers,
            RawBodyRequest,
            Req,
          } from '@nestjs/common';
          import { PaymentStateMachineService } from './payment-state-machine.service';
          import { RequirePermissions } from '../iam/decorators/require-permissions.decorator';
          import { PaymentIntent } from './entities/payment-intent.entity';
          import { ApiTags, ApiOperation, ApiResponse } from '@nestjs/swagger';
          import { Request } from 'express';

          @ApiTags('Payment State Machine')
          @Controller('payments')
          export class PaymentStateMachineController {
            constructor(
              private readonly stateMachine: PaymentStateMachineService,
            ) {}

            /**
             * Webhook endpoint untuk payment gateway (Midtrans, Xendit, dll).
             * Endpoint ini PUBLIC — tidak memerlukan autentikasi user.
             * Keamanan: validasi signature/callback token dari gateway.
             */
            @Post('webhook/:gateway')
            @HttpCode(HttpStatus.OK)
            @ApiOperation({ summary: 'Webhook payment gateway — Pending -> Paid/Failed' })
            async handleWebhook(
              @Param('gateway') gateway: string,
              @Headers() headers: Record<string, string>,
              @Req() req: RawBodyRequest<Request>,
            ): Promise<{ status: string }> {
              // Validasi signature webhook berdasarkan gateway
              // Ini harus diimplementasikan sesuai dokumentasi masing-masing gateway
              const payload = req.body as any;

              // Cari PaymentIntent berdasarkan order_id dari gateway
              const intentId = payload.order_id;

              if (payload.transaction_status === 'settlement' || payload.status === 'PAID') {
                await this.stateMachine.confirmPayment(
                  intentId,
                  payload.transaction_id,
                  payload.gross_amount,
                  payload,
                );
              } else if (
                payload.transaction_status === 'expire' ||
                payload.transaction_status === 'cancel'
              ) {
                await this.stateMachine.expireIntent(intentId);
              } else if (
                payload.transaction_status === 'deny' ||
                payload.transaction_status === 'failure'
              ) {
                await this.stateMachine.failIntent(
                  intentId,
                  payload.status_message,
                );
              }

              return { status: 'ok' };
            }

            /**
             * Manual trigger expire (admin).
             */
            @Post(':intentId/expire')
            @HttpCode(HttpStatus.OK)
            @RequirePermissions('payment.manage')
            @ApiOperation({ summary: 'Expire payment intent — Pending -> Expired' })
            async expireIntent(
              @Param('intentId') intentId: string,
            ): Promise<PaymentIntent> {
              return this.stateMachine.expireIntent(intentId);
            }

            /**
             * Batch expire intents (cron trigger).
             */
            @Post('batch-expire')
            @HttpCode(HttpStatus.OK)
            @RequirePermissions('payment.manage')
            @ApiOperation({ summary: 'Batch expire payment intents' })
            async batchExpire(): Promise<{ expiredCount: number }> {
              const expiredCount = await this.stateMachine.batchExpireIntents();
              return { expiredCount };
            }
          }

